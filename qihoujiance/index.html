<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClimaQuiz — 世界气候分布测试</title>
<link rel="stylesheet" href="style.css">
<style id='wb-copyright-style'>
#wb-copyright-watermark{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27150%27%3E%3Ctext%20x%3D%270%27%20y%3D%2785%27%20font-family%3D%27sans-serif%27%20font-size%3D%2715%27%20fill%3D%27%23888888%27%20transform%3D%27rotate%28-28%20150%2075%29%27%3E%E6%A8%AA%E5%B1%B1%E6%A1%A5%E9%AB%98%E4%B8%AD%E5%AD%99%E6%85%A7%E5%88%B6%E4%BD%9C%20%C2%B7%20%E4%BB%85%E4%BE%9B%E6%95%99%E5%AD%A6%20%C2%B7%20%E6%9C%AA%E7%BB%8F%E8%AE%B8%E5%8F%AF%E4%B8%8D%E5%BE%97%E5%95%86%E7%94%A8%3C%2Ftext%3E%3C%2Fsvg%3E");background-repeat:repeat;}
#wb-copyright-note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9998;pointer-events:none;font-size:12px;font-family:sans-serif;color:#555;opacity:.78;line-height:1.4;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.07);border-radius:999px;padding:3px 14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}

<body>
<div id="app">

  <!-- 左侧面板：上部 12 个气候按钮区，下部气候信息区 -->
  <aside id="leftPanel">
    <section id="quizPanel">
      <div class="location-line">
        <span id="locName">准备中…</span>
        <span id="coords"></span>
      </div>
      <div id="options"></div>
    </section>

    <section id="infoPanel">
      <div class="info-title">气候信息</div>
      <div id="infoBody">
        <div class="info-hint">🖱️ 开启右上「🌐 气候图」后点击地球，查看该点气候类型；或直接答题。</div>
      </div>
    </section>
  </aside>

  <!-- 右侧：地球 -->
  <main id="globeWrap">
    <div id="globeViz"></div>

    <!-- 顶部计分栏 -->
    <header id="hud">
      <div class="brand">🌍 ClimaQuiz</div>
      <div class="stats">
        <span>第 <b id="qnum">0</b> 题</span>
        <span>得分 <b id="score">0</b></span>
        <span>连对 <b id="streak">0</b> 🔥</span>
        <span>正确率 <b id="accuracy">—</b></span>
      </div>
      <button id="btnMap" class="hud-btn">🌐 气候图</button>
      <button id="btnChart" class="hud-btn hud-on">📊 水热图 开</button>
      <button id="btnSpeak" class="hud-btn">🔊 语音 开</button>
      <button id="btnExit" class="hud-btn hud-exit">⏻ 退出程序</button>
    </header>

    <!-- 气候分布图例面板 -->
    <div id="legendPanel" class="hidden">
      <div class="legend-head">
        <span>世界气候类型分布</span>
        <button id="btnMapClose" class="legend-x">✕</button>
      </div>
      <div id="legendList"></div>
    </div>
  </main>

</div>

<!-- 结算界面 -->
<div id="endScreen" class="center-panel hidden">
  <h2>本轮结束！</h2>
  <div class="final-stats">
    <div class="big"><span id="finalScore">0</span> 分</div>
    <div>答对 <span id="finalCorrect">0</span> / <span id="finalTotal">0</span></div>
    <div>最高连对 <span id="finalStreak">0</span></div>
    <div id="rank"></div>
  </div>
  <button id="btnRestart">再来一局</button>
</div>

<script src="vendor/three.min.js?v=15"></script>
<script src="vendor/globe.gl.js?v=15"></script>
<script src="climates.js?v=24"></script>
<script src="i18n.js?v=24"></script>
<script src="assets.js?v=24"></script>
