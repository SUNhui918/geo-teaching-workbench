<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国·世界地理教学常用图</title>
<style>
:root{--side:#07121d;--panel:#0d1c2b;--line:#1d3448;--acc:#16b4ea;--txt:#dfe9f2;--mut:#8aa3b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;background:#eef3f7;overflow:hidden}
#app{display:flex;height:100vh;height:100dvh}
#side{width:272px;flex:none;background:var(--side);color:var(--txt);overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px;transition:margin .25s}
#app.collapsed #side{margin-left:-272px}
#side>*{flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:18px;margin:0;letter-spacing:1px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--txt);border:0;padding:8px 4px;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px 10px}
section h3{margin:0 0 7px;font-size:13px;color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
.grid label,.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;line-height:1.25;padding:3px 0;color:var(--txt)}
.grid input,.chk input{accent-color:var(--acc);margin:0;flex:none;width:15px;height:15px}
.grid label.on{color:#fff;font-weight:600}
.foot{margin-top:auto;font-size:11px;color:var(--mut);line-height:1.5;text-align:center;padding-top:6px}
#sideToggle{position:absolute;z-index:20;left:272px;top:50%;transform:translateY(-50%);width:16px;height:46px;border:0;border-radius:0 6px 6px 0;background:var(--side);color:#9cc;cursor:pointer;transition:left .25s;font-size:10px;padding:0}
#app.collapsed #sideToggle{left:0}
#stage{position:relative;flex:1;min-width:0;background:#fff}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
#title{position:absolute;left:14px;bottom:14px;background:#fff;border:1.5px solid #333;padding:4px 14px;font-size:24px;letter-spacing:2px;font-weight:500;pointer-events:none}
#legend{position:absolute;left:14px;bottom:62px;background:rgba(255,255,255,.93);border:1px solid #9aa;border-radius:6px;padding:7px 10px;font-size:13px;max-width:min(330px,45%);max-height:55%;overflow:auto}
#legend:empty{display:none}
#legend .lt{font-weight:600;margin-bottom:4px;text-align:center}
#legend .li{display:flex;align-items:center;gap:6px;margin:2px 0;line-height:1.2}
#legend .sw{width:22px;height:13px;border:1px solid rgba(0,0,0,.35);flex:none}
#legend .ln{width:22px;height:0;border-top:3px solid #c00;flex:none}
#legend .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#scale{position:absolute;right:14px;bottom:10px;font-size:12px;pointer-events:none;text-align:right}
#scale .bar{height:6px;border:1.5px solid #222;border-top:0;margin-top:1px}
#tools{position:absolute;right:12px;top:10px;display:flex;gap:6px}
#tools button{background:#13283a;color:#dfe9f2;border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
#tip{position:absolute;pointer-events:none;background:rgba(10,25,40,.88);color:#fff;font-size:13px;padding:4px 8px;border-radius:5px;display:none;white-space:nowrap;z-index:5}
#notes{position:absolute;right:12px;top:48px;width:min(300px,40%);z-index:4;background:rgba(255,255,255,.95);border:1px solid #b8c7d3;border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.08);max-height:60%;overflow:auto}
#notes:empty,#notes.hide{display:none}
#notes h4{margin:0 0 4px;font-size:14px;color:#0b6c95}
#notes ul{margin:0 0 6px;padding-left:18px}
#notes details{margin:4px 0;background:#f2f7fa;border-radius:5px;padding:3px 7px}
#notes summary{cursor:pointer;font-weight:600;color:#234}
#nd>summary{list-style:none;color:#0b6c95}#nd>summary::before{content:'▸ ';}#nd[open]>summary::before{content:'▾ ';}#nd>summary h4{margin:0}
#notes details p{margin:3px 0 2px;color:#a33}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);font-size:18px;color:#345;z-index:30;text-align:center;padding:20px;line-height:1.7}
#loading.hide{display:none}
/* svg styles */
.root path{vector-effect:non-scaling-stroke}
.lbl text{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl.nohalo text{stroke:none}
@media (max-width:760px){
 #side{position:absolute;z-index:15;height:100%;box-shadow:4px 0 12px rgba(0,0,0,.3)}
 #title{font-size:17px;padding:3px 9px}
 #legend{bottom:50px;font-size:11.5px;max-width:60%}
 #notes{width:64%;font-size:12.5px}
}
</style>
</head>

function loadScript(urls,check){
 return new Promise(function(res,rej){
  var i=0;
  (function next(){
   if(check&&check()) return res();
   if(i>=urls.length) return rej(new Error('load fail'));
   var s=document.createElement('script');s.src=urls[i++];
   s.onload=function(){ if(!check||check()) res(); else next(); };
   s.onerror=function(){ s.remove(); next(); };
   document.head.appendChild(s);
  })();
 });
}

function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* echarts UTF8 编码解码 + 环方向修正 */
function decRing(str,off,scale){
 var r=[],px=off[0],py=off[1];
 for(var i=0;i<str.length;i+=2){
  var x=str.charCodeAt(i)-64,y=str.charCodeAt(i+1)-64;
  x=(x>>1)^(-(x&1)); y=(y>>1)^(-(y&1));
  x+=px;y+=py;px=x;py=y;r.push([x/scale,y/scale]);
 }
 return r;
}
function sArea(r){var s=0;for(var i=0,n=r.length;i<n;i++){var a=r[i],b=r[(i+1)%n];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function pip(pt,r){var x=pt[0],y=pt[1],ins=false;for(var i=0,j=r.length-1;i<r.length;j=i++){var xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function buildGeom(rings){
 rings=rings.filter(function(r){return r.length>=4;}).map(function(r){
  var a=r[0],b=r[r.length-1]; if(a[0]!==b[0]||a[1]!==b[1]) r=r.concat([a]); return r;});
 var info=rings.map(function(r){var m=[0,0];r.forEach(function(p){m[0]+=p[0];m[1]+=p[1];});return {r:r,a:Math.abs(sArea(r)),m:[m[0]/r.length,m[1]/r.length]};});
 info.sort(function(p,q){return q.a-p.a;});
 var polys=[];
 info.forEach(function(it){
  var host=null;
  for(var k=0;k<polys.length;k++){ if(pip(it.m,polys[k][0])){host=polys[k];break;} }
  var r=it.r.slice();
  if(host){ if(sArea(r)<0) r.reverse(); host.push(r); }
  else { if(sArea(r)>0) r.reverse(); polys.push([r]); }
 });
 polys.forEach(function(p){
  if(d3.geoArea({type:'Polygon',coordinates:p})>2*Math.PI) p.forEach(function(r){r.reverse();});
 });
 return {type:'MultiPolygon',coordinates:polys};
}
function decodeGeo(json){
 var sc=json.UTF8Scale||1024,out={type:'FeatureCollection',features:[]};
 json.features.forEach(function(f){
  var g=f.geometry,rings=[];
  if(!g) return;
  if(json.UTF8Encoding){
   if(g.type==='Polygon') g.coordinates.forEach(function(r,i){rings.push(decRing(r,g.encodeOffsets[i],sc));});
   else if(g.type==='MultiPolygon') g.coordinates.forEach(function(p,i){p.forEach(function(r,j){rings.push(decRing(r,g.encodeOffsets[i][j],sc));});});
  } else {
   if(g.type==='Polygon') g.coordinates.forEach(function(r){rings.push(r);});
   else if(g.type==='MultiPolygon') g.coordinates.forEach(function(p){p.forEach(function(r){rings.push(r);});});
  }
  out.features.push({type:'Feature',properties:f.properties||{},geometry:buildGeom(rings)});
 });
 return out;
}

function norm(x){while(x>180)x-=360;while(x<-180)x+=360;return x;}
function dens(c,step){step=step||1;var o=[];for(var i=0;i<c.length-1;i++){var a=c[i],b=c[i+1].slice();if(b[0]-a[0]>180)b[0]-=360;else if(a[0]-b[0]>180)b[0]+=360;n=Math.max(1,Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))/step));for(var k=0;k<n;k++)o.push([norm(a[0]+(b[0]-a[0])*k/n),a[1]+(b[1]-a[1])*k/n]);}var e=c[c.length-1];o.push([norm(e[0]),e[1]]);return o;}
var _pc=new Map();
function poly(c){

 _pc.set(c,f); return f;
}
function line(c){return {type:'Feature',geometry:{type:'LineString',coordinates:dens(c,1)}};}

var FS=12;
function lab(g,text,lon,lat,size,color,rot,opt){
 if(!S.labels&&!(opt&&opt.force))return;

 if(color==='#fff')t.style('stroke','rgba(0,0,0,.6)');

}

 img.onload=function(){
  var cv=document.createElement('canvas');cv.width=Wd*SC;cv.height=Ht*SC;var c=cv.getContext('2d');c.scale(SC,SC);
  c.fillStyle='#fff';c.fillRect(0,0,Wd,Ht);c.drawImage(img,0,0,Wd,Ht);
  var F='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
  // 图名
  var title=$('title').textContent;c.font='500 24px '+F;var tw=c.measureText(title).width+28;
  c.fillStyle='#fff';c.fillRect(14,Ht-14-38,tw,38);c.strokeStyle='#333';c.lineWidth=1.5;c.strokeRect(14,Ht-14-38,tw,38);
  c.fillStyle='#111';c.textBaseline='middle';c.fillText(title,28,Ht-14-19);
  // 图例
  var L=curBase().legend;
  if(L){var items=L.items,cols=L.cols?2:1,rows=Math.ceil(items.length/cols);c.font='13px '+F;
   var cw=0;items.forEach(function(it){cw=Math.max(cw,c.measureText(it[1]).width);});cw+=34;
   var lw=Math.max(cw*cols+16,L.t?c.measureText(L.t).width+20:0),lh=rows*19+(L.t?24:8)+6,lx=14,ly=Ht-62-lh;
   c.fillStyle='rgba(255,255,255,.95)';c.fillRect(lx,ly,lw,lh);c.strokeStyle='#9aa';c.lineWidth=1;c.strokeRect(lx,ly,lw,lh);
   var y0=ly+8;if(L.t){c.fillStyle='#111';c.font='600 13px '+F;c.textAlign='center';c.fillText(L.t,lx+lw/2,y0+7);c.textAlign='left';y0+=20;}
   c.font='13px '+F;
   items.forEach(function(it,i){var col=i%cols,row=Math.floor(i/cols),x=lx+8+col*cw,y=y0+row*19+8,k=it[0];
    if(k.indexOf('line:')===0){c.strokeStyle=k.slice(5);c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+22,y);c.stroke();}
    else if(k.indexOf('dot:')===0){c.fillStyle=k.slice(4);c.beginPath();c.arc(x+8,y,6,0,7);c.fill();}
    else if(k.indexOf('arrow:')===0){c.fillStyle=k.slice(6);c.font='700 14px '+F;c.fillText('➜',x+3,y);c.font='13px '+F;}
    else if(k.indexOf('txt:')===0){c.fillStyle=k==='txt:H'?'#1e40af':'#c62828';c.font='800 13px '+F;c.fillText(k.slice(4),x+6,y);c.font='13px '+F;}
    else {c.fillStyle=k;c.fillRect(x,y-6,22,13);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.strokeRect(x,y-6,22,13);}
    c.fillStyle='#111';c.fillText(it[1],x+28,y);});
  }
  // 比例尺
  if(SCALEINFO){var nice=[50,100,200,300,500,1000,2000],ppk=SCALEINFO*ZK,km=nice[0];nice.forEach(function(n){if(n*ppk<=130)km=n;});var bw=km*ppk,bx=Wd-14-bw,by=Ht-14;
   c.strokeStyle='#222';c.lineWidth=1.5;c.beginPath();c.moveTo(bx,by-6);c.lineTo(bx,by);c.lineTo(bx+bw,by);c.lineTo(bx+bw,by-6);c.stroke();
   c.fillStyle='#111';c.font='12px '+F;c.textAlign='left';c.fillText('0',bx,by-14);c.textAlign='right';c.fillText(km+'千米',bx+bw,by-14);c.textAlign='left';}
  var url=cv.toDataURL('image/png');
  try{var a=document.createElement('a');a.href=url;a.download=title+'.png';document.body.appendChild(a);a.click();a.remove();}catch(e){}
  $('dlImg').src=url;$('dlModal').style.display='flex';
 };
 img.onerror=function(){alertBox('生成图片失败，请重试');};
 img.src=src;
}
function alertBox(t){$('loading').classList.remove('hide');$('loading').textContent=t;setTimeout(function(){$('loading').classList.add('hide');},1500);}
$('dlBtn').addEventListener('click',exportPNG);
$('dlClose').addEventListener('click',function(){$('dlModal').style.display='none';});

/* ================= 启动 ================= */
async function ensureData(){
 var L=$('loading');
 try{
  if(!window.d3){L.classList.remove('hide');L.textContent='正在加载绘图组件…';await loadScript(CDN.d3,function(){return !!window.d3;});}
  if(!WORLD){L.classList.remove('hide');L.textContent='正在加载世界地图数据…';try{WORLD=decodeGeo(await loadMap('world'));WBOUNDS=WORLD.features.map(function(f){return d3.geoBounds(f);});}catch(e){if(S.atlas==='world')throw e;}}
  if(S.atlas==='cn'&&!CN){L.textContent='正在加载中国地图数据…';var raw=await loadMap('china');CN=decodeGeo(raw);CN.features=CN.features.filter(function(f){return f.properties.name!=='南海诸岛';});}
  L.classList.add('hide');
 }catch(err){L.classList.remove('hide');L.innerHTML='地图数据加载失败（需要联网访问 jsDelivr / unpkg 公共CDN）。<br>请检查网络后刷新页面；首次加载成功后会缓存在本机浏览器中。';}
}
buildUI();
ensureData().then(render);
</script>
