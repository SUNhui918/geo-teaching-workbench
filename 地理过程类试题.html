    </section>

    <aside>
      <div class="card">
        <h2>麻坑 Q 的变化（对应第 7 题）</h2>
        <div class="meters" id="meters"></div>
        <p class="note">↑ 增大　↓ 减小　— 基本不变</p>
      </div>
      <div class="card">
        <h2>图例</h2>
        <div class="legend">
          <div><span class="sw" style="background:var(--sed)"></span>原有海底沉积层</div>

  <div class="lower">
    <section class="card">
      <h2 class="big">问题链</h2>
      <details>
        <summary><span class="q">问1</span><span>麻坑里原来的沉积物去哪了？流体是从哪里、沿什么通道上来的？</span></summary>
        <div class="ans"><p>沉积层下的浅层气被低渗透盖层封住，越积越多形成超压；超压流体沿气烟囱、断层、不整合面等薄弱带向上运移，逸出海底时把海底沉积物冲蚀、带走，形成凹陷，即麻坑。</p></div>
      </details>
      <details>
        <summary><span class="q">问2</span><span>为什么有的麻坑是圆形，有的是椭圆形？</span></summary>
        <div class="ans"><p>流体从一点向上泄露，均匀冲蚀，初始多为圆形。若有稳定的海底洋流（底流），顺流方向的坑缘不断被侵蚀，麻坑沿流向拉长成椭圆形。</p></div>
      </details>
      <details>
        <summary><span class="q">第7题</span><span>随着时间的推移，图中 Q 麻坑：A 坑壁变陡　B 沉积覆盖层变薄　C 深度变浅　D 直径变小<span class="tag">看阶段 4 和右侧仪表</span></span></summary>
        <div class="ans">
          <ul class="opt">
            <li><span class="k">A</span><span>泥沙先在坑底和坑壁下部堆积，坑壁逐渐变缓，不会变陡。</span></li>
            <li><span class="k">B</span><span>沉积物不断落入坑内，覆盖层越来越厚。</span></li>
            <li><span class="k ok">C ✓</span><span>流体泄露减弱、停止后，麻坑被沉积物不断充填，深度变浅。</span></li>
            <li><span class="k">D</span><span>充填主要抬高坑底，坑口直径基本不变，坑缘垮塌时还会略有扩大。</span></li>
          </ul>
        </div>
      </details>
      <details>
        <summary><span class="q">第8题</span><span>圆形或椭圆形麻坑演变为新月形麻坑的主要因素是：A 沉积物　B 波浪　C 台风　D 地震<span class="tag">看阶段 5</span></span></summary>
        <div class="ans">
          <ul class="opt">
            <li><span class="k ok">A ✓</span><span>新月形麻坑分布在浊流堆积形成的朵叶扇上。浊流携带大量沉积物流经麻坑，沉积物把坑的一侧填平，只剩另一侧的弧形凹陷，于是成为新月形。</span></li>
            <li><span class="k">B</span><span>麻坑位于深海海底，波浪的作用到不了这么深。</span></li>
            <li><span class="k">C</span><span>台风同样只影响海洋表层。</span></li>
            <li><span class="k">D</span><span>地震可能诱发浊流或流体泄露，但直接改变麻坑形态的是浊流携带的沉积物。</span></li>
          </ul>
        </div>
      </details>
      <details>
        <summary><span class="q">问5</span><span>对比俯视图里的圆形、椭圆形、新月形三种麻坑，分别是哪种外力在"改造"？</span></summary>
        <div class="ans"><p>圆形：流体泄露侵蚀（初始形态）。椭圆形：海底洋流沿流向侵蚀。新月形：浊流带来的沉积物充填一侧。题干中"海底洋流通过沉积和侵蚀对海底表面进行改造"就是这条线索。</p></div>
      </details>
    </section>

    <section class="card">
      <h2 class="big">一条主线</h2>
      <p class="verdict">内力/流体"挖坑" → 外力（底流、沉积、浊流）"改坑"</p>
      <p style="margin:0">麻坑的形成靠地下流体泄露的侵蚀；形成之后的变化都是海底外力作用的结果：底流侵蚀把它拉长，沉积物充填让它变浅，浊流沉积把它改成新月形。</p>
      <p class="note">易错提醒：深海海底没有波浪和台风的直接作用。判断深海地貌的外力，优先考虑海底洋流、浊流和沉积作用。</p>
    </section>
  </div>

<script>
(function(){
  const W = 600, H = 380, SEA = 120, CX = 300, R0 = 70, D0 = 58, SEC = 5;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const sm = x => { x = clamp01(x); return x*x*(3-2*x); };
  const seg = (t,a,b) => clamp01((t-a)/(b-a));
  const win = (t,a,b,f=0.15) => Math.min(sm((t-a)/f), sm((b-t)/f));

  // ---- 物理状态：完全由时间 t 决定 ----
  function S(t){
    const tt = Math.min(t, 3);
    const D = D0*sm(seg(tt,1.05,1.85)) - 26*sm(seg(t,3,3.9));
    const p = 0.55 + 1.15*sm(seg(t,3,3.9));
    const elong = 1 + 0.5*sm(seg(t,2,2.9));
    const Rx = R0*elong*(1 + 0.06*sm(seg(t,3,3.9)));
    const Ry = R0;
    const skew = sm(seg(t,4.2,4.95));
    const lobe = sm(seg(t,4.1,4.85));
    const gas = t<1 ? sm(seg(t,0.05,0.9)) : 1 - 0.55*sm(seg(t,1,1.7)) - 0.3*sm(seg(t,2,3.2));
    const P = t<1 ? sm(seg(t,0.05,0.9)) : t<2 ? 1 - 0.65*sm(seg(t,1,1.6)) : 0.35*(1 - sm(seg(t,2,3.4)));
    const bubbles = t<1 ? 0 : t<2 ? sm(seg(t,1,1.1)) : t<3 ? 0.45 : 0.45*(1 - seg(t,3,3.35));
    return {D, p, Rx, Ry, skew, lobe, gas, P, bubbles,
            ref: {D: D0*sm(seg(tt,1.05,1.85)), p: 0.55, Rx: R0*(1 + 0.5*sm(seg(tt,2,2.9)))}};
  }
  function depthAt(x, D, p, Rx, skew){
    const u = (x - CX)/Rx;
    if (Math.abs(u) >= 1 || D <= 0) return 0;
    const base = D*Math.pow(1 - u*u, p);
    return base*(1 - skew*clamp01((0.45 - u)/1.45));
  }

  // ---- 画布 ----
  const $ = id => document.getElementById(id);
  const cvS = $('cvSec'), cvP = $('cvPlan');
  const ctxS = cvS.getContext('2d'), ctxP = cvP.getContext('2d');
  function fit(cv, ctx){
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width*dpr));
    cv.height = Math.max(1, Math.round(r.width*H/W*dpr));
    ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  }

  let C = {};
  function readColors(){
    const cs = getComputedStyle(document.documentElement);
    ['ink','muted','water','water2','sed','sedline','newsed','cap','deep','gas','gasdot','bubble','current','turb','pit','panel','accent']
      .forEach(k => C[k] = cs.getPropertyValue('--'+k).trim());
  }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

  // 伪随机（俯视图海底纹理固定）
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const SPECK = Array.from({length:260}, () => [rnd()*W, rnd()*H, rnd()*1.6+0.5]);
  const OTHER = [[90,70,16,16],[150,320,12,12],[520,60,14,10],[480,330,18,12],[60,230,10,10]];

  // ---- 粒子 ----
  let parts = [];
  function spawn(dt, st, t){
    // 气泡：沿气烟囱上升
    const nb = st.bubbles*dt*45;
    for (let i=0; i<nb || (Math.random() < nb - i); i++){
      if (i >= Math.ceil(nb)) break;
      parts.push({k:'b', x:CX + (Math.random()-0.5)*20, y:282, vy:-(55+Math.random()*40), vx:0, r:1.6+Math.random()*2.2, life:9});
    }
    // 喷出的沉积物
    if (t>1.05 &amp;&amp; t<1.9){
      for (let i=0; i<dt*40; i++){
        const a = -Math.PI/2 + (Math.random()-0.5)*1.6;
        const sp = 50+Math.random()*60;
        parts.push({k:'e', x:CX+(Math.random()-0.5)*30, y:SEA+st.D*0.6, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:1.5+Math.random()*1.5, life:2.2});
      }
    }
    // 沉降颗粒
    const settle = win(t,3,4,0.12) + 0.6*win(t,4.05,4.9,0.12);
    for (let i=0; i<settle*dt*55; i++){
      parts.push({k:'s', x:Math.random()*W, y:-4, vx:0, vy:22+Math.random()*18, r:1.3+Math.random()*1.2, life:12, ph:Math.random()*6});
    }
  }
  function surfaceY(x, st){
    const lobeTh = st.lobe*9;
    return SEA - lobeTh + depthAt(x, st.D, st.p, st.Rx, st.skew);
  }
  function stepParts(dt, st){
    for (const q of parts){
      q.life -= dt;
      if (q.k==='b'){
        q.y += q.vy*dt;
        if (q.y < surfaceY(q.x, st)) { q.vx = Math.sin((q.y+q.x)*0.05)*12; q.x += q.vx*dt; q.vy -= 8*dt; }
        if (q.y < -10) q.life = 0;
      } else if (q.k==='e'){
        q.vy += 70*dt; q.x += q.vx*dt; q.y += q.vy*dt;
        if (q.y > surfaceY(q.x, st) &amp;&amp; q.vy > 0) q.life = 0;
      } else {
        q.ph += dt*2; q.x += Math.sin(q.ph)*6*dt; q.y += q.vy*dt;
        if (q.y >= surfaceY(q.x, st)) q.life = 0;
      }
    }
    parts = parts.filter(q => q.life > 0);
  }

  // ---- 绘制工具 ----
  function label(ctx, txt, x, y, opt={}){
    if (!showLbl) return;
    ctx.save();
    ctx.font = `${opt.bold?'700':'500'} ${opt.size||15}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign = opt.align || 'left'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = opt.halo || C.panel;
    ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
    ctx.strokeText(txt, x, y);
    ctx.fillStyle = opt.color || C.ink; ctx.fillText(txt, x, y);
    ctx.restore();
  }
  function arrow(ctx, x1, y1, x2, y2, color, w=3, alpha=1){
    if (alpha <= 0.01) return;
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a = Math.atan2(y2-y1, x2-x1), h = 4+w*2.2;
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2 - h*Math.cos(a-0.45), y2 - h*Math.sin(a-0.45));
    ctx.lineTo(x2 - h*Math.cos(a+0.45), y2 - h*Math.sin(a+0.45));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // ---- 剖面图 ----
  function drawSection(t, st, clock){
    const ctx = ctxS;
    const xs = []; for (let x=0; x<=W; x+=3) xs.push(x);
    const cur = xs.map(x => surfaceY(x, st));
    const ref = xs.map(x => SEA + depthAt(x, st.ref.D, st.ref.p, st.ref.Rx, 0));

    // 海水
    const g = ctx.createLinearGradient(0,0,0,SEA);
    g.addColorStop(0, C.water2); g.addColorStop(1, C.water);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // 原有沉积层（在原始坑面之下）
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0,H); xs.forEach((x,i)=>ctx.lineTo(x, ref[i])); ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle = C.sed; ctx.fill(); ctx.clip();
    ctx.strokeStyle = C.sedline; ctx.lineWidth = 1.5;
    for (const y of [142,166,190,214,236]){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // 盖层、气层、深部
    ctx.fillStyle = C.cap; ctx.fillRect(0,250,W,22);
    ctx.fillStyle = C.deep; ctx.fillRect(0,272,W,H-272);
    ctx.restore();

    // 浅层气
    if (st.gas > 0.01){
      ctx.save();
      const rx = 40 + 150*st.gas, ry = 6 + 14*st.gas;
      ctx.beginPath(); ctx.ellipse(CX, 286, rx, ry, 0, 0, Math.PI*2);
      ctx.fillStyle = C.gas; ctx.globalAlpha = 0.95; ctx.fill(); ctx.clip();
      ctx.fillStyle = C.gasdot;
      for (let i=0;i<70;i++){ const a=(i*137.5)%360*Math.PI/180, r=Math.sqrt((i+0.5)/70);
        ctx.beginPath(); ctx.arc(CX+Math.cos(a)*r*rx, 286+Math.sin(a)*r*ry, 1.6, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    }

    // 气烟囱
    const chim = clamp01((t-0.95)/0.15) * (1 - 0.6*seg(t,3,3.6));
    if (chim > 0.01){
      ctx.save(); ctx.globalAlpha = 0.55*chim;
      const top = SEA + depthAt(CX, st.ref.D, st.ref.p, st.ref.Rx, 0);
      ctx.fillStyle = C.gas; ctx.fillRect(CX-16, top, 32, 278-top);
      ctx.globalAlpha = 0.9*chim; ctx.strokeStyle = C.gasdot; ctx.lineWidth = 2;
      const off = st.bubbles > 0.05 ? (clock*40)%22 : 0;
      for (let y=272 - off; y>top+6; y-=22){
        ctx.beginPath(); ctx.moveTo(CX-7,y+5); ctx.lineTo(CX,y-2); ctx.lineTo(CX+7,y+5); ctx.stroke();
      }
      ctx.restore();
    }

    // 新沉积物（坑内充填 + 浊流沉积）
    ctx.beginPath();
    xs.forEach((x,i)=> i? ctx.lineTo(x,cur[i]) : ctx.moveTo(x,cur[i]));
    for (let i=xs.length-1;i>=0;i--) ctx.lineTo(xs[i], Math.max(ref[i], cur[i]));
    ctx.closePath(); ctx.fillStyle = C.newsed; ctx.fill();

    // 原始坑形虚线
    if (showRef &amp;&amp; t > 3.05 &amp;&amp; st.ref.D > 1){
      ctx.save(); ctx.setLineDash([7,6]); ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.8;
      ctx.beginPath(); let on=false;
      xs.forEach((x,i)=>{ if (ref[i] > SEA+0.3){ on ? ctx.lineTo(x,ref[i]) : ctx.moveTo(x,ref[i]); on=true; } });
      ctx.stroke(); ctx.restore();
    }

    // 海底线
    ctx.beginPath(); xs.forEach((x,i)=> i? ctx.lineTo(x,cur[i]) : ctx.moveTo(x,cur[i]));
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4; ctx.stroke();

    // 底流
    const ca = win(t,2,3.05,0.12);
    if (ca > 0){ for (let k=0;k<4;k++){ const x0 = ((clock*70 + k*160) % (W+120)) - 80; arrow(ctx, x0, 96, x0+60, 96, C.current, 3.5, ca); } }

    // 浊流
    const ta = win(t,4,4.9,0.1);
    if (ta > 0){
      const hx = -80 + 820*sm(seg(t,4,4.85));
      ctx.save(); ctx.globalAlpha = 0.8*ta;
      const tg = ctx.createLinearGradient(hx-260,0,hx,0);
      tg.addColorStop(0, 'rgba(0,0,0,0)'); tg.addColorStop(1, C.turb);
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.moveTo(hx-300, SEA-st.lobe*9);
      for (let x=hx-300; x<=hx; x+=10){ const y = Math.min(...[surfaceY(Math.max(0,Math.min(W,x)),st)]); ctx.lineTo(x, y - 30 - 8*Math.sin(x*0.05+clock*3)); }
      ctx.quadraticCurveTo(hx+30, SEA-30, hx+18, SEA);
      ctx.lineTo(hx-300, SEA); ctx.closePath(); ctx.fill(); ctx.restore();
      arrow(ctx, hx-90, SEA-44, hx-20, SEA-44, C.turb, 3.5, ta);
    }

    // 粒子
    for (const q of parts){
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI*2);
      if (q.k==='b'){ ctx.fillStyle = C.bubble; ctx.globalAlpha = 0.95; ctx.fill(); ctx.globalAlpha = 0.6; ctx.strokeStyle = C.gasdot; ctx.lineWidth=1; ctx.stroke(); }
      else { ctx.fillStyle = q.k==='e' ? C.sed : C.newsed; ctx.globalAlpha = q.k==='e' ? Math.min(1,q.life) : 0.9; ctx.fill(); }
      ctx.globalAlpha = 1;
    }

    // 标注
    label(ctx, '海水', 18, 22, {color:C.ink});
    label(ctx, '沉积层', 18, 154);
    label(ctx, '盖层（低渗透）', 18, 261, {color:'#fff', halo:C.cap});
    if (st.gas > 0.2) label(ctx, '浅层气聚集', CX+90+60*st.gas, 312, {align:'left'});
    if (chim > 0.3) label(ctx, '气烟囱', CX+24, 232);
    if (st.ref.D > 20) label(ctx, 'Q', CX + st.Rx*0.75 + 14, SEA - 14, {bold:true, size:18});
    if (st.ref.D > 20 &amp;&amp; t < 3) label(ctx, '麻坑', CX - st.Rx - 8, SEA - 14, {align:'right'});
    if (ca > 0.3) label(ctx, '海底洋流', 470, 76, {color:C.current, alpha:ca});
    if (t>3.1 &amp;&amp; t<4.05) label(ctx, '沉积物充填', CX, SEA + st.D + 18, {align:'center'});
    if (ta > 0.3) label(ctx, '浊流', Math.min(560, -80 + 820*sm(seg(t,4,4.85)) - 40), SEA-64, {color:C.turb, alpha:ta, bold:true});
    if (t >= 4.85) label(ctx, '朵叶扇（浊流沉积）', 18, SEA-22, {color:C.ink});
    label(ctx, 'A', 6, SEA+12, {bold:true, size:13, color:C.muted});
    label(ctx, 'B', W-6, SEA+12, {bold:true, size:13, color:C.muted, align:'right'});
  }

  // ---- 俯视图 ----
  function drawPlan(t, st, clock){
    const ctx = ctxP, PY = 190, k = 1.35;
    ctx.fillStyle = C.sed; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = C.sedline; ctx.globalAlpha = 0.55;
    for (const [x,y,r] of SPECK){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
    // 其他麻坑（背景）
    for (const [x,y,rx,ry] of OTHER){
      ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
      ctx.fillStyle = C.pit; ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
    }

    const depthN = clamp01(st.D/D0);
    const rx = st.Rx*k, ry = st.Ry*k;
    if (st.D > 0.5){
      ctx.save(); ctx.translate(CX, PY); ctx.scale(rx/ry, 1);
      const gr = ctx.createRadialGradient(0,0,0, 0,0, ry);
      const inner = clamp01(0.75 - (st.p-0.55)*0.5);
      gr.addColorStop(0, C.pit); gr.addColorStop(inner, C.pit); gr.addColorStop(1, C.sed);
      ctx.globalAlpha = 0.25 + 0.7*depthN;
      ctx.beginPath(); ctx.arc(0,0,ry,0,Math.PI*2); ctx.fillStyle = gr; ctx.fill();
      ctx.globalAlpha = 1; ctx.lineWidth = 2.2*ry/rx; ctx.strokeStyle = C.ink; ctx.stroke();
      // 浊流沉积把一侧填平 → 新月形
      if (st.skew > 0.01){
        ctx.beginPath(); ctx.arc(-ry*0.42*st.skew, 0, ry*(0.98), 0, Math.PI*2);
        ctx.globalAlpha = st.skew; ctx.fillStyle = C.sed; ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
    // 朵叶扇沉积覆盖
    if (st.lobe > 0.01){
      ctx.save(); ctx.globalAlpha = 0.45*st.lobe; ctx.fillStyle = C.newsed;
      ctx.beginPath(); ctx.moveTo(0,40);
      ctx.bezierCurveTo(260,10, 600,40, 600,190); ctx.bezierCurveTo(600,340, 260,370, 0,340); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // 新月形描边
    if (st.skew > 0.3 &amp;&amp; st.D > 0.5){
      ctx.save(); ctx.translate(CX, PY); ctx.scale(rx/ry, 1);
      ctx.beginPath(); ctx.arc(0,0,ry,0,Math.PI*2); ctx.clip();
      ctx.beginPath(); ctx.arc(0,0,ry,0,Math.PI*2);
      ctx.arc(-ry*0.42*st.skew, 0, ry*0.98, 0, Math.PI*2, true);
      ctx.fillStyle = C.pit; ctx.globalAlpha = 0.55*st.skew; ctx.fill('evenodd');
      ctx.restore();
    }
    // 原始坑形
    if (showRef &amp;&amp; t > 3.05){
      ctx.save(); ctx.setLineDash([7,6]); ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.65; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.ellipse(CX, PY, st.ref.Rx*k, R0*k, 0, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    }
    // 泄露气泡环
    if (st.bubbles > 0.05){
      ctx.save(); ctx.strokeStyle = C.bubble; ctx.lineWidth = 2;
      for (let i=0;i<3;i++){ const ph = ((clock*0.8 + i/3) % 1);
        ctx.globalAlpha = st.bubbles*(1-ph); ctx.beginPath(); ctx.arc(CX, PY, 6 + ph*R0*0.9, 0, Math.PI*2); ctx.stroke(); }
      ctx.restore();
    }
    // 剖面线 A–B
    ctx.save(); ctx.setLineDash([4,5]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(14, PY); ctx.lineTo(W-14, PY); ctx.stroke(); ctx.restore();
    label(ctx, 'A', 8, PY-12, {bold:true, size:13, color:C.muted});
    label(ctx, 'B', W-8, PY-12, {bold:true, size:13, color:C.muted, align:'right'});

    // 底流箭头
    const ca = win(t,2,3.05,0.12);
    if (ca > 0) for (let r=0;r<3;r++){ const y = 70 + r*120; const x0 = ((clock*70 + r*90) % (W+120)) - 80; arrow(ctx, x0, y, x0+60, y, C.current, 3.5, ca); }
    // 浊流箭头
    const ta = win(t,4,4.9,0.1);
    if (ta > 0) for (let r=0;r<3;r++){ const y = 110 + r*80; const x0 = ((clock*110 + r*130) % (W+160)) - 120; arrow(ctx, x0, y, x0+80, y, C.turb, 5, ta*0.9); }

    // 标注
    if (st.D > 3){
      label(ctx, 'Q', CX + rx + 12, PY - ry*0.7, {bold:true, size:18});
      let name = '圆形麻坑';
      if (t >= 4.55) name = '新月形麻坑';
      else if (t >= 2.5) name = '椭圆形麻坑';
      label(ctx, name, CX, PY + ry + 22, {align:'center', bold:true, size:17});
    }
    if (ca > 0.3) label(ctx, '海底洋流', 470, 44, {color:C.current, alpha:ca});
    if (ta > 0.3) label(ctx, '浊流', 24, 84, {color:C.turb, alpha:ta, bold:true});
    if (st.lobe > 0.6) label(ctx, '朵叶扇', 520, 350, {align:'center'});
  }

  // ---- 仪表 ----
  function metrics(t){
    const st = S(Math.max(0,t));
    let maxD = 0, maxSlope = 0, prev = null;
    for (let x=CX-st.Rx; x<=CX+st.Rx; x+=1){
      const d = depthAt(x, st.D, st.p, st.Rx, st.skew);
      if (d > maxD) maxD = d;
      if (prev != null) maxSlope = Math.max(maxSlope, Math.abs(d-prev));
      prev = d;
    }
    const fill = st.ref.D > 0 ? Math.max(0, depthAt(CX, st.ref.D, st.ref.p, st.ref.Rx, 0) - depthAt(CX, st.D, st.p, st.Rx, st.skew)) : 0;
    return {
      P: st.P,
      depth: maxD/D0,
      slope: clamp01(maxSlope/2.6),
      dia: st.D > 0.5 ? st.Rx/(R0*1.6) : 0,
      fill: clamp01(fill/D0)
    };
  }
  const MET = [['P','气体超压'],['depth','坑深'],['slope','坑壁坡度'],['dia','直径'],['fill','坑底沉积覆盖层']];
  $('meters').innerHTML = MET.map(([k,n]) => `<div class="m"><div class="top"><span>${n}</span><span class="tr flat" id="tr_${k}">—</span></div><div class="mbar"><i id="mb_${k}"></i></div></div>`).join('');
  function updateMeters(t){
    const a = metrics(t), b = metrics(t-0.06);
    for (const [k] of MET){
      $('mb_'+k).style.width = (clamp01(a[k])*100).toFixed(1)+'%';
      const d = a[k]-b[k], el = $('tr_'+k);
      const cls = d > 0.002 ? 'up' : d < -0.002 ? 'down' : 'flat';
      el.className = 'tr '+cls; el.textContent = cls==='up' ? '↑' : cls==='down' ? '↓' : '—';
    }
  }

  // ---- 阶段与控制 ----
  const chipBox = $('chips');
  STAGES.forEach((s,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className='chip';
    b.innerHTML = `<b>${i===0?'0':'阶段'+i}</b>${s.chip}`;
    b.addEventListener('click', ()=>{ if(i===0){ stop(); t=0; } else go(i, i-1); });
    chipBox.appendChild(b);
  });
  const chipEls = [...chipBox.children];
  let t = 0, target = null, lastStage = -1, showRef = true, showLbl = true;
  $('tgRef').addEventListener('change', e => showRef = e.target.checked);
  $('tgLbl').addEventListener('change', e => showLbl = e.target.checked);
  $('tgVoice').addEventListener('change', e => {
    voiceOn = e.target.checked;
    if (!synth){ $('voiceNote').textContent = '这个浏览器不支持语音朗读，请换用 Edge 或 Chrome。'; return; }
    if (voiceOn){ pickVoice(); if (!zhVoice) $('voiceNote').textContent = '没有找到中文语音，朗读可能不准确。Windows 可在“设置-时间和语言-语音”中添加中文语音。'; say(NARR[lastStage < 0 ? 0 : lastStage]); }
    else synth.cancel();
  });

  function go(to, from){ if (from != null) t = from; target = to; parts = parts.filter(q=>q.k==='b'); updPlay(); }
  let playAll = false, gap = 0;
  function stop(){ target = null; playAll = false; synth &amp;&amp; synth.cancel(); updPlay(); }
  function updPlay(){ $('play').textContent = (target!=null || playAll) ? '❚❚ 暂停' : (t>=5 ? '↺ 重播' : '▶ 播放'); }
  $('play').addEventListener('click', ()=>{
    if (target!=null || playAll){ stop(); return; }
    if (t>=5) t = 0;
    playAll = true; gap = 0; go(Math.min(5, Math.floor(t+1e-6)+1));
  });
  const next = () => { if (t<5){ const k = Math.min(5, Math.floor(t+1e-6)+1); go(k, k-1); } };
  const prev = () => { stop(); t = Math.max(0, Math.ceil(t-1e-6)-1); };
  $('next').addEventListener('click', next); $('prev').addEventListener('click', prev);
  $('slider').addEventListener('input', e => { stop(); t = e.target.value/100; parts = []; });
  document.addEventListener('keydown', e=>{
    if (e.target.type === 'range') return;
    if (e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if (e.key===' ' &amp;&amp; !/BUTTON|SUMMARY/.test(e.target.tagName)){ e.preventDefault(); $('play').click(); }
  });

  // 录屏模式：#video
  const VIDEO = location.hash === '#video' || location.hash === '#videostep';
  const STEP = location.hash === '#videostep';
  let hold = 0;
  let SPEED = SEC, HOLD = 2.5;
  if (VIDEO){ document.body.classList.add('video'); hold = 9; SPEED = 8; HOLD = 7; }

  let last = null, clock = 0, ended = false;
  function frame(ts){
    const dt = last==null ? 0.016 : Math.min(0.05, (ts-last)/1000); last = ts;
    tick(dt);
    requestAnimationFrame(frame);
  }
  function tick(dt){
    clock += dt;
    // 录屏模式：逐阶段播放，每阶段结束停顿 2.5 秒
    if (VIDEO &amp;&amp; target==null){ hold -= dt; if (hold <= 0 &amp;&amp; t<5){ const k = Math.floor(t+1e-6)+1; go(k); } }
    if (target != null){
      const dir = Math.sign(target - t);
      t += dir*dt/(voiceOn &amp;&amp; !VIDEO ? 8 : SPEED);
      if ((dir>0 &amp;&amp; t>=target) || (dir<0 &amp;&amp; t<=target) || dir===0){ t = target; target = null; hold = HOLD; gap = 0.8; updPlay(); }
    } else if (playAll &amp;&amp; !VIDEO){
      // 逐阶段连续播放；开启语音时等这一段讲完再进入下一阶段
      if (t >= 5){ playAll = false; updPlay(); }
      else if (!(voiceOn &amp;&amp; synth &amp;&amp; synth.speaking)){ gap -= dt; if (gap <= 0) go(Math.floor(t+1e-6)+1); }
    }
    const st = S(t);
    spawn(dt, st, t); stepParts(dt, st);
    drawSection(t, st, clock); drawPlan(t, st, clock);
    updateMeters(t);
    const stage = t<=0 ? 0 : Math.min(5, Math.ceil(t-1e-9));
    if (VIDEO &amp;&amp; t>=5 &amp;&amp; target==null &amp;&amp; hold < 0 &amp;&amp; !ended){
      ended = true; $('stTitle').textContent = '总结'; $('stDesc').textContent = '流体泄露“挖坑”：形成麻坑。外力“改坑”：海底洋流拉长、沉积充填变浅、浊流沉积改成新月形。';
      const b = $('badge'); b.textContent = '小结'; b.className = 'badge q';
    }
    if (stage !== lastStage){
      lastStage = stage; const s = STAGES[stage];
      $('stTitle').textContent = s.title; $('stDesc').textContent = s.desc;
      if (target != null) say(NARR[stage]);
      const b = $('badge'); b.textContent = s.badge; b.className = 'badge' + (s.q ? ' q' : '');
    }
    chipEls.forEach((c,i)=>{ c.classList.toggle('on', i===stage); c.classList.toggle('done', i<stage); });
    $('slider').value = Math.round(t*100);
  }
  updPlay();
  if (STEP) window.__tick = tick; else requestAnimationFrame(frame);
})();
</script>

<div class="wrap">

  <div class="lower">
    <section class="card">
      <h2>问题链</h2>
      <details>
        <summary><span class="q">问1</span><span>看"现今"阶段：玄武岩台地（Ⅲ）形成以来，因流水侵蚀发生了哪些变化？<span class="tag">对应第（1）问</span></span></summary>
        <div class="ans"><p>台地被流水侵蚀、切割（出现河谷）；地面起伏加大；台地面积变小。</p></div>
      </details>
      <details>
        <summary><span class="q">问2</span><span>拖动时间轴，看右侧"受侵蚀时长"。构成台地、平顶山、尖顶山的玄武岩，哪个最早形成？为什么能用侵蚀程度判断？<span class="tag">对应第（2）问</span></span></summary>
        <div class="ans">
          <p>先后次序：构成尖顶山的玄武岩 → 构成平顶山的玄武岩 → 构成台地的玄武岩。</p>
          <p>地貌侵蚀程度越严重，说明岩石暴露时间越长，形成时间越早。台地受侵蚀轻，形成最晚；平顶山保留了台地的部分特征（平坦顶面），形成较晚；尖顶山已没有台地的特征，形成最早。</p>
        </div>
      </details>
      <details>
        <summary><span class="q">问3</span><span>最年轻的台地上，为什么还"站着"更老的平顶山和尖顶山？<span class="tag">对应第（3）问</span></span></summary>
        <div class="ans">
          <p>早、中期喷出的岩浆冷凝成玄武岩台地后，大部分被侵蚀，残留部分成为山体；最晚一期喷出的岩浆未能完全覆盖残留山体，冷凝成台地，其上仍保留了原有山体。</p>
        </div>
      </details>
      <details>
        <summary><span class="q">问4</span><span>回放阶段 2～4，只盯住紫色的玄武岩Ⅰ：它的形态经历了哪几种？</span></summary>
        <div class="ans"><p>台地 → 平顶的残留山体（平顶山） → 尖顶山。一块台地被持续侵蚀，就会依次变成这三种形态。所以平顶山"保留台地部分特征"，尖顶山"已无台地特征"，侵蚀程度可以指示时间长短。</p></div>
      </details>
      <details>
        <summary><span class="q">问5</span><span>如果第三期喷发的岩浆量大得多，今天的地面会是什么样？</span></summary>
        <div class="ans"><p>岩浆可能把平顶山甚至尖顶山全部掩埋，地表只剩一片完整的台地，看不出更早的喷发。题中"未能完全覆盖残留山体"正是平顶山、尖顶山能保留下来的条件。</p></div>
      </details>
    </section>

    <section class="card miss">
      <h2>常见误区</h2>
      <p><b>误区：</b>把三种地形看成同一块台地被依次侵蚀的结果，于是认为"台地最早、尖顶山最晚"，或者认为三者岩石年龄相同。</p>
      <p><b>纠正：</b>题干说三者的玄武岩"分别形成于不同喷发时期"。今天并排出现的台地、平顶山、尖顶山，是三期玄武岩各自处在不同侵蚀阶段的样子。</p>
      <p><b>联系：</b>"台地 → 平顶山 → 尖顶山"作为形态变化是对的，玄武岩Ⅰ就完整走过了这条路。把它反过来读，就得到形成先后：尖顶山最早，台地最晚。</p>
      <p class="verdict">侵蚀越重 → 暴露越久 → 形成越早</p>
    </section>
  </div>
</div>

<script>
(function(){
  const N = 201, BASE = 330, EMIN = 250, EMAX = 1000, SEC = 3.4;
  const px = x => 60 + x;
  const py = e => 440 - (e - EMIN) * 400 / (EMAX - EMIN);

  function pw(p){
    const out = new Array(N);
    for(let i=0;i<N;i++){
      const x = i*5; let v = p[p.length-1][1];
      for(let j=0;j<p.length-1;j++){
        const [a,ya]=p[j],[b,yb]=p[j+1];
        if(x>=a &amp;&amp; x<=b){ v = ya + (yb-ya)*(x-a)/(b-a); break; }
      }
      out[i]=v;
    }
    return out;
  }
  function smooth(a){
    const b=a.slice();
    for(let i=1;i<N-1;i++) b[i]=(a[i-1]+2*a[i]+a[i+1])/4;
    return b;
  }

  // 题图剖面（现今地形）
  const F = smooth(pw([[0,500],[65,495],[100,640],[115,940],[135,640],[165,518],[260,505],[275,510],[290,725],[300,735],[345,730],[355,600],[370,515],[450,510],[465,690],[475,740],[520,740],[530,600],[540,528],[600,515],[700,497],[840,500],[855,440],[870,410],[940,405],[955,480],[1000,490]]));
  // 第一侵蚀期结束：台地Ⅰ只剩平顶残体
  const E1 = smooth(pw([[0,330],[45,330],[68,700],[82,960],[152,960],[166,700],[190,330],[1000,330]]));
  // 第二侵蚀期结束：台地Ⅱ成平顶残体，台地Ⅰ残体变尖
  const E2 = smooth(pw([[0,330],[60,330],[95,660],[115,975],[138,660],[176,330],[250,330],[280,700],[294,745],[351,745],[364,700],[392,330],[435,330],[458,700],[471,745],[523,745],[536,700],[560,330],[1000,330]]));

  const PROCS = [
    {type:'erupt', u:'A', L:960},
    {type:'erode', T:E1},
    {type:'erupt', u:'B', L:745},
    {type:'erode', T:E2},
    {type:'erupt', u:'C', L:525},
    {type:'erode', T:F}
  ];
  const STAGES = [
    {chip:'起点', badge:'起点', kind:'', title:'喷发之前：基岩地面',
     desc:'这里原是较平缓的基岩地面（不是玄武岩）。点"播放"或拖动时间轴，看三期喷发与流水侵蚀怎样交替塑造地形。'},
    {chip:'喷发Ⅰ', badge:'第一期喷发', kind:'erupt', title:'形成玄武岩台地Ⅰ',
     desc:'岩浆流动性好，大面积溢流、冷凝，形成顶面平坦的台地。'},
    {chip:'侵蚀', badge:'流水侵蚀', kind:'erode', title:'台地Ⅰ被流水侵蚀、切割',
     desc:'沟谷下切，崖壁后退，台地面积缩小，只剩一块残留山体。此时它的顶面还是平的。'},
    {chip:'喷发Ⅱ', badge:'第二期喷发', kind:'erupt', title:'形成玄武岩台地Ⅱ',
     desc:'新岩浆填充低处，冷凝成较低的台地Ⅱ；台地Ⅰ的残体比它高，没有被覆盖。'},
    {chip:'侵蚀', badge:'流水侵蚀', kind:'erode', title:'台地Ⅱ被切割成平顶山，台地Ⅰ残体变尖',
     desc:'台地Ⅱ只剩几块平顶残体。台地Ⅰ残体被侵蚀得更久，平坦顶面消失，成为尖顶山。'},
    {chip:'喷发Ⅲ', badge:'第三期喷发', kind:'erupt', title:'形成玄武岩台地Ⅲ',
     desc:'最晚一期岩浆填满低地，冷凝成台地Ⅲ，但未能完全覆盖残留山体，平顶山、尖顶山保留了下来。'},
    {chip:'现今', badge:'流水侵蚀', kind:'erode', title:'现今：台地Ⅲ被流水侵蚀',
     desc:'河流下切形成河谷，台地被切割，起伏加大，面积变小，成为题图中的地貌。形成先后：尖顶山（Ⅰ）→ 平顶山（Ⅱ）→ 台地（Ⅲ）。'}
  ];

  const NARR = [
    '这是一道玄武岩台地的题。题干说，台地、平顶山、尖顶山的玄武岩，分别形成于不同的喷发时期。我们来看它们是怎样形成的。',
    '第一期喷发。流动性好的岩浆大面积溢流，冷凝后形成顶面平坦的玄武岩台地。',
    '接着是漫长的流水侵蚀。沟谷下切，崖壁后退，台地面积不断缩小，只剩下一块顶面平坦的残留山体。',
    '第二期喷发。新的岩浆填充低处，形成较低的台地。第一期的残留山体比它高，没有被覆盖。',
    '再次侵蚀。第二期台地被切割成平顶的残体；第一期的残体被侵蚀得更久，平坦顶面消失，变成了尖顶山。',
    '第三期喷发。最晚的岩浆填满低地，形成今天的台地，但没能完全覆盖残留山体，平顶山和尖顶山保留了下来。',
    '现在，河流下切形成河谷，台地被切割，起伏加大，面积变小。所以三者形成的先后是：尖顶山最早，平顶山其次，台地最晚。侵蚀越严重，形成越早。'
  ];
  let voiceOn = false, zhVoice = null, playAll = false, waitTimer = null;
  const synth = window.speechSynthesis;
  function pickVoice(){ if (!synth) return; const vs = synth.getVoices();
    zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null; }
  if (synth){ pickVoice(); synth.addEventListener?.('voiceschanged', pickVoice); }
  function say(txt){
    if (!voiceOn || !synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice;
    synth.speak(u);
  }

  const UNITS = ['A','B','C'];
  const ERUPT_IDX = {A:0,B:2,C:4};
  const ERODE_IDX = [1,3,5];

  function surface(st){
    const s = new Array(N);
    for(let i=0;i<N;i++){
      let v = BASE;
      for(const u of UNITS) if(st[u] &amp;&amp; st[u][i]>v) v = st[u][i];
      s[i]=v;
    }
    return s;
  }
  const easeOut = s => 1 - Math.pow(1-s, 2);

  // 侵蚀的空间进程：离残留山体越远越早被侵蚀 → 崖壁逐渐后退
  function erosionPlan(pre, T){
    const drop = pre.map((v,i)=>Math.max(0, v - T[i]));
    const keep = drop.map(d => d < 25);
    const dist = new Array(N).fill(Infinity);
    for(let i=0;i<N;i++) if(keep[i]) dist[i]=0;
    for(let i=1;i<N;i++) dist[i]=Math.min(dist[i], dist[i-1]+1);
    for(let i=N-2;i>=0;i--) dist[i]=Math.min(dist[i], dist[i+1]+1);
    // 河谷先下切（ridge 部分稍后），靠近残留山体的崖壁最后后退
    const delay = dist.map((d,i) => {
      const near = isFinite(d) ? 1 - Math.min(1, d/30) : 0;
      const ridge = 0.5 + 0.5*Math.sin(i*0.13 + 1.1);
      return 0.55*Math.max(near, 0.7*ridge);
    });
    return {pre, delay};
  }

  function apply(st, k, s){
    const p = PROCS[k];
    const out = {A:st.A&amp;&amp;st.A.slice(), B:st.B&amp;&amp;st.B.slice(), C:st.C&amp;&amp;st.C.slice()};
    if(p.type==='erupt'){
      const lv = BASE + (p.L - BASE)*easeOut(s);
      out[p.u] = new Array(N).fill(lv);
    }else{
      const plan = PLANS[k];
      for(let i=0;i<N;i++){
        const q = Math.min(1, Math.max(0, (s - plan.delay[i]) / 0.45));
        const E = plan.pre[i] - (plan.pre[i] - p.T[i]) * q;
        for(const u of UNITS) if(out[u] &amp;&amp; out[u][i] > E) out[u][i] = E;
      }
    }
    return out;
  }

  const BOUND = [{A:null,B:null,C:null}];
  const PLANS = {};
  for(let k=0;k<PROCS.length;k++){
    if(PROCS[k].type==='erode') PLANS[k] = erosionPlan(surface(BOUND[k]), PROCS[k].T);
    BOUND.push(apply(BOUND[k], k, 1));
  }

  function stateAt(t){
    if(t >= PROCS.length) return {st:BOUND[PROCS.length], hot:null};
    const k = Math.floor(t), s = t - k;
    const p = PROCS[k];
    return {st:apply(BOUND[k], k, s), hot:(p.type==='erupt' &amp;&amp; s>0 &amp;&amp; s<1) ? p.u : null};
  }

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const svg = $('fig');
  const pathEls = {A:$('uA'), B:$('uB'), C:$('uC')};
  const yBase = py(BASE);
  $('baseRect').setAttribute('y', yBase.toFixed(1));
  $('baseRect').setAttribute('height', (440 - yBase).toFixed(1));
  $('baseLbl').setAttribute('y', (yBase + 34).toFixed(1));

  // axis
  (function(){
    const g = $('axis'); let h = '';
    h += `<line x1="60" y1="20" x2="60" y2="440"/><line x1="60" y1="440" x2="1060" y2="440"/>`;
    for(let e=300;e<=1000;e+=100){
      const y = py(e).toFixed(1);
      h += `<line x1="52" y1="${y}" x2="60" y2="${y}"/><text x="48" y="${(+y+6).toFixed(1)}" text-anchor="end">${e}</text>`;
    }
    h += `<text x="66" y="40">海拔/m</text>`;
    g.innerHTML = h;
  })();

  function linePts(a){
    let d = '';
    for(let i=0;i<N;i++) d += (i?'L':'M') + px(i*5).toFixed(1) + ' ' + py(a[i]).toFixed(1);
    return d;
  }
  function unitPath(a){
    if(!a) return '';
    let any = false;
    for(let i=0;i<N;i++) if(a[i] > BASE + 0.5){ any = true; break; }
    if(!any) return '';
    return linePts(a.map(v=>Math.max(v,BASE))) + `L${px(1000)} ${yBase.toFixed(1)}L${px(0)} ${yBase.toFixed(1)}Z`;
  }
  $('exam').setAttribute('d', linePts(F));

  // labels at final stage
  const LABELS = [[118,'尖顶山',38],[318,'平顶山',30],[497,'平顶山',30],[30,'台地',22],[212,'台地',22],[408,'台地',22],[700,'台地',22],[905,'河谷',-38]];
  const labG = $('labels');
  labG.innerHTML = LABELS.map(([x,t])=>`<text class="lbl" x="${px(x)}">${t}</text>`).join('');
  const labEls = Array.from(labG.children);

  // chips
  const chipBox = $('chips');
  STAGES.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.innerHTML = `<b>${i===0?'0':'阶段'+i}</b>${s.chip}`;
    b.addEventListener('click', ()=>{ if(i===0){ stop(); t=0; render(); } else { stop(); animateTo(i, i-1); } });
    chipBox.appendChild(b);
  });
  const chipEls = Array.from(chipBox.children);

  // exposure
  const expo = $('expo');
  const ROMAN = {A:'Ⅰ',B:'Ⅱ',C:'Ⅲ'};
  expo.innerHTML = UNITS.map(u=>`<div class="r"><div class="top"><span>玄武岩${ROMAN[u]}</span><span id="ex${u}"></span></div><div class="bar">${'<i></i>'.repeat(3)}</div></div>`).join('');
  const expoBars = UNITS.map((u,j)=>Array.from(expo.children[j].querySelectorAll('i')));
  const COLOR = {A:'var(--uA)',B:'var(--uB)',C:'var(--uC)'};

  let t = 0, lastStage = -1;

  function render(){
    const {st, hot} = stateAt(t);
    for(const u of UNITS){
      pathEls[u].setAttribute('d', unitPath(st[u]));
      pathEls[u].classList.toggle('hot', hot===u);
    }
    const S = surface(st);
    $('surf').setAttribute('d', linePts(S));

    // river water in the valley during the last stage
    const wProg = Math.min(1, Math.max(0, (t - 5.5) / 0.5));
    let wd = '';
    if(wProg > 0){
      const lvl = 405 + 12*wProg;
      let seg = [];
      const flush = ()=>{
        if(seg.length>1){
          wd += `M${px(seg[0]*5)} ${py(lvl).toFixed(1)}`;
          for(const i of seg) wd += `L${px(i*5)} ${py(Math.min(S[i],lvl)).toFixed(1)}`;
          wd += `L${px(seg[seg.length-1]*5)} ${py(lvl).toFixed(1)}Z`;
        }
        seg = [];
      };
      for(let i=164;i<=196;i++){ if(S[i] < lvl) seg.push(i); else flush(); }
      flush();
    }
    $('water').setAttribute('d', wd);

    // labels
    const lo = Math.min(1, Math.max(0, (t - 5.7) / 0.3));
    LABELS.forEach(([x,,off],j)=>{
      const i = Math.round(x/5);
      labEls[j].setAttribute('y', (py(S[i]) - off + (off<0?0:0)).toFixed(1));
      labEls[j].style.opacity = lo;
    });

    // exposure
    const prog = k => Math.min(1, Math.max(0, t - k));
    UNITS.forEach((u,j)=>{
      const formed = prog(ERUPT_IDX[u]);
      const parts = ERODE_IDX.filter(e=>e>ERUPT_IDX[u]).map(prog);
      const total = parts.reduce((a,b)=>a+b,0);
      const lab = $('ex'+u);
      if(formed<=0) lab.textContent = '尚未形成';
      else if(formed<1) lab.textContent = '正在喷发';
      else lab.textContent = total>0 ? `经历 ${Math.ceil(total-1e-6)} 个侵蚀期` : '刚形成';
      expoBars[j].forEach((el,n)=>{
        const f = Math.min(1, Math.max(0, total - n));
        el.style.background = f>0 ? `linear-gradient(90deg, ${COLOR[u]} ${f*100}%, transparent ${f*100}%)` : '';
      });
    });

    // stage caption
    const stage = t<=0 ? 0 : Math.min(6, Math.ceil(t - 1e-9));
    if(stage !== lastStage){
      lastStage = stage;
      const s = STAGES[stage];
      $('stTitle').textContent = s.title;
      $('stDesc').textContent = s.desc;
      const b = $('badge'); b.textContent = s.badge; b.className = 'badge ' + s.kind;
      if (anim) say(NARR[stage]);
    }
    chipEls.forEach((c,i)=>{ c.classList.toggle('on', i===stage); c.classList.toggle('done', i<stage); });
    $('slider').value = Math.round(t*100);
  }

  // ---- animation ----
  let anim = null, last = null;
  function animateTo(to, from){
    if(from != null) t = from;
    anim = {to}; last = null;
    updatePlay();
    requestAnimationFrame(step);
  }
  function stop(){ anim = null; playAll = false; clearInterval(waitTimer); synth &amp;&amp; synth.cancel(); updatePlay(); }
  // 逐阶段连续播放：开启语音时，等这一段讲完再进入下一阶段
  function waitNext(){
    clearInterval(waitTimer);
    if (t >= 6){ playAll = false; updatePlay(); return; }
    let gap = 0.8;
    waitTimer = setInterval(()=>{
      if (!playAll){ clearInterval(waitTimer); return; }
      if (voiceOn &amp;&amp; synth &amp;&amp; synth.speaking) return;
      gap -= 0.2;
      if (gap <= 0){ clearInterval(waitTimer); animateTo(Math.floor(t + 1e-6) + 1); }
    }, 200);
  }
  function step(ts){
    if(!anim) return;
    if(last == null) last = ts;
    const dt = Math.min(0.05, (ts - last)/1000); last = ts;
    const dir = Math.sign(anim.to - t);
    t += dir * dt / (voiceOn ? 6 : SEC);
    if(dir===0 || (dir>0 &amp;&amp; t>=anim.to) || (dir<0 &amp;&amp; t<=anim.to)){ t = anim.to; anim = null; updatePlay(); if (playAll) waitNext(); }
    render();
    if(anim) requestAnimationFrame(step);
  }
  function updatePlay(){ $('play').textContent = (anim || playAll) ? '❚❚ 暂停' : (t>=6 ? '↺ 重播' : '▶ 播放'); }

  $('play').addEventListener('click', ()=>{
    if (anim || playAll){ stop(); return; }
    if (t >= 6){ t = 0; render(); }
    playAll = true;
    if (voiceOn &amp;&amp; t === 0){ say(NARR[0]); waitNext(); } else animateTo(Math.floor(t + 1e-6) + 1);
  });
  $('tgVoice').addEventListener('change', e => {
    voiceOn = e.target.checked;
    if (!synth){ $('voiceNote').textContent = '这个浏览器不支持语音朗读，请换用 Edge 或 Chrome。'; return; }
    if (voiceOn){ pickVoice(); if (!zhVoice) $('voiceNote').textContent = '没有找到中文语音，朗读可能不准确。Windows 可在“设置-时间和语言-语音”中添加中文语音。'; say(NARR[lastStage < 0 ? 0 : lastStage]); }
    else synth.cancel();
  });
  function next(){ const k = Math.min(6, Math.floor(t + 1e-6) + 1); if(t<6){ stop(); animateTo(k, k-1); } }
  function prev(){ stop(); t = Math.max(0, Math.ceil(t - 1e-6) - 1); render(); updatePlay(); }
  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  $('slider').addEventListener('input', e=>{ stop(); t = e.target.value/100; render(); updatePlay(); });
  $('tgColor').addEventListener('change', e=>svg.classList.toggle('mono', !e.target.checked));
  $('tgExam').addEventListener('change', e=>$('exam').setAttribute('visibility', e.target.checked ? 'visible' : 'hidden'));
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT' &amp;&amp; e.target.type==='range') return;
    if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key===' ' &amp;&amp; e.target.tagName!=='BUTTON' &amp;&amp; e.target.tagName!=='SUMMARY'){ e.preventDefault(); $('play').click(); }
  });

  render(); updatePlay();
})();
</script>

<div class="wrap">

  <h1>黄河浮雕的形成</h1>
  <p class="sub">晋陕峡谷山西临县段 · 黄河东岸崖壁 · 坚硬砂岩与较软泥岩互层</p>
</header>

  <div class="main">

    </div>

  </div>

  <aside class="side">
    <div class="card">

    </div>

    </div>
    <div class="card">

<section class="blk">
  <h2>第（3）问 小实验：泥沙在静水中的分选沉积</h2>
  <div class="lab">
    <div>
      <canvas id="lab" aria-label="烧杯沉积实验"></canvas>
    </div>
    <div>
      <p>阶地②表层沉积物“下粗上细”。在烧杯里重现这一过程：</p>
      <ol>
        <li>烧杯中加入水和一定量粒径不同的泥沙（砾、砂、粉砂）。</li>
        <li>用玻璃棒充分搅拌，使泥沙悬浮。</li>
        <li>静置，观察颗粒沉降先后和杯底沉积层的分层。</li>
      </ol>
      <div class="btns">
        <button class="primary" id="stir" type="button">搅拌后静置</button>
        <button id="labReset" type="button">重新装杯</button>
      </div>
      <div class="res" id="labRes">杯底泥沙粗细混杂。点“搅拌后静置”开始。</div>
      <p class="vnote">颗粒沉降速度按粒径设定：粒径越大，受重力影响越大，沉得越快。速度为示意。</p>
    </div>
  </div>
</section>

<section class="blk">
  <h2>问题链</h2>
  <details>
    <summary><span class="qn">（1）</span>根据图 c，描述黄河浮雕形成的主要外力作用过程。</summary>
    <div class="body">
      <p><button class="go" data-go="2" type="button">看阶段Ⅰ</button><button class="go" data-go="3" type="button">阶段Ⅱ</button><button class="go" data-go="4" type="button">阶段Ⅲ</button><button class="go" data-go="5" type="button">阶段Ⅳ</button></p>
      <p><b>答案：</b>河水侧向侵蚀，泥岩易受侵蚀，造成岸脚被掏空；上部岩层发生重力崩塌，形成直立崖壁；河流进一步下切，崖壁完全出露水面；遭受风化、风力侵蚀和重力崩塌等多种外力作用，崖壁对外力作用的差异，形成浮雕景观。</p>
      <p><b>读图方法：</b>图 c 中 4 个箭头所指岩层逐渐变薄，说明河流不断下切、河谷加深。逐阶段找“变化了什么”，再对应外力：侧蚀 → 崩塌 → 下切 → 风化风蚀。</p>
      <div class="pit">易错：浮雕是<b>差异侵蚀</b>的结果，砂岩硬、抗侵蚀而凸出，泥岩软、易侵蚀而凹进；它不是流水堆积形成的。</div>
    </div>
  </details>
  <details>
    <summary><span class="qn">（2）</span>结合图 b 中阶地①的沉积环境差异和黄土层最底部年代，推测浮雕形成不早于距今 6.0 万年，说出依据。</summary>
    <div class="body">
      <p><button class="go" data-go="0" type="button">看起点</button><button class="go" data-go="1" type="button">看阶地①形成</button></p>
      <div class="chain"><span>砂砾层是河流堆积</span><b>→</b><span>黄土底部年代 = 阶地①脱离水相环境的年代（距今 6.0 万年）</span><b>→</b><span>浮雕岩层位于砂砾层之下</span><b>→</b><span>河流继续下切后才出露</span><b>→</b><span>出露后才受风化等外力作用</span></div>
      <p><b>答案：</b>黄河浮雕的最终形成须在非水相环境；其发育部位所在崖壁出露时间应晚于阶地①砂砾石层形成年代；砂砾石层之上的黄土最底部年代代表了该阶地脱离水相环境的年代，为距今 6.0 万年。</p>
      <div class="pit">易错：“不早于距今 6.0 万年”指形成时间距今不超过 6.0 万年，即在 6.0 万年<b>之后</b>。黄土是风力堆积，它开始堆积说明此处已不再被河水淹没。</div>
    </div>
  </details>
  <details>
    <summary><span class="qn">（3）</span>阶地②表层沉积物粒径“下粗上细”，设计小实验（写出主要步骤），证实这与流水中携运泥沙的差异性沉降有关。</summary>
    <div class="body">
      <p><button class="go" data-go="6" type="button">看现今</button></p>
      <p><b>步骤：</b>在烧杯中加入水和一定量粒径不同的泥沙，用玻璃棒充分搅拌，然后静置。</p>
      <p><b>结果：</b>较粗颗粒先沉降，较细颗粒后沉降，烧杯底沉积层颗粒呈下粗上细；说明黄河水所携不同粒径泥沙因重力分选发生差异性沉降，推测合理。</p>
      <div class="pit">易错：实验要有“充分搅拌”这一步，模拟流水携带泥沙；“静置”模拟流速降低、泥沙沉降。只写“观察”不写操作，不得分。</div>
    </div>
  </details>
</section>

<section class="blk">
  <h2>主线</h2>
  <div class="mainline">
    <div><b>堆积</b><small>洪水堆积砂砾，成为阶地①的物质</small></div>
    <div><b>下切</b><small>地壳抬升，河流下切，阶地①出露，黄土开始堆积</small></div>
    <div><b>侧蚀</b><small>软泥岩被掏空，上部悬空</small></div>
    <div><b>崩塌</b><small>重力崩塌，形成直立崖壁</small></div>
    <div><b>出露</b><small>再下切，崖壁离开水面</small></div>
    <div><b>差异侵蚀</b><small>泥岩凹进、砂岩凸出，浮雕形成</small></div>
  </div>
</section>
<p class="foot">示意动画按题目参考答案制作；阶地②的形成过程（河道西移、洪水堆积）为补充示意。</p>
</div>

  let m=Math.min(mu[i%10],705-z);L.push({a:z,b:z+m,mud:true});z+=m;i++;}

function state(t){

     const n=Math.round((b-a)*w/55);
     for(let j=0;j<n;j++){const x=hash(i*53+j*1.3)*w,zz=a+(0.2+0.6*hash(i*17+j*2.9))*(b-a);const r=(2+5*hash(j*3.7+i))*rm;
      ctx.globalAlpha=0.6*rm;ctx.fillStyle=C.shade;ctx.beginPath();ctx.ellipse(x,fy(zz),r*1.4,r,0,0,7);ctx.fill();
      ctx.globalAlpha=0.5*rm;ctx.strokeStyle=C.hi;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,fy(zz)-1,r*1.4,r,0,Math.PI,2*Math.PI);ctx.stroke()}
     ctx.restore();ctx.globalAlpha=1;
     // 砂岩下缘投影
     ctx.globalAlpha=0.45*rm;ctx.fillStyle=C.shade;ctx.beginPath();ctx.moveTo(0,bot(0));for(let x=0;x<=w;x+=6)ctx.lineTo(x,bot(x));for(let x=w;x>=0;x-=6)ctx.lineTo(x,bot(x)+5*rm+2);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
   }
   ctx.strokeStyle=C.edge;ctx.globalAlpha=0.5;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=w;x+=6)x?ctx.lineTo(x,top(x)):ctx.moveTo(x,top(x));ctx.stroke();ctx.globalAlpha=1;
  }
  // 掏蚀凹槽
  if(S.n>0&amp;&amp;!S.collapsed){const g=ctx.createLinearGradient(0,fy(696.5),0,fy(689));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.55,C.shade);g.addColorStop(1,'rgba(0,0,0,0)');
   ctx.globalAlpha=0.7*S.n;ctx.fillStyle=g;ctx.fillRect(0,fy(696.5),w,fy(689)-fy(696.5));ctx.globalAlpha=1}
  // 新鲜崩塌面
  if(S.fresh>0.01){ctx.globalAlpha=0.18*S.fresh;ctx.fillStyle=C.hi;ctx.fillRect(0,fy(705),w,fy(Math.max(S.B,FZ0))-fy(705));
   ctx.globalAlpha=0.75*S.fresh;ctx.strokeStyle=C.edge;ctx.lineWidth=1.3;
   for(let j=0;j<9;j++){let x=hash(j*7.7)*w,y=fy(704-hash(j*3.1)*3);ctx.beginPath();ctx.moveTo(x,y);for(let s=0;s<5;s++){x+=(hash(j*11+s)-0.5)*18;y+=10+hash(j*5+s)*12;ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=1}
 }
 // 砂砾层与黄土
 ctx.fillStyle=C.gravel;ctx.fillRect(0,fy(712),w,fy(705)-fy(712));ctx.strokeStyle=C.edge;ctx.globalAlpha=0.6;ctx.lineWidth=0.9;
 for(let j=0;j<70;j++){ctx.beginPath();ctx.ellipse(hash(j*2.2)*w,fy(705.7+hash(j*4.4)*5.6),2+hash(j)*2.5,1.5+hash(j*9)*1.4,0,0,7);ctx.stroke()}ctx.globalAlpha=1;
 if(S.L>0.05){ctx.fillStyle=C.loess;ctx.fillRect(0,fy(712+S.L),w,fy(712)-fy(712+S.L))}
 // 水
 if(S.W>FZ0){const top=fy(S.W);ctx.globalAlpha=0.9;ctx.fillStyle=C.water;ctx.fillRect(0,top,w,FW.h-top);ctx.globalAlpha=0.5;ctx.strokeStyle=C.panel;ctx.lineWidth=1.2;
  for(let j=0;j<3;j++){const y=top+6+j*9;if(y>FW.h)break;ctx.beginPath();for(let x=0;x<=w;x+=8){const yy=y+Math.sin(x*0.08+j*2)*1.6;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}ctx.globalAlpha=1}
 // 文字
 const tg=(t,x,y,al,col,b)=>{ctx.font=(b?'700 ':'600 ')+'14px '+fam;const tw=ctx.measureText(t).width;const x0=al==='right'?x-tw:x;ctx.globalAlpha=0.85;ctx.fillStyle=C.panel;ctx.fillRect(x0-4,y-13,tw+8,19);ctx.globalAlpha=1;ctx.fillStyle=col||C.ink;ctx.fillText(t,x0,y+1)};
 if(!faceOn){tg('尚无崖壁：洪水漫过谷底，堆积砂砾',12,fy(694),'left',C.accent,1)}
 if(opt.label){
  if(S.W>FZ0&amp;&amp;faceOn)tg('水面',12,fy(S.W)+18,'left',C.accent,1);
  tg('砂砾层',w-8,fy(708.5)+4,'right');
  if(S.n>0.3&amp;&amp;!S.collapsed)tg('泥岩被掏空的凹槽',w-8,fy(692.6)+4,'right',C.hot,1);
  if(S.fresh>0.5&amp;&amp;k===4)tg('新鲜崩塌面',w-8,fy(700)+4,'right',C.hot,1);
  if(S.R>1){tg('砂岩凸出',w-8,fy(701.3)+4,'right',C.ink,1);tg('泥岩凹进',w-8,fy(698.05)+4,'right',C.ink,1)}
 }
 
}

/* ===== 指标 ===== */
const MET=[
 {n:'距今时间',f:S=>S.k===0?'> 6 万年':(S.k===1?'≈ 6 万年':'< 6 万年'),bar:null,num:S=>S.k},
 {n:'河水位',f:S=>S.W.toFixed(0)+' m',bar:S=>(S.W-670)/46,num:S=>S.W},
 {n:'崖壁出露高度',f:S=>(S.B<704.9?Math.max(0,705-S.W):0).toFixed(1)+' m',bar:S=>(S.B<704.9?Math.max(0,705-S.W):0)/28,num:S=>(S.B<704.9?Math.max(0,705-S.W):0)},
 {n:'泥岩凹进深度',f:S=>Math.max(notchDepth(S),S.R).toFixed(1)+' m',bar:S=>Math.max(notchDepth(S),S.R)/8,num:S=>Math.max(notchDepth(S),S.R)},
 {n:'黄土厚度',f:S=>S.L.toFixed(0)+' m',bar:S=>S.L/24,num:S=>S.L}];
const metEl=$('#meters');
metEl.innerHTML=MET.map((m,i)=>`<div class="meter"><span class="n">${m.n}</span><span class="v" id="mv${i}"></span><span class="ar" id="ma${i}"></span>${m.bar?`<span class="bar"><i id="mb${i}"></i></span>`:''}</div>`).join('');
function drawMeters(){const S=state(T);const P=S.k>0?state(S.k-1):null;
 MET.forEach((m,i)=>{$('#mv'+i).textContent=m.f(S);const a=$('#ma'+i);
  if(!P||i===0){a.textContent='';a.className='ar'}else{const d=m.num(S)-m.num(P);
   if(d>0.05){a.textContent='↑';a.className='ar up'}else if(d<-0.05){a.textContent='↓';a.className='ar dn'}else{a.textContent='—';a.className='ar eq'}}
  if(m.bar)$('#mb'+i).style.width=clamp(m.bar(S),0,1)*100+'%'})}

/* ===== 说明区与芯片 ===== */
const chipsEl=$('#chips');
chipsEl.innerHTML=STAGES.map((s,i)=>`<button class="chip${s.q&amp;&amp;i?' qq':''}" data-i="${i}" type="button"><small>${i===0?'':i}</small>${s.chip}</button>`).join('');
let lastCap=-1;
function updateCap(){const k=Math.round(T)===T?T:Math.ceil(T-1e-9);const s=STAGES[k];if(k===lastCap)return;lastCap=k;
 $('#badge').textContent=s.badge;$('#stTitle').textContent=s.title;$('#stDesc').textContent=s.desc;
 $('#cap').classList.toggle('q',s.badge.indexOf('问')>-1);
 chipsEl.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',i===k))}

let T=0;
function draw(){drawSection();drawFace();drawMeters();updateCap();$('#slider').value=T}
function setT(v){T=clamp(v,0,NS);draw()}

/* ===== 语音 ===== */
const synth=window.speechSynthesis;let voiceOn=false,zhVoice=null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;updateVwarn()}
function updateVwarn(){const el=$('#vwarn');if(!voiceOn){el.hidden=true;return}
 if(!synth){el.textContent='当前浏览器不支持语音朗读，请用 Edge 或 Chrome 打开。';el.hidden=false;return}
 if(!zhVoice){el.textContent='没有找到中文语音。Windows 可在“设置 - 时间和语言 - 语音”里添加中文语音，推荐用 Edge 或 Chrome 打开。';el.hidden=false;return}
 el.hidden=true}
if(synth){pickVoice();synth.addEventListener&amp;&amp;synth.addEventListener('voiceschanged',pickVoice)}
function say(txt){if(!voiceOn||!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';u.rate=1;if(zhVoice)u.voice=zhVoice;synth.speak(u)}
function hush(){if(synth)synth.cancel()}

/* ===== 播放 ===== */
let playing=false,runId=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function animateTo(target,dur,id){return new Promise(res=>{const t0=T,st=performance.now();
 function f(now){if(id!==runId)return res(false);const q=clamp((now-st)/dur,0,1);T=t0+(target-t0)*q;draw();if(q<1)requestAnimationFrame(f);else res(true)}
 requestAnimationFrame(f)})}
async function waitSpeech(id){if(!voiceOn||!synth)return;await sleep(250);while(id===runId&amp;&amp;synth.speaking)await sleep(150)}
function setPlayBtn(){$('#play').textContent=playing?'⏸ 暂停':'▶ 播放'}
async function playAll(){const id=++runId;playing=true;setPlayBtn();
 if(T>=NS-1e-6){T=0;draw()}
 let k;
 if(Math.abs(T-Math.round(T))<1e-6){T=Math.round(T);k=T;
  if(k===0){say(NARR[0]);draw();await waitSpeech(id);if(id!==runId)return;await sleep(voiceOn?800:400)}
  k=k+1}else k=Math.ceil(T);
 while(id===runId&amp;&amp;k<=NS){say(NARR[k]);const dur=(voiceOn?8000:3600)*Math.max(0.2,k-T);
  const ok=await animateTo(k,dur,id);if(!ok||id!==runId)return;await waitSpeech(id);if(id!==runId)return;await sleep(voiceOn?800:700);k++}
 if(id===runId){say(OUTRO);playing=false;setPlayBtn()}}
function stop(){runId++;playing=false;setPlayBtn();hush()}
$('#play').onclick=()=>{if(playing)stop();else playAll()};
function goNext(){stop();const k=Math.min(NS,Math.floor(T+1e-6)+1);if(k===T)return;const id=runId;say(NARR[k]);animateTo(k,1500,id)}
function goPrev(){stop();const k=Math.max(0,Math.ceil(T-1e-6)-1);setT(k)}
$('#next').onclick=goNext;$('#prev').onclick=goPrev;
$('#slider').addEventListener('input',e=>{stop();setT(+e.target.value)});
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;stop();const i=+b.dataset.i;setT(i);say(NARR[i])});
document.querySelectorAll('.go').forEach(b=>b.addEventListener('click',()=>{stop();const i=+b.dataset.go;setT(i);say(NARR[i]);document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'start'})}));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&amp;&amp;e.target.type==='range'&amp;&amp;(e.key==='ArrowLeft'||e.key==='ArrowRight'))e.preventDefault();
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goNext()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goPrev()}
 else if(e.key===' '&amp;&amp;e.target.tagName!=='BUTTON'&amp;&amp;e.target.tagName!=='SUMMARY'){e.preventDefault();playing?stop():playAll()}});
$('#tLitho').onchange=e=>{opt.litho=e.target.checked;draw()};
$('#tLabel').onchange=e=>{opt.label=e.target.checked;draw()};
$('#tOld').onchange=e=>{opt.old=e.target.checked;draw()};
$('#tVoice').onchange=e=>{voiceOn=e.target.checked;pickVoice();updateVwarn();if(voiceOn){const k=Math.ceil(T-1e-9);say(NARR[k])}else hush()};

/* ===== 小实验：静水分选沉积 ===== */
const CLS=[{name:'砾',r:4.6,v:150,c:'gp',n:34},{name:'砂',r:2.5,v:58,c:'sp',n:140},{name:'粉砂',r:1.3,v:20,c:'fp',n:420}];
let BK={},parts=[],dep=[],col=[],labState='idle',stirEnd=0,settleStart=0,labRaf=0;
const BIN=3;
function labLayout(){const w=LW.w,h=LW.h;BK={x0:w*0.2,x1:w*0.8,top:h*0.1,bot:h-16,wt:h*0.16}}
function addDeposit(p){const b0=Math.max(0,Math.floor((p.x-p.r-BK.x0)/BIN)),b1=Math.min(col.length-1,Math.floor((p.x+p.r-BK.x0)/BIN));
 let hmax=0;for(let b=b0;b<=b1;b++)hmax=Math.max(hmax,col[b]);
 p.y=BK.bot-hmax-p.r;const add=Math.PI*p.r*p.r*1.25/((b1-b0+1)*BIN);
 for(let b=b0;b<=b1;b++)col[b]=Math.max(col[b],hmax)+add;dep.push(p)}
function labReset(){col=new Array(Math.ceil((BK.x1-BK.x0)/BIN)+1).fill(0);dep=[];parts=[];
 const all=[];CLS.forEach((c,ci)=>{for(let i=0;i<c.n;i++)all.push({ci,r:c.r})});
 all.sort(()=>Math.random()-0.5);
 all.forEach(p=>{p.x=BK.x0+p.r+Math.random()*(BK.x1-BK.x0-2*p.r);addDeposit(p)});
 labState='idle';$('#labRes').textContent='杯底泥沙粗细混杂。点“搅拌后静置”开始。';drawLab()}
function stir(){col.fill(0);const all=dep.concat(parts);dep=[];
 parts=all.map(p=>({ci:p.ci,r:p.r,x:BK.x0+p.r+Math.random()*(BK.x1-BK.x0-2*p.r),y:BK.wt+p.r+Math.random()*(BK.bot-BK.wt-2*p.r),vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160}));
 labState='stir';stirEnd=performance.now()+1300;$('#labRes').textContent='搅拌中：泥沙全部悬浮在水中……';
 cancelAnimationFrame(labRaf);let last=performance.now();
 const loop=now=>{const dt=Math.min(0.04,(now-last)/1000);last=now;stepLab(dt,now);drawLab();if(labState!=='done')labRaf=requestAnimationFrame(loop)};
 labRaf=requestAnimationFrame(loop)}
function stepLab(dt,now){
 if(labState==='stir'&amp;&amp;now>stirEnd){labState='settle';settleStart=now}
 const stirring=labState==='stir';
 for(let i=parts.length-1;i>=0;i--){const p=parts[i],c=CLS[p.ci];
  if(stirring){p.vx+=(Math.random()-0.5)*900*dt+Math.sin(now/300+p.y*0.02)*200*dt;p.vy+=(Math.random()-0.5)*900*dt;p.vx*=0.97;p.vy*=0.97}
  else{p.vx*=Math.pow(0.15,dt);p.vy*=Math.pow(0.15,dt)}
  p.x+=p.vx*dt;p.y+=(p.vy+(stirring?0:c.v))*dt;
  if(p.x<BK.x0+p.r){p.x=BK.x0+p.r;p.vx=Math.abs(p.vx)}if(p.x>BK.x1-p.r){p.x=BK.x1-p.r;p.vx=-Math.abs(p.vx)}
  if(p.y<BK.wt+p.r){p.y=BK.wt+p.r;p.vy=Math.abs(p.vy)}
  const b=clamp(Math.floor((p.x-BK.x0)/BIN),0,col.length-1);
  if(stirring){if(p.y>BK.bot-p.r){p.y=BK.bot-p.r;p.vy=-Math.abs(p.vy)}}
  else if(p.y+p.r>=BK.bot-col[b]){parts.splice(i,1);addDeposit(p)}}
 if(labState==='settle'){const s=((now-settleStart)/1000).toFixed(1);
  const left=CLS.map((c,ci)=>parts.filter(p=>p.ci===ci).length);
  $('#labRes').textContent=`静置 ${s} s：还在下沉的 砾 ${left[0]} · 砂 ${left[1]} · 粉砂 ${left[2]}`;
  if(parts.length===0){labState='done';$('#labRes').innerHTML='<b>结果：</b>较粗颗粒先沉降，较细颗粒后沉降，杯底沉积层自下而上 砾 → 砂 → 粉砂，<b>下粗上细</b>。'}}}
function drawLab(){const ctx=lx,w=LW.w,h=LW.h;ctx.clearRect(0,0,w,h);ctx.fillStyle=C.panel;ctx.fillRect(0,0,w,h);
 const {x0,x1,top,bot,wt}=BK;
 ctx.globalAlpha=labState==='stir'?0.38:0.22;ctx.fillStyle=C.water;ctx.fillRect(x0,wt,x1-x0,bot-wt);ctx.globalAlpha=1;
 if(labState==='stir'||labState==='settle'){const turb=parts.filter(p=>p.ci===2).length/CLS[2].n;ctx.globalAlpha=0.25*turb;ctx.fillStyle=C.silt;ctx.fillRect(x0,wt,x1-x0,bot-wt);ctx.globalAlpha=1}
 const drawP=p=>{ctx.fillStyle=C[CLS[p.ci].c];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.ci<2){ctx.strokeStyle=C.edge;ctx.lineWidth=0.6;ctx.stroke()}};
 dep.forEach(drawP);parts.forEach(drawP);
 ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x0-4,top-6);ctx.lineTo(x0,top);ctx.lineTo(x0,bot+2);ctx.lineTo(x1,bot+2);ctx.lineTo(x1,top);ctx.lineTo(x1+4,top-6);ctx.stroke();
 ctx.strokeStyle=C.accent;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x0,wt);ctx.lineTo(x1,wt);ctx.stroke();
 const fam=getComputedStyle(document.body).fontFamily;ctx.font='600 13px '+fam;ctx.fillStyle=C.muted;
 for(let i=1;i<=4;i++){const y=bot-(bot-wt)*i/5;ctx.fillRect(x1-10,y,10,1)}
 // 图例
 CLS.forEach((c,i)=>{const y=top+8+i*22;ctx.fillStyle=C[c.c];ctx.beginPath();ctx.arc(x1+18,y,Math.max(c.r,2.4),0,7);ctx.fill();ctx.strokeStyle=C.edge;ctx.lineWidth=0.6;ctx.stroke();ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(c.name,x1+28,y+4)});
 if(labState==='done'){const hgt=Math.max(...col);ctx.strokeStyle=C.hot;ctx.lineWidth=2;const xb=x0-12;ctx.beginPath();ctx.moveTo(xb,bot);ctx.lineTo(xb,bot-hgt);ctx.stroke();
  arrow(ctx,xb,bot-4,xb,bot-hgt,C.hot,2);ctx.fillStyle=C.hot;ctx.textAlign='right';ctx.fillText('变细',xb-4,bot-hgt+6);ctx.fillText('粗',xb-4,bot);ctx.textAlign='left'}
}
$('#stir').onclick=stir;$('#labReset').onclick=()=>{cancelAnimationFrame(labRaf);labReset()};

/* ===== 主题与尺寸 ===== */
const mq=matchMedia('(prefers-color-scheme: dark)');
const retheme=()=>{readColors();draw();drawLab()};
mq.addEventListener?mq.addEventListener('change',retheme):mq.addListener(retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(resize,60)}).observe(document.querySelector('.wrap'));
resize();labReset();
window.__setT=setT;
})();
</script>

const QUESTIONS=[{"id": "maken", "title": "海底麻坑的形成与分布", "tag": "外力·海洋", "src": "2026-11-07 作业 第1–3题", "pageNote": "互动演示为“南沙海底麻坑演化”（气体泄露成坑 → 底流拉长 → 沉积充填 → 浊流改造），可用于本组题的过程理解。", "stem": "海底麻坑是地层中流体沿着运移通道溢出海底，侵蚀海底沉积物形成的凹陷地貌。下图为某研究区域内麻坑发育过程示意图。经研究分析发现：麻坑的直径和深度与水深呈正相关；在海丘覆盖的一定范围内，丘顶附近海拔高处易生成直径较小、较浅且内壁较陡的小规模普通年轻麻坑，受浊流影响极小。据此完成下面小题。", "subs": [{"q": "1．图中浊流形成的条件有（　）<br>①地层中的流体被褶皱地层所覆盖　②流体喷发过程中携带海底泥质、砂质等沉积物上浮<br>③喷发的流体与周围的水体不存在混合情况　④底流受重力影响沿坡向下运移<br>A．①②　B．③④　C．①③　D．②④", "a": "D", "x": "流体通过运移通道至海水—沉积物界面喷发，携带海底泥质、砂质沉积物上浮（②对，①错）；喷发流体与周围水体混合，这种底流受重力影响沿坡向下运移，逐渐发展成浊流（④对，③错）。"}, {"q": "2．不同类型麻坑及其分布状况，合理的是（　）<br>A．圆形和椭圆形麻坑主要分布于海丘中下部位<br>B．串珠状拉长型麻坑主要分布于深海丘间峡谷<br>C．圆形和椭圆形麻坑主要分布于深海丘间峡谷<br>D．新月形麻坑主要分布于海丘丘顶部和中下部", "a": "B", "x": "读图：串珠状拉长型麻坑分布于深海丘间峡谷（浊流水道）；圆形、椭圆形麻坑分布于海丘丘顶部；新月形麻坑分布于海丘中下部。"}, {"q": "3．伴随着麻坑与丘顶距离增大（　）<br>A．麻坑的直径变小　B．麻坑形成年代越新<br>C．麻坑的深度变大　D．麻坑内壁坡度变陡", "a": "C", "x": "材料“直径和深度与水深呈正相关”：离丘顶越远水越深，麻坑直径、深度越大（C对，A错）。丘顶附近为年轻、内壁陡、受浊流影响小的麻坑，离丘顶越远麻坑越老，受浊流改造内壁变缓（B、D错）。"}], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCALfBRQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6oooooAKBRRQAtFJRQAuKMUlFAC4pKXNJQACgUUtABxRikpc0ABpPpRS0AJS9qSigANFFLQAcUlFLQAdqSl6UlABRS4oFABikxS0UAJS0lGaADpRRRQAUvFJS9qAEooooAKKKKAF4oIpKKACiiigAope9FAAaDRmkoAKKKKAC 河浮雕出现于图b所示部位。图c示意某学者提出的外力作用对黄河浮雕形成的影响过程模式。", "subs": [{"q": "(1) 据图c描述黄河浮雕形成的主要外力作用过程。", "a": "河水侧向侵蚀，泥岩易受侵蚀，造成岸脚被掏空；上部岩层发生重力崩塌，形成直立崖壁；河流进一步下切，崖壁完全出露水面；岩壁遭受风化、风力侵蚀和重力崩塌等多种外力作用，崖壁对外力作用响应的差异，最终形成浮雕景观。", "x": ""}, {"q": "(2) 结合图b中阶地①地层的沉积环境差异和黄土层最底部的年代，该学者推测黄河浮雕的形成不早于距今6.0万年。请给出此推断的依据。", "a": "黄河浮雕的最终形成须在非水相环境；其发育部位所在崖壁出露时间应晚于阶地①砂砾石层形成年代（或在阶地形成之后）；砂砾石层之上的黄土最底部年代代表了该阶地脱离水相环境的年代（距今6.0万年）。", "x": "黄土为风力堆积，只能在陆上（非水相）环境形成；它覆盖在河流相砂砾石层之上，说明此时阶地已高出水面。阶地面上覆黄土底界年龄为6.0万年，浮雕形成只能在此之后。"}], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAL0BFADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6pooooAKKKKACiiigArN1nxNoXhzyTrWtabpfn7vK+23SQ+ZjGdu4jOMjOPUVpV86/tW2cGoeJ/h5bXMKTRO2pbkcZB/dwnp+FAHsv/CzvAn/AEOvhr/waQf/ABVH/CzvAn/Q6+Gv/BpB/wDFV8nJ4K0Ij/kD2X/foUp8F6EP+YPY/wDflaAPrD/hZ3gT/odfDX/g0g/+Ko/4Wd4E/wCh18M/+DSD/wCKr5NbwZoQ/wCYRZf9+RTD4O0Mf8wix/GEUAfWv/CzvAn/AEOvhn/waQf/ABVH/CzvAn/Q6+Gf/BpB/wDFV8k/8Ihon/QHsP8AvyKafCOif9Aew/78igD64/4Wd4E/6HXwz/4NIP8A4qj/AIWd4E/6HXwz/wCDSD/4qvkY+EdF/wCgRYf9+RTD4Q0X/oE2X/foUAfXn/CzvAn/AEOvhn/waQf/ABVH/CzvAn/Q6+Gf/BpB/wDFV8hf8Ihov/QJs/8Av0KQ+ENF/wCgTZ/9+hQB9ff8LO8Cf9Dr4Z/8GkH/AMVR/wALO8Cf9Dr4Z/8ABpB/8VXyB/wiGjf9Aqz/AO/QpP8AhEdG/wCgVZ/9+hQB9gf8LP8AAn/Q6+Gf/BpB/wDFUf8ACz/An/Q6+Gf/AAaQf/FV8ff8Ijo3/QKtP+/Qo/4RPRv+gTZ let cur=null,view='demo';
const $=id=>document.getElementById(id);
function nav(){const n=$('nav');n.querySelectorAll('.qbtn').forEach(b=>b.remove());$('cnt').textContent='共 '+QUESTIONS.length+' 题';
 QUESTIONS.forEach(q=>{const b=document.createElement('button');b.className='qbtn'+(cur===q?' on':'');b.innerHTML=`<b>${q.title}</b><span><i class="tag">${q.tag}</i>${q.src}</span>`;b.onclick=()=>show(q);n.appendChild(b);});}
function pageHTML(q){const t=$('pg-'+q.id);return t?t.value:'<p style="padding:30px;font:16px sans-serif;color:#888">这道题还没有互动演示。</p>';}
function show(q){cur=q;$('qt').textContent=q.title;$('qs').textContent=q.src;
 $('fr').srcdoc=pageHTML(q);$('pn').hidden=!q.pageNote;$('pn').textContent=q.pageNote||'';
 $('pp').innerHTML=`<p class="stem">${q.stem}</p>${q.img?`<img src="${q.img}" alt="题图">`:''}`+q.subs.map(s=>`<div class="sub"><div class="q">${s.q}</div><details><summary>查看答案</summary><div class="ans"><b>答案：</b>${s.a}</div>${s.x?`<div class="xp">解析：${s.x}</div>`:''}</details></div>`).join('');
 nav();try{history.replaceState(null,'','#'+q.id);}catch(e){}}
function setView(v){view=v;document.querySelectorAll('.seg button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('demo').hidden=v!=='demo';$('paper').hidden=v!=='paper';}
document.querySelectorAll('.seg button[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('open').onclick=()=>{const url=URL.createObjectURL(new Blob([pageHTML(cur)],{type:'text/html'}));window.open(url,'_blank');};
$('fs').onclick=()=>{const el=view==='demo'?$('fr'):document.documentElement;if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else document.exitFullscreen();};
show(QUESTIONS.find(q=>q.id===location.hash.slice(1))||QUESTIONS[0]);
</script>
