<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地理快问快答 · 课堂游戏</title>
<style>
:root{--bg:#0f1b33;--panel:#17264a;--line:#2a3d6b;--txt:#f3f6ff;--mute:#9fb0d6;--yel:#ffcf3f;--grn:#3ddc84;--red:#ff5d6c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#1d3466 0,#0f1b33 55%);color:var(--txt);
font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
a{color:#8cc4ff}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:clamp(28px,4.4vw,48px);margin:8px 0 4px;letter-spacing:2px}
h1 span{color:var(--yel)}
.sub{color:var(--mute);margin:0 0 18px;font-size:16px}
.hide{display:none!important}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-bottom:20px}
.setup label{color:var(--mute);font-size:15px}
.setup select,.setup input{background:#0d1730;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px}
.teamnames{display:flex;flex-wrap:wrap;gap:8px}
.teamnames input{width:110px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.cat{border-radius:18px;padding:20px 18px 34px;text-align:left;color:#fff;min-height:175px;position:relative;transition:transform .15s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cat:hover{transform:translateY(-4px)}
.cat .ic{font-size:40px}
.cat b{display:block;font-size:24px;margin:6px 0 4px}
.cat small{font-size:14px;opacity:.92;line-height:1.5;display:block}
.cat .left{position:absolute;right:14px;top:14px;background:rgba(0,0,0,.25);border-radius:20px;padding:3px 10px;font-size:13px}
.cat .pts{position:absolute;right:14px;bottom:10px;font-weight:700;font-size:15px;color:#fff8d6}
.cat .ph{position:absolute;left:16px;bottom:10px;font-size:13px;background:rgba(0,0,0,.25);border-radius:20px;padding:2px 10px}
.board{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.team{flex:1;min-width:120px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center}
.team .n{font-size:16px;color:var(--mute)}
.team .s{font-size:34px;font-weight:800}
.team.lead{border-color:var(--yel);box-shadow:0 0 16px rgba(255,207,63,.35)}
.team .adj{display:flex;gap:6px;justify-content:center}
.team .adj button{background:#22345f;color:var(--txt);border-radius:6px;padding:2px 8px;font-size:13px}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:#22345f;color:var(--txt);padding:8px 14px;border-radius:10px;font-size:15px}
.tag{padding:5px 14px;border-radius:20px;font-weight:700;font-size:15px}
.qno{color:var(--mute)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-top:14px;display:grid;grid-template-columns:1fr 170px;gap:20px}
.qtext{font-size:clamp(22px,2.8vw,32px);line-height:1.5;font-weight:700;margin:0 0 14px}
.media{margin:6px 0 14px;text-align:center}
.media svg{max-width:100%;max-height:330px;border-radius:14px;background:#fff}
.media img{max-width:100%;max-height:52vh;border-radius:14px;cursor:zoom-in;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.media .cap{color:var(--mute);font-size:13px;margin-top:4px}
.textclue{background:#0d1730;border:2px dashed #4a5f92;border-radius:14px;padding:16px 18px;font-size:clamp(18px,2.1vw,23px);line-height:1.7;text-align:left}
.textclue small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#0d1730;color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:clamp(17px,2vw,22px);text-align:left;line-height:1.4}
.opt i{font-style:normal;display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%;background:#22345f;margin-right:10px;font-weight:700}
.opt.sel{border-color:var(--yel)}
.opt.right{border-color:var(--grn);background:rgba(61,220,132,.18)}
.opt.wrong{border-color:var(--red);background:rgba(255,93,108,.15)}
.clues{display:flex;flex-direction:column;gap:10px}
.clue{background:#0d1730;border:2px dashed var(--line);border-radius:14px;padding:14px 16px;font-size:clamp(18px,2.1vw,24px)}
.clue.on{border-style:solid;border-color:#a855f7}
.clue .lv{color:var(--yel);font-weight:700;margin-right:8px}
.answer{margin-top:16px;border-radius:14px;padding:14px 18px;background:rgba(61,220,132,.12);border:1px solid rgba(61,220,132,.5);font-size:clamp(17px,2vw,22px);line-height:1.6}
.answer b{color:var(--grn);font-size:1.15em}
.answer .ask{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.2);color:#ffe08a}
.side{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800}
.ring.warn .num{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.btn{width:100%;padding:12px;border-radius:12px;font-size:17px;font-weight:700;color:#10203f}
.b-y{background:var(--yel)}.b-g{background:var(--grn)}.b-b{background:#7cb3ff}.b-p{background:#c79bff}.b-gr{background:#3a4d7d;color:var(--txt)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.award{margin-top:14px;display:none;flex-wrap:wrap;gap:10px;align-items:center}
.award.on{display:flex}
.award span{color:var(--mute)}
.award button{padding:10px 16px;border-radius:12px;font-size:17px;font-weight:700;color:#fff}
.keys{color:var(--mute);font-size:13px;margin-top:6px;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:22px}
.panel h3{margin:0 0 10px}
.panel .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;align-items:center}
.panel input[type=text]{flex:1;min-width:220px;background:#0d1730;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px}
.custom .list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.custom .it{background:#0d1730;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.custom .it img{height:34px;border-radius:4px}
.custom .it button{background:none;color:var(--red);font-size:16px}
.tip{color:var(--mute);font-size:14px;line-height:1.7}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{background:#22345f;color:var(--txt);padding:7px 14px;border-radius:20px;font-size:15px}
.tabs button.on{background:var(--yel);color:#10203f;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:#0d1730;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.pc .th{height:96px;background:#13203f center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#5d73a8;font-size:28px;position:relative}
.pc .th .cnt{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:10px;padding:1px 7px}
.pc .bd{padding:7px 8px}
.pc .bd b{font-size:14px;display:block;margin-bottom:4px}
.pc .bd .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pc label.up{background:#2d4580;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
.pc button.del{background:none;color:var(--red);font-size:12px;padding:0}
.drop{border:2px dashed #4a5f92;border-radius:14px;padding:16px;text-align:center;color:var(--mute);margin-bottom:12px}
.drop.on{border-color:var(--yel);color:var(--yel)}
.report{font-size:14px;color:#cfe;margin-top:6px;line-height:1.6}
.over{position:fixed;inset:0;background:rgba(5,10,25,.88);display:flex;align-items:center;justify-content:center;z-index:9}
.over .box{background:var(--panel);border:2px solid var(--yel);border-radius:22px;padding:30px 40px;text-align:center;max-width:90vw}
.over h2{font-size:36px;margin:0 0 10px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:94vh}
@media(max-width:760px){.qcard{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;justify-content:center}.side .btn{width:auto;flex:1;min-width:120px}.ring{width:110px;height:110px}.ring svg{width:110px;height:110px}.ring .num{font-size:38px}}
.opts.two{grid-template-columns:1fr 1fr}
.cat .ph{position:absolute;left:16px;bottom:10px;font-size:13px;background:rgba(0,0,0,.25);border-radius:20px;padding:2px 10px}
.custom .it span b{color:#ffe08a}
.vol{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:15px}
.vol input[type=range]{width:110px;accent-color:var(--yel);padding:0}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;opacity:0}
#toast span{display:block;padding:16px 34px;border-radius:60px;font-size:clamp(22px,4vw,44px);font-weight:800;color:#10203f;background:var(--yel);box-shadow:0 10px 40px rgba(0,0,0,.45);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.good span{background:linear-gradient(90deg,#ffe36b,#7cf0a8)}
#toast.bad span{background:linear-gradient(90deg,#a9c4ff,#d6b8ff)}
#toast.warn span{background:linear-gradient(90deg,#ffb36b,#ff7a8a);color:#fff}
#toast.show{animation:toastIn 2s ease forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
.qcard.sad{animation:shake .55s,sadflash 1.2s}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
@keyframes sadflash{0%{filter:none}25%{filter:grayscale(.85) brightness(.85)}100%{filter:none}}
.opt.right{animation:glow 1.2s ease 2}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(61,220,132,.35),0 0 26px rgba(61,220,132,.7)}}
.team{position:relative}
.team .s.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.45);color:var(--yel)}}
.team .fl{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:800;font-size:26px;pointer-events:none;animation:flt 1.1s ease-out forwards}
.team .fl.up{color:var(--grn)}.team .fl.dn{color:var(--red)}
@keyframes flt{to{top:-34px;opacity:0}}
.streak{background:linear-gradient(90deg,#ff9a3d,#ff5d6c);color:#fff;border-radius:20px;padding:5px 14px;font-weight:800;font-size:15px;animation:pulse .6s 3 alternate}
.tear{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:25;animation:tear 1.6s linear forwards}
@keyframes tear{to{transform:translateY(110vh)}}
.award button.nobody{background:#3a4d7d;color:#dfe8ff}
@media (prefers-reduced-motion:reduce){#toast.show{animation-duration:1.2s}.opt.right,.streak{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
  <h1>🌏 地理 <span>快问快答</span></h1>
  <p class="sub">共 <b id="totalN" style="color:var(--yel)">0</b> 道题 · 12 个关卡 · 分组抢答 —— 选一个关卡开始！</p>
  <div class="setup">
    <label>队伍数
      <select id="teamCount"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
    </label>
    <div class="teamnames" id="teamNames"></div>
    <label>每题限时
      <select id="timeSel"><option value="10">10 秒</option><option value="15">15 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option><option value="45">45 秒</option><option value="60">60 秒</option></select>
    </label>
    <label><input type="checkbox" id="autoRev" checked> 选后自动公布答案</label>
    <label><input type="checkbox" id="sound" checked> 音效</label>
    <span class="vol">音量 <input type="range" id="vol" min="0" max="100" value="70"></span>
    <label id="voiceWrap" class="hide"><input type="checkbox" id="voice"> 语音鼓励</label>
    <button class="back" id="sfxTest">🔊 试听</button>
    <button class="back" id="fsBtn">⛶ 全屏</button>
    <button class="back" id="resetBtn">↺ 分数清零</button>
  </div>
  <div class="board" id="boardHome"></div>
  <div class="cats" id="cats"></div>
  <div class="tip" style="margin-top:10px">“地理计算”和“高考进阶”的计时自动加倍，留出动笔时间。</div>

  </section>

<section id="play" class="hide">
  <div class="qtop">
    <button class="back" id="homeBtn">← 返回关卡</button>
    <span class="tag" id="qTag"></span>
    <span class="qno" id="qNo"></span>
    <span class="streak hide" id="streak"></span>
  </div>
  <div class="board" id="boardPlay"></div>
  <div class="qcard">
    <div>
      <p class="qtext" id="qText"></p>
      <div class="media" id="qMedia"></div>
      <div class="opts" id="qOpts"></div>
      <div class="clues" id="qClues"></div>
      <div class="answer hide" id="qAns"></div>
      <div class="award" id="award"></div>
    </div>
    <div class="side">
      <div class="ring" id="ring">
        <svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="#22345f" stroke-width="12" fill="none"/><circle id="arc" cx="75" cy="75" r="64" stroke="#ffcf3f" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="402.1" stroke-dashoffset="0"/></svg>
        <div class="num" id="tNum">20</div>
      </div>
      <button class="btn b-b" id="tBtn">▶ 开始计时</button>
      <button class="btn b-p hide" id="clueBtn">💡 再给一条线索</button>
      <button class="btn b-g" id="ansBtn">✔ 公布答案</button>
      <button class="btn b-y" id="nextBtn">下一题 →</button>
      <div class="keys">空格 计时 · Enter 答案 · → 下一题 · ↓ 线索</div>
    </div>
  </div>
</section>
</div>
<div id="toast"><span></span></div>
<div class="over hide" id="over"><div class="box"><h2 id="overT"></h2><p id="overP" style="font-size:20px;line-height:1.6"></p><button class="btn b-y" id="overBtn" style="width:auto;padding:12px 30px">好的</button></div></div>
<script>
/* ===== 题库 =====
 选择题格式：['题目','正确答案','干扰1','干扰2','干扰3','讲解']（运行时随机打乱选项）
 判断题格式：['说法', 1对/0错, '讲解']
 线索题格式：['答案','线索1','线索2','线索3','讲解']
*/
const RAW={};

/* ---------- ⚡ 闪电快答 ---------- */
RAW.flash=[
['站在北极点上空俯视，地球自转的方向是？','逆时针','顺时针','自东向西','不确定','地球自西向东自转；北极上空看呈逆时针，南极上空看呈顺时针。'],
['冬至日（12月22日前后），太阳直射点位于？','南回归线','赤道','北回归线','北极圈','冬至日太阳直射南回归线，北半球昼最短夜最长。'],
['晴天时，一天中气温最高值一般出现在？','午后14时左右','正午12时','日出前后','傍晚18时','地面是近地面大气的主要直接热源，地面辐射传给大气需要时间，所以最高气温出现在午后2时左右。'],
['我国南方与北方地区的分界线是？','秦岭—淮河','长江','黄河','南岭','秦岭—淮河一线大致与1月0℃等温线、800mm年等降水量线吻合。'],
['热力环流中，近地面受热的地方形成？','低气压','高气压','气压不变','先高后低','受热→空气膨胀上升→近地面形成低压，高空形成高压。'],
['北半球中低纬度海区的大洋环流呈什么方向流动？','顺时针','逆时针','自北向南','没有规律','北半球中低纬海区大洋环流以副热带海区为中心，呈顺时针方向。'],
['我们所在的常州，位于哪个地形区？','长江中下游平原（长江三角洲）','华北平原','四川盆地','珠江三角洲','常州位于长江三角洲，属于长江中下游平原。'],
['岩浆侵入或喷出地表冷凝后形成的岩石是？','岩浆岩','沉积岩','变质岩','石灰岩','岩浆冷却凝固形成岩浆岩，如花岗岩（侵入岩）、玄武岩（喷出岩）。'],
['我国最大的淡水湖是？','鄱阳湖','洞庭湖','太湖','青海湖','鄱阳湖是我国最大的淡水湖；青海湖是最大的湖泊，但为咸水湖。'],
['北京时间是哪条经线的地方时？','120°E','0°','116°E','180°','北京时间即东八区区时，采用120°E的地方时。'],
['台风在气象学上属于？','热带气旋（低压系统）','反气旋（高压系统）','冷锋','暖锋','台风是强烈发展的热带气旋，中心为低压，北半球呈逆时针辐合。'],
['地球上淡水资源的主体以什么形式存在？','冰川','河流水','湖泊淡水','大气水','冰川约占地球淡水总量的近七成，主要分布在南极和格陵兰。'],
['出现逆温现象时，对大气污染物的扩散有什么影响？','阻碍扩散','促进扩散','没有影响','加速降雨净化','逆温层上热下冷，大气稳定，对流减弱，污染物不易扩散。'],
['城市热岛效应使城郊之间近地面风从哪里吹向哪里？','郊区吹向城区','城区吹向郊区','没有风','只在白天吹','城区气温高、气流上升，近地面形成低压，风从郊区吹向城区。'],
['河流凹岸与凸岸相比，哪一侧以侵蚀为主？','凹岸','凸岸','两岸一样','看季节','“凹岸侵蚀，凸岸堆积”，港口一般建在凹岸，凸岸适合建居住区和农田。'],
['地球公转的方向是？','自西向东','自东向西','自南向北','顺时针','地球公转和自转方向一致，都是自西向东。'],
['太阳系八大行星中，距离太阳最近的是？','水星','金星','火星','地球','由近及远：水星、金星、地球、火星、木星、土星、天王星、海王星。'],

}
function renderClues(){

function moreClue(){if(revealed||!cur||cur.cat!=='clue'||clueShown>=3)return;clueShown++;renderClues();SFX.clue(clueShown);resetTimer()}
function reveal(){
  if(revealed||!cur)return;revealed=true;stopTimer();lastClue=clueShown;
  let html='';

    html=`答案：<b>${esc(cur.ans)}</b>`;SFX.reveal();

/* ================= 音效与反馈（合成音效，无需音频文件） ================= */
const SFX=(()=>{
  let ctx=null,master=null,lastBad=-1;
  const on=()=>$('sound').checked;
  const st=n=>Math.pow(2,n/12);
  function ensure(){
    try{
      if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
        ctx=new AC();const comp=ctx.createDynamicsCompressor();master=ctx.createGain();master.connect(comp);comp.connect(ctx.destination)}
      if(ctx.state==='suspended')ctx.resume();
      master.gain.value=Math.pow(+$('vol').value/100,1.5);
      return true;
    }catch(e){return false}
  }
  function tone(f,t0,d,o){o=o||{};
    const T=ctx.currentTime+t0,a=o.attack||.01,vol=o.vol==null?.3:o.vol;
    const osc=ctx.createOscillator(),g=ctx.createGain();let out=osc;
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,T);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,T+d);
    if(o.vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg);lg.connect(osc.frequency);l.start(T);l.stop(T+d+.05)}
    if(o.lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);out=fl}
    const hold=Math.min(d-.005,Math.max(a+.001,d*(o.hold==null?.55:o.hold)));
    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol,T+a);g.gain.setValueAtTime(vol,T+hold);g.gain.exponentialRampToValueAtTime(.0001,T+d);
    out.connect(g);g.connect(master);osc.start(T);osc.stop(T+d+.05);
  }
  // 答对：三种随机，连对越多音调越高
  function good(n){const r=st(Math.min(n-1,6)*2),v=Math.floor(Math.random()*3);
    if(v===0){[0,4,7,12].forEach((k,i)=>{tone(523.25*r*st(k),i*.09,i===3?.55:.28,{type:'triangle',vol:.3});tone(1046.5*r*st(k),i*.09,.2,{type:'sine',vol:.08})})}
    else if(v===1){tone(988*r,0,.1,{type:'square',vol:.1});tone(1319*r,.1,.45,{type:'square',vol:.1,hold:.3});tone(2638*r,.1,.3,{type:'sine',vol:.05})}
    else{tone(392*r,0,.13,{type:'sawtooth',vol:.16,lp:2200});tone(392*r,.15,.13,{type:'sawtooth',vol:.16,lp:2200});[0,4,7].forEach(k=>tone(523.25*r*st(k),.3,.65,{type:'sawtooth',vol:.12,lp:2400,hold:.5}))}
    if(n>=3)for(let i=0;i<7;i++)tone(1046.5*st(i*2),.45+i*.06,.22,{type:'sine',vol:.1});
  }
  // 答错：五种随机，有搞笑的伤心小号，也有温和的提示音
  function bad(){let v;do{v=Math.floor(Math.random()*5)}while(v===lastBad);lastBad=v;
    if(v===0){[[233,0],[220,.38],[207.65,.76]].forEach(([f,t])=>tone(f,t,.34,{type:'sawtooth',vol:.22,lp:900,hold:.8,attack:.04}));tone(196,1.14,1,{type:'sawtooth',vol:.22,lp:800,to:150,vib:[6,5],hold:.8,attack:.04})}
    else if(v===1)tone(900,0,.95,{type:'sine',to:170,vol:.3,vib:[9,12]});
    else if(v===2){tone(659.25,0,.3,{type:'triangle',vol:.25});tone(523.25,.28,.6,{type:'triangle',vol:.25,hold:.4})}
    else if(v===3)tone(330,0,.7,{type:'sine',to:100,vol:.35,vib:[13,30]});
    else{[784,659.25,523.25,392].forEach((f,i)=>{tone(f,i*.13,.35,{type:'triangle',vol:.22});tone(f*2,i*.13,.15,{type:'sine',vol:.06})});tone(130,.6,.4,{type:'triangle',vol:.35,to:80})}
  }
  const G=f=>(...a)=>{if(on()&&ensure())f(...a)};
  return {
    unlock:()=>{ensure()},
    good:G(n=>good(Math.max(1,n||1))),
    bad:G(bad),
    reveal:G(()=>{tone(330,0,.15,{type:'sine',vol:.25});tone(659.25,.14,.4,{type:'triangle',vol:.2})}),
    tick:G(n=>{const f=560+(5-n)*70;tone(f,0,.07,{type:'square',vol:.09});if(n<=2)tone(f,.25,.07,{type:'square',vol:.09})}),
    timeup:G(()=>{for(let i=0;i<6;i++)tone(i%2?1175:880,i*.11,.1,{type:'square',vol:.1});tone(120,.7,.5,{type:'sawtooth',vol:.2,lp:600})}),
    clue:G(n=>{tone(520*st(n*3),0,.18,{type:'triangle',vol:.28});tone(780*st(n*3),.1,.25,{type:'triangle',vol:.2})}),
    pop:G(()=>tone(700,0,.07,{type:'sine',to:1100,vol:.2})),
    start:G(()=>{tone(440,0,.08,{type:'square',vol:.08});tone(660,.09,.14,{type:'square',vol:.08})}),
    coin:G(()=>{tone(1319,0,.07,{type:'square',vol:.1});tone(1760,.07,.35,{type:'square',vol:.1,hold:.3})}),
    down:G(()=>tone(300,0,.25,{type:'triangle',to:150,vol:.25})),
    next:G(()=>tone(300,0,.16,{type:'sine',to:900,vol:.12})),
    go:G(()=>{tone(392,0,.1,{type:'triangle',vol:.25});tone(523.25,.1,.1,{type:'triangle',vol:.25});tone(784,.2,.35,{type:'triangle',vol:.25})}),
    lead:G(()=>{tone(784,0,.1,{type:'triangle',vol:.25});tone(988,.1,.1,{type:'triangle',vol:.25});tone(1175,.2,.45,{type:'triangle',vol:.25})}),
    finish:G(()=>{[0,.17,.34].forEach(t=>tone(523.25,t,.15,{type:'sawtooth',vol:.16,lp:2200}));[523.25,659.25,784,1046.5].forEach(f=>tone(f,.51,.8,{type:'sawtooth',vol:.12,lp:2400,hold:.6}));for(let i=0;i<8;i++)tone(784*st(i*2),1.1+i*.06,.22,{type:'sine',vol:.1})})
  };
})();

/* 中文鼓励语 */
const PRAISE=['答对啦！太棒了！','真厉害！地理小达人！','完全正确！','漂亮！这题拿下！','你们是地理小专家！','思路满分！','太强了，继续保持！','👏 掌声送给你们！'];
const COMFORT=['没关系，错题才是宝藏～','差一点点！再想想','别灰心，下次一定行！','勇敢尝试就是胜利','记住这个知识点，下次拿分！','哎呀，这道题有点狡猾'];
const NOBODY=['这题有点难，一起来听听讲解','没人答对？那更要认真听啦','小小难题，我们一起攻克'];
const fxPick=a=>a[Math.floor(Math.random()*a.length)];
const fxReduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

/* 语音鼓励（可选；只有电脑装有中文语音时才显示开关） */
let zhVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];zhVoice=vs.find(v=>/zh[-_]?CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}catch(e){zhVoice=null}$('voiceWrap').classList.toggle('hide',!zhVoice)}
function speak(t){if(!zhVoice||!$('voice').checked||!$('sound').checked)return;setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^一-龥，。！？、\w+\s]/g,''));u.lang=zhVoice.lang;u.voice=zhVoice;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}},450)}

/* 画面效果：中文弹字、彩带、抖动、眼泪、分数跳动 */
let toastT=0;
function fxToast(t,kind){const el=$('toast');el.firstChild.textContent=t;el.className='';void el.offsetWidth;el.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>{el.className=''},2100)}
let cfCv=null,cfRun=false,cfP=[];
function fxConfetti(n){
  if(fxReduced())return;
  if(!cfCv){cfCv=document.createElement('canvas');cfCv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20';document.body.appendChild(cfCv)}
  const W=cfCv.width=innerWidth,H=cfCv.height=innerHeight,cols=['#ffcf3f','#3ddc84','#ff5d6c','#7cb3ff','#c79bff','#ff9a3d'];
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.9,sp=9+Math.random()*13;
    cfP.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.38,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*6,c:cols[i%cols.length],life:0,star:Math.random()<.08})}
  if(!cfRun){cfRun=true;requestAnimationFrame(cfStep)}
}
function cfStep(){
  const c=cfCv.getContext('2d');c.clearRect(0,0,cfCv.width,cfCv.height);
  cfP=cfP.filter(p=>p.y<cfCv.height+30&&p.life<200);
  for(const p of cfP){p.vy+=.35;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    c.save();c.translate(p.x,p.y);c.rotate(p.r);c.globalAlpha=Math.min(1,(200-p.life)/40);
    if(p.star){c.font='20px sans-serif';c.fillText('⭐',-10,8)}else{c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h)}c.restore()}
  if(cfP.length)requestAnimationFrame(cfStep);else{cfRun=false;c.clearRect(0,0,cfCv.width,cfCv.height)}
}
function fxShake(){if(fxReduced())return;const c=document.querySelector('.qcard');if(!c)return;c.classList.remove('sad');void c.offsetWidth;c.classList.add('sad');setTimeout(()=>c.classList.remove('sad'),1300)}
function fxTears(){if(fxReduced())return;for(let i=0;i<9;i++){const s=document.createElement('span');s.className='tear';s.textContent=i%3?'💧':'😢';s.style.left=(6+Math.random()*88)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';s.style.animationDuration=(1.2+Math.random()*.8)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function scorePop(i,from,to){
  ['boardPlay','boardHome'].forEach(id=>{const t=$(id).children[i];if(!t)return;const s=t.querySelector('.s');
    s.classList.add('bump');setTimeout(()=>s.classList.remove('bump'),700);
    const d=to-from,f=document.createElement('div');f.className='fl '+(d>=0?'up':'dn');f.textContent=(d>=0?'+':'')+d;t.appendChild(f);setTimeout(()=>f.remove(),1200);
    const t0=performance.now();(function step(now){const k=Math.min(1,(now-t0)/600);s.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(step)})(t0);
  });
}
function updStreak(){const e=$('streak');if(streak>=2){e.textContent='🔥 '+streak+'连对';e.classList.remove('hide');e.style.animation='none';void e.offsetWidth;e.style.animation=''}else e.classList.add('hide')}

/* 事件反馈：答对 / 答错 / 加分 / 无人答对 */
function onCorrect(){streak++;resultKind='good';updStreak();SFX.good(streak);
  const t=streak>=5?streak+'连对！地理大神！':streak===4?'四连对！太神啦！':streak===3?'三连对！势不可挡！':streak===2?'连对啦！太稳了！':fxPick(PRAISE);
  fxToast('🎉 '+t,'good');fxConfetti(streak>=3?200:110);speak(t)}
function onWrong(){streak=0;resultKind='bad';updStreak();SFX.bad();const t=fxPick(COMFORT);fxToast('😢 '+t,'bad');fxShake();fxTears();speak(t)}
function onAward(i,pts,old){
  const nm=S.teams[i].name,had=resultKind;
  if(had==='')streak++;
  if(had==='good'){SFX.coin();fxConfetti(60)}else{SFX.good(Math.max(1,streak));fxConfetti(pts>=30?170:100)}
  if(had==='')resultKind='good';updStreak();
  fxToast('🎉 '+nm+' +'+pts+' 分！','good');scorePop(i,old[i],old[i]+pts);speak(nm+'，答对啦！');
  const lead=a=>{const m=Math.max(...a);return m>0?a.map((v,j)=>v===m?j:-1).filter(j=>j>=0):[]};
  const ol=lead(old),nl=lead(S.teams.map(t=>t.score));
  if(nl.length===1&&ol.length>0&&!ol.includes(nl[0]))setTimeout(()=>{SFX.lead();fxToast('🏆 '+nm+' 反超，登顶领先！','good');fxConfetti(80)},1600);
}
function onNobody(){if(resultKind===''){streak=0;updStreak()}resultKind='bad';SFX.bad();const t=fxPick(NOBODY);fxToast('🤔 '+t,'bad');fxTears();$('award').innerHTML='<span>😅 '+t+'</span>';speak(t)}
function goNext(){SFX.next();nextQ()}
function initSfxUI(){
  try{const p=JSON.parse(localStorage.getItem('gq_sfx')||'{}');if(p.vol!=null)$('vol').value=p.vol;if(p.voice)$('voice').checked=true;if(p.sound===false)$('sound').checked=false;if(p.auto===false)$('autoRev').checked=false}catch(e){}
  const save=()=>{try{localStorage.setItem('gq_sfx',JSON.stringify({vol:+$('vol').value,voice:$('voice').checked,sound:$('sound').checked,auto:$('autoRev').checked}))}catch(e){}};
  ['vol','voice','sound','autoRev'].forEach(id=>$(id).addEventListener('change',save));
  $('sound').addEventListener('change',()=>{if(!$('sound').checked){try{speechSynthesis.cancel()}catch(e){}}});
  $('sfxTest').onclick=()=>{SFX.good(1);setTimeout(()=>SFX.bad(),1300)};
  document.addEventListener('pointerdown',()=>SFX.unlock());
  if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
}


/* ================= 页面切换 ================= */
function goHome(){stopTimer();$('play').classList.add('hide');$('home').classList.remove('hide');renderCats();renderBoards()}
let overHome=false;
function showOver(){
  const max=Math.max(...S.teams.map(t=>t.score));const win=S.teams.filter(t=>t.score===max&&max>0).map(t=>t.name);
  SFX.finish();fxConfetti(260);$('overT').textContent='🎉 本关题目已答完！';
  $('overP').innerHTML=(win.length?`领先：<b style="color:#ffcf3f">${win.map(esc).join('、')}</b>（${max}分）<br>`:'')+'换个关卡继续，或点“分数清零”再来一轮。';
  overHome=true;$('over').classList.remove('hide');
}
function msg(t,m){$('overT').textContent=t;$('overP').innerHTML=m;overHome=false;$('over').classList.remove('hide')}
$('overBtn').onclick=()=>{$('over').classList.add('hide');if(overHome)goHome()};
$('teamCount').onchange=e=>initTeams(+e.target.value);
$('timeSel').onchange=()=>{if(!$('play').classList.contains('hide'))resetTimer()};
$('resetBtn').onclick=()=>{streak=0;updStreak();S.teams.forEach(t=>t.score=0);Object.keys(S.used).forEach(k=>S.used[k]=[]);saveTeams();renderBoards();renderCats()};
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
$('homeBtn').onclick=goHome;$('tBtn').onclick=toggleTimer;$('clueBtn').onclick=moreClue;$('ansBtn').onclick=reveal;$('nextBtn').onclick=goNext;
document.addEventListener('keydown',e=>{
  if($('play').classList.contains('hide')||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();toggleTimer()}
  else if(e.key==='Enter'){e.preventDefault();reveal()}
  else if(e.key==='ArrowRight')goNext();
  else if(e.key==='ArrowDown')moreClue();
});

/* ================= 启动 ================= */
$('teamCount').value=S.teams.length||4;
initTeams(+$('teamCount').value);renderCats();initSfxUI();

</script>
