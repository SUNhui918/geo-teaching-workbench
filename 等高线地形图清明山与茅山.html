<!DOCTYPE html>
<!-- 本页面由横山桥高级中学 孙慧制作，仅供教学使用，未经许可不得商用 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="renderer" content="webkit">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>等高线地形图 · 从山体到地图</title>
<style>
:root{--ink:#1d1d1b;--muted:#66665f;--line:#d9d7d0;--paper:#f7f5ef;--panel:#fff;--green:#2f6b3b;--red:#c8372d;--blue:#1f5fa8;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{background:var(--panel);padding:10px 16px 0;border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;font-size:20px;letter-spacing:1px}
h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px;letter-spacing:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;border:none;background:none;padding:8px 16px 10px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;text-align:left}
.tabs button b{display:block;font-size:16px;color:var(--ink)}
.tabs button span{font-size:12px}
.tabs button.on{border-bottom-color:var(--green)} .tabs button.on b{color:var(--green)}
main{flex:1;min-height:0;display:flex}
#view{position:relative;flex:1;min-width:0;touch-action:none;background:linear-gradient(#eef2f4,#dfe6ea)}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.vbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.vbar button,.pbtn{font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;border:1px solid #bcbab2;background:rgba(255,255,255,.95);cursor:pointer;color:var(--ink)}
.vbar button.on,.pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbtn:disabled{opacity:.4;cursor:default}
.hint{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:#555;background:rgba(255,255,255,.8);padding:3px 8px;border-radius:6px;pointer-events:none}
#hover:empty{display:none}
#hover{position:absolute;right:12px;bottom:10px;font-size:13px;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:6px;border:1px solid var(--line);pointer-events:none;font-variant-numeric:tabular-nums}
aside{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 24px}
aside h2{font-size:17px;margin:0 0 6px}
aside p{font-size:14.5px;line-height:1.7;margin:6px 0}
.steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.step b{font-size:15.5px} .step small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.5}
.step.on{border-color:var(--green);box-shadow:0 0 0 2px rgba(47,107,59,.18);background:#f4faf3}
.step .no{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;text-align:center;font-size:13px;line-height:22px;margin-right:6px}
.ctrl{background:#f6f5f0;border-radius:10px;padding:10px 12px;margin:8px 0}
.ctrl label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;margin:4px 0}
.ctrl input[type=range]{flex:1;accent-color:var(--green)}
.big{font-size:22px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.ask{background:#fff8e6;border-left:4px solid #e0a800;padding:8px 10px;border-radius:6px;font-size:14.5px;line-height:1.7;margin:8px 0}
.why{background:#eef7ee;border-left:4px solid var(--green);padding:8px 10px;border-radius:6px;font-size:14.5px;line-height:1.7;margin:8px 0;display:none}
.why.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1.5px solid #bcbab2;background:#fff;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .ok{color:#2e9d3e;font-weight:700;margin-left:4px}
.chip.on .ok{color:#9ef0a8}
#fb{font-size:15px;line-height:1.7;border-radius:8px;padding:8px 10px;margin:8px 0;display:none}
#fb.good{display:block;background:#e7f6e9;border:1px solid #9bd3a3}
#fb.bad{display:block;background:#fdecea;border:1px solid #f1aaa3}
table.sum{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
table.sum th,table.sum td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.sum th{background:#f3f2ec}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#fff;z-index:9;font-size:16px;line-height:1.8}
@media (max-width:820px){
  main{flex-direction:column}
  #view{flex:none;height:56vh}
  aside{width:auto;flex:1;border-left:none;border-top:1px solid var(--line)}
  h1 small{display:none}
}
</style>
</head>
<body>
<header>
  <h1>等高线地形图 · 从山体到地图<small>横山桥高中地理教研组 · 数据：ASTER GDEM V3（30 米）</small></h1>
  <div class="tabs" id="tabs">
    <button data-tab="qm" class="on"><b>① 清明山：切出等高线</b><span>水平面切割 → 交线 → 投影</span></button>
    <button data-tab="ms"><b>② 茅山：判读地形部位</b><span>山峰 · 山脊 · 山谷 · 鞍部 · 陡坡</span></button>
    <button data-tab="md"><b>③ 典型模型：陡崖与洼地</b><span>真实山体看不到的部位</span></button>
  </div>
</header>
<main>
  <div id="view">
    <canvas id="gl"></canvas><canvas id="ov"></canvas>
    <div class="vbar" id="vbar">
      <button data-v="3d" class="on">三维山体</button>
      <button data-v="map">平面等高线图</button>
      <button id="resetCam">⟲ 复位</button>
    </div>
    <div class="hint" id="hint">拖动旋转 · 右键/双指平移 · 滚轮缩放</div>
    <div id="hover"></div>
    <div id="err"></div>
  </div>
  <aside id="panel"></aside>
</main>

function i16(b64){const s=atob(b64),n=s.length/2,o=new Float32Array(n);for(let k=0;k<n;k++){let v=s.charCodeAt(2*k)|(s.charCodeAt(2*k+1)<<8);if(v>32767)v-=65536;o[k]=v/10;}return o;}

/* ================= 典型模型（合成地形） ================= */
function buildModel(){
  const W=220,H=170,dx=10,z=new Float32Array(W*H);
  const g=(x,y,cx,cy,s)=>Math.exp(-((x-cx)**2+(y-cy)**2)/(2*s*s));
  function seg(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy;let t=((px-ax)*vx+(py-ay)*vy)/L;t=Math.max(0,Math.min(1,t));const qx=ax+t*vx,qy=ay+t*vy;return [Math.hypot(px-qx,py-qy),t];}
  const H0=(x,y)=>{
    let h=30+0.003*x+0.002*y;
    h+=260*g(x,y,700,650,220);                    // 主峰
    h+=190*g(x,y,1330,560,190);                   // 次峰
    const rw=t=>Math.sin(Math.min(t/0.45,1)*Math.PI/2)*(1-0.7*t);
    let [d,t]=seg(x,y,700,650,330,1180);h+=95*Math.exp(-d*d/(2*80*80))*rw(t);   // 西南山脊
    [d,t]=seg(x,y,700,650,1060,1250);h+=90*Math.exp(-d*d/(2*80*80))*rw(t);       // 东南山脊
    // 陡崖：次峰东侧的陡坎
    const cl=1530+25*Math.sin((y-560)/90),Sg=v=>1/(1+Math.exp(-v));
    h+=110*Sg((cl-x)/3)*Math.exp(-((y-560)**2)/(2*110*110))*Sg((x-1330)/40);
    // 洼地：西南小山顶的凹坑
    h+=120*g(x,y,400,1430,200);h-=70*g(x,y,400,1430,70);
    return h;};
  for(let j=0;j<H;j++)for(let i=0;i<W;i++)z[j*W+i]=H0(i*dx,j*dx);
  return {name:'典型地形模型',W,H,dx,dy:dx,z,synthetic:true,H0};
}

  const md=buildModel();SITES.md={...md,int:20,c0:40,idx:100,ex:1.3,title:'典型地形模型'};
  for(const k in SITES){const s=SITES[k];let a=1e9,b=-1e9;for(const v of s.z){if(v<a)a=v;if(v>b)b=v;}s.zmin=a;s.zmax=b;}

// 模型答案
(function(){

  function localMax(cx,cy,r){let best=-1,bv=-1e9;for(let j=cy-r;j<=cy+r;j++)for(let i=cx-r;i<=cx+r;i++){const v=z[j*W+i];if(v>bv){bv=v;best=[i,j];}}return [best[0],best[1],bv];}
  const A=localMax(70,65,15),B=localMax(134,56,15);
  // 鞍部：A-B 连线上最低处，再在垂直方向取最高
  let sv=1e9,sp=null;for(let t=0.15;t<=0.85;t+=0.01){const i=Math.round(A[0]+(B[0]-A[0])*t),j=Math.round(A[1]+(B[1]-A[1])*t);if(z[j*W+i]<sv){sv=z[j*W+i];sp=[i,j];}}
  s.peaks=[A,B];s.saddles=[[sp[0],sp[1],sv]];

  s.ridgeLines=[[[70,65],[33,118]],[[70,65],[106,125]],[[A[0],A[1]],[sp[0],sp[1]],[B[0],B[1]]]];
  // 山谷：两条山脊之间每行最低点
  const vl=[];for(let j=86;j<=124;j+=2){const x1=70+(j-65)*(33-70)/(118-65),x2=70+(j-65)*36/60;let bi=-1,bv=1e9;for(let i=Math.ceil(Math.max(x1,10)+5);i<=Math.floor(x2-5);i++){const v=z[j*W+i];if(v<bv){bv=v;bi=i;}}if(bi>0)vl.push([bi,j]);}
  function segD(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy;let t=((px-ax)*vx+(py-ay)*vy)/L;t=Math.max(0,Math.min(1,t));return [Math.hypot(px-ax-t*vx,py-ay-t*vy),t];}
  const vs=vl.map((p,k)=>{let a=0,c=0;for(let q=Math.max(0,k-2);q<=Math.min(vl.length-1,k+2);q++){a+=vl[q][0];c++;}return [a/c,p[1]];});s.valleyLines=[vs];
  const cl=[];for(let y=480;y<=640;y+=10){cl.push([(1530+25*Math.sin((y-560)/90))/10,y/10]);}
  s.cliffLines=[cl];s.pits=[[40,143]];

  let pmin=1e9;for(let j=133;j<=153;j++)for(let i=30;i<=50;i++)pmin=Math.min(pmin,z[j*W+i]);

  const n=W*H;s.ridge=new Uint8Array(n);s.valley=new Uint8Array(n);s.cliff=new Uint8Array(n);

  ras(s.ridgeLines,s.ridge);ras(s.valleyLines,s.valley);ras(s.cliffLines,s.cliff);

  const n=Math.max(0.005,cam.dist*0.01),fa=cam.dist*8+50,f=1/Math.tan(cam.fov/2),asp=CW/CH;

      document.getElementById('plUp').onclick=()=>{loopFn=null;const L=this.plane<S.c0?S.c0:(Math.floor((this.plane-S.c0)/R.int)+1)*R.int+S.c0;const a=this.plane;tween(600,e=>{this.plane=a+(Math.min(L,S.zmax+2)-a)*e;upd();});};
      document.getElementById('plReset').onclick=()=>{loopFn=null;this.plane=S.c0-6;upd();};
      document.getElementById('plAuto').onclick=()=>{let last=performance.now();if(this.plane>=S.zmax)this.plane=S.c0-6;loopFn=now=>{const dt=(now-last)/1000;last=now;this.plane+=dt*7;if(this.plane>=S.zmax+2){this.plane=S.zmax+2;upd();loopFn=null;return false;}upd();return true;};kick();};
      upd();}
    if(s===3){R.cut=1e9;if(viewMode!=='3d')setViewMode('3d');const gap=(S.zmax-S.zmin)*0.001*S.ex*0.55+0.04;this.paperY=-gap;R.paper=-gap;R.mode=0;
      box.innerHTML=`<div class="ask">现在山坡上已经有了一圈圈等高线。把它们<b>垂直向下投影</b>到下方白色的“地图纸”上，会得到什么？</div>
        <button class="pbtn on" id="pjGo">▶ 投影</button> <button class="pbtn" id="pjBack">↺ 收回</button>
        <div class="why" id="pjWhy">每条交线垂直落到同一个平面上，就成了<b>一圈圈闭合的曲线</b>。投影只保留了“平面位置”，所以要在线上<b>标出海拔数字</b>，才能读出高低。</div>
        <button class="pbtn on" onclick="PAGE.go(4)" style="margin-top:6px">下一步：读这张图 →</button>`;
      const run=(a,b)=>tween(2600,e=>{this.proj=a+(b-a)*e;R.alpha=1-0.72*this.proj;if(this.proj>0.95)document.getElementById('pjWhy').classList.add('show');});
      document.getElementById('pjGo').onclick=()=>run(this.proj,1);document.getElementById('pjBack').onclick=()=>run(this.proj,0);
      setTimeout(()=>run(0,1),500);}
    if(s===4){R.cut=1e9;R.paper=null;this.proj=1;R.mode=2;setViewMode('map',instant);R.alpha=1;
      box.innerHTML=`<div class="ctrl"><label>等高距 <select id="itv" style="font:inherit"><option value="10">10 米</option><option value="20">20 米</option><option value="5">5 米</option></select></label></div>
        <div class="ask">对照三维山体回答：<br>① 清明山大致是什么走向？<br>② 山顶最内圈约多少米？<br>③ 南坡和北坡，哪边等高线更密？哪边更陡？</div>
        <button class="pbtn" onclick="setViewMode(viewMode==='map'?'3d':'map')">⇄ 平面图 / 三维 来回对照</button>
        <div class="why show" style="margin-top:10px"><b>小结：</b>等高线 = 水平面与地面的交线投影到平面。<br>同线等高；等高距相同时，<b>等高线密 → 坡陡，疏 → 坡缓</b>；闭合曲线中间高、四周低，是山顶。</div>`;
      document.getElementById('itv').value=R.int;document.getElementById('itv').onchange=e=>{R.int=+e.target.value;kick();};}
    kick();},
  overlay(){
    if(this.step===3&&this.proj>0.001){const t=this.proj,py=this.paperY;
      for(const L of levels()){const sg=contourSegs(L),y=wy(L)*(1-t)+py*t;oc.strokeStyle=L%S.idx===0?'#8a3b0c':'#b05a1e';oc.lineWidth=L%S.idx===0?2.2:1.5;oc.beginPath();
        for(let k=0;k<sg.length;k+=4){const a=project([wx(sg[k]),y,wz(sg[k+1])]),b=project([wx(sg[k+2]),y,wz(sg[k+3])]);if(a&&b){oc.moveTo(a[0],a[1]);oc.lineTo(b[0],b[1]);}}oc.stroke();
        // 垂直引线
        oc.setLineDash([4,4]);oc.strokeStyle='rgba(40,90,200,.55)';oc.lineWidth=1;oc.beginPath();const st=Math.max(8,Math.floor(sg.length/4/5))*4;
        for(let k=0;k<sg.length;k+=st){const a=project([wx(sg[k]),wy(L),wz(sg[k+1])]),b=project([wx(sg[k]),y,wz(sg[k+1])]);if(a&&b){oc.moveTo(a[0],a[1]);oc.lineTo(b[0],b[1]);}}oc.stroke();oc.setLineDash([]);}
      if(t>0.9)levelLabels(()=>py,()=>'#8a3b0c');
      const c=project([wx(S.W*0.06),py,wz(S.H*0.94)]);if(c)halo('地图纸（水平面）',c[0],c[1],'700 13px '+F,'#555','left');}
    if(this.step===2&&R.plane!=null){const h=R.plane;const c=project([wx(S.W*0.03),wy(h),wz(S.H*0.97)]);if(c)halo(`水平面 ${h.toFixed(0)} 米`,c[0],c[1]-10,'700 14px '+F,'#1f5fa8','left');
      if(R.hl>0){const sg=contourSegs(R.hl);if(sg.length){let bi=0,bx=-1e9;for(let k=0;k<sg.length;k+=4)if(sg[k]>bx){bx=sg[k];bi=k;}const p=project(P3(sg[bi],sg[bi+1],R.hl,0.004));if(p)halo(`交线：${R.hl} 米等高线`,p[0]+12,p[1],'700 14px '+F,'#c8372d','left');}}}
    if(this.step===4){levelLabels(L=>wy(L),L=>L%S.idx===0?'#7a2e05':'#8a5a2a');if(viewMode==='map')northScale();}
    const t=S.top;if(this.step!==3||this.proj<0.5)marker(t[0],t[1],t[2],'#c8372d',`清明山 ${t[2].toFixed(0)} 米`,'tri');
    const w=S.west;if(w&&this.step!==3)marker(w[0],w[1],w[2],'#666',`${w[2].toFixed(0)} 米`,'tri');
  }
};

/* ================= 页面：② 茅山 / ③ 模型 判读 ================= */
const FEAT={
  peak:{n:'山峰',tip:'找一处“闭合曲线、中心数值最高”的地方。',rule:'等高线<b>闭合</b>，数值<b>中间高、四周低</b>。'},
  ridge:{n:'山脊',tip:'沿着山顶向外延伸的“高高的脊背”。',rule:'等高线<b>向低处凸出</b>（凸低为高）；山脊线也是<b>分水线</b>。'},
  valley:{n:'山谷',tip:'两条山脊之间凹进去的地方。',rule:'等高线<b>向高处凸出</b>（凸高为低）；山谷线也是<b>集水线</b>，常发育河流。'},
  saddle:{n:'鞍部',tip:'两个山顶之间“马鞍”一样低下去的地方。',rule:'位于<b>两组闭合等高线之间</b>，比两侧山顶低、比另两侧山谷高。'},
  steep:{n:'陡坡',tip:'等高距相同，哪里的等高线挤在一起？',rule:'等高距相同时，<b>等高线越密，坡越陡</b>。'},
  cliff:{n:'陡崖',tip:'几条等高线挤到一起，甚至重合。',rule:'多条等高线<b>重合</b>处为陡崖；崖顶海拔与崖底海拔可由重合的等高线推算。'},
  pit:{n:'洼地',tip:'也是闭合曲线，但要看清数值和示坡线。',rule:'闭合等高线<b>中间低、四周高</b>，常画<b>示坡线</b>（短线指向低处）。'}
};
function classify(i,j){ // 返回点击处属于什么
  const W=S.W,ii=Math.round(i),jj=Math.round(j);const near=(mask,r)=>{if(!mask)return false;for(let b=-r;b<=r;b++)for(let a=-r;a<=r;a++){const x=ii+a,y=jj+b;if(x>=0&&y>=0&&x<W&&y<S.H&&mask[y*W+x]&&a*a+b*b<=r*r+0.5)return true;}return false;};
  const dist=(p)=>Math.hypot(p[0]-i,p[1]-j)*S.dx;
  const r={};
  r.peak=S.peaks.some(p=>dist(p)<=(S.synthetic?70:110));r.saddle=S.saddles.some(p=>dist(p)<=(S.synthetic?70:110));
  r.pit=(S.pits||[]).some(p=>dist(p)<=80);
  r.cliff=near(S.cliff,S.synthetic?3:0);
  const rr=Math.max(1,Math.round(45/S.dx));r.ridge=near(S.ridge,rr)&&!r.peak&&!r.saddle;r.valley=near(S.valley,rr);
  const gx=(zAt(ii+1,jj)-zAt(ii-1,jj))/(2*S.dx),gy=(zAt(ii,jj+1)-zAt(ii,jj-1))/(2*S.dy);r.slope=Math.atan(Math.hypot(gx,gy))*180/Math.PI;
  r.steep=r.slope>=(S.slopeThr||28)&&!r.cliff;r.h=hAt(i,j);
  return r;}
function descr(r){if(r.pit)return '洼地';if(r.cliff)return '陡崖';if(r.peak)return '山峰（山顶）';if(r.saddle)return '鞍部';if(r.ridge)return '山脊';if(r.valley)return '山谷';
  if(r.h<S.c0)return '山脚下的平原';return r.slope>=(S.slopeThr||28)?'陡坡':(r.slope<8?'缓坡':'一般山坡');}
function makeJudgePage(featList,intro){return {
  cur:featList[0],marks:[],reveal:{},done:{},
  enter(){this.marks=[];this.reveal={};this.done={};this.cur=featList[0];R.int=S.int;R.cut=1e9;R.mode=2;R.alpha=1;R.plane=null;R.paper=null;setViewMode('map',true);clickFn=h=>this.click(h);},
  leave(){clickFn=null;},
  html(){return `${intro()}
    <div class="chips" id="fchips">${featList.map(f=>`<button class="chip" data-f="${f}">${FEAT[f].n}<span class="ok" id="ok_${f}"></span></button>`).join('')}</div>
    <div class="ask" id="task"></div>
    <div id="fb"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pbtn" id="rv">💡 显示全部“<span id="rvn"></span>”</button><button class="pbtn on" id="up">⛰ 让山“立起来”验证</button><button class="pbtn" id="clr">清除标记</button></div>
    <div class="why" id="rule"></div>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">📘 判读口诀（完成后再看）</summary>
      <table class="sum"><tr><th>部位</th><th>等高线特征</th></tr>${featList.map(f=>`<tr><td>${FEAT[f].n}</td><td style="text-align:left">${FEAT[f].rule}</td></tr>`).join('')}</table></details>`;},
  bind(){document.querySelectorAll('#fchips .chip').forEach(b=>b.onclick=()=>{this.cur=b.dataset.f;this.upd();});
    document.getElementById('rv').onclick=()=>{this.reveal[this.cur]=!this.reveal[this.cur];document.getElementById('rule').classList.add('show');this.upd();};
    document.getElementById('up').onclick=()=>setViewMode(viewMode==='map'?'3d':'map');
    document.getElementById('clr').onclick=()=>{this.marks=[];document.getElementById('fb').className='';kick();};this.upd();},
  onView(m){const b=document.getElementById('up');if(b)b.textContent=m==='map'?'⛰ 让山“立起来”验证':'🗺 压回平面图';},
  upd(){document.querySelectorAll('#fchips .chip').forEach(b=>b.classList.toggle('on',b.dataset.f===this.cur));const f=FEAT[this.cur];
    document.getElementById('task').innerHTML=`在<b>平面等高线图</b>上点出一处 <b>${f.n}</b>。<br><span style="color:#777;font-size:13.5px">提示：${f.tip}</span>`;
    document.getElementById('rvn').textContent=f.n;document.getElementById('rule').innerHTML=`<b>${f.n}：</b>${f.rule}`;kick();},
  click(h){const [i,j]=h;const r=classify(i,j);const ok=r[this.cur];const what=descr(r);this.marks.push([i,j,h[2],ok]);
    const fb=document.getElementById('fb');
    if(ok){this.done[this.cur]=(this.done[this.cur]||0)+1;document.getElementById('ok_'+this.cur).textContent='✓'+(this.done[this.cur]>1?this.done[this.cur]:'');
      fb.className='good';fb.innerHTML=`✓ 对了！这里是<b>${FEAT[this.cur].n}</b>（海拔约 ${h[2].toFixed(0)} 米）。<br>说说你是怎么从等高线看出来的？再点“让山立起来”验证。`;
      document.getElementById('rule').classList.add('show');}
    else{fb.className='bad';fb.innerHTML=`✗ 这里更像是<b>${what}</b>（海拔约 ${h[2].toFixed(0)} 米），不是${FEAT[this.cur].n}。再看看等高线的形状和数值，换个地方试试。`;}
    kick();},
  overlay(){
    levelLabels(L=>wy(L),L=>L%S.idx===0?'#7a2e05':'#8a5a2a',S.idx);
    if(viewMode==='map')northScale();
    // 洼地示坡线（属于地图本身的符号）
    if(S.pits)for(const p of S.pits)hachure(p);
    const rv=this.reveal;
    if(rv.ridge){if(S.ridgeLines)S.ridgeLines.forEach(L=>polyline3(L,'#d32f2f',3.5,[10,6]));else maskDots(S.ridge,'#d32f2f',3);}
    if(rv.valley){if(S.valleyLines)S.valleyLines.forEach(L=>polyline3(L,'#1565c0',3.5,[10,6]));else maskDots(S.valley,'#1565c0',3);}
    if(rv.cliff&&S.cliffLines)S.cliffLines.forEach(L=>polyline3(L,'#6a1b9a',5));
    if(rv.peak)S.peaks.filter(p=>p.length<4||p[3]>=45).forEach((p,k)=>marker(p[0],p[1],p[2],'#c8372d',`${k===0&&S.mainName?S.mainName+' ':''}${p[2].toFixed(0)} 米`,'tri'));
    if(rv.saddle)S.saddles.filter(p=>p.length<4||p[3]>=60).forEach(p=>marker(p[0],p[1],p[2],'#8e24aa',`鞍部 ${p[2].toFixed(0)} 米`,'ring'));
    if(rv.pit&&S.pits)S.pits.forEach(p=>marker(p[0],p[1],S.pitMin,'#00838f','洼地','ring'));
    if(rv.steep)steepDots();
    if(!rv.peak&&S.mainName){const p=S.peaks[0];marker(p[0],p[1],p[2],'#c8372d',S.mainName,'tri');}
    for(const [i,j,h,ok] of this.marks){const p=project(P3(i,j,h,0.003));if(!p)continue;oc.beginPath();oc.arc(p[0],p[1],9,0,7);oc.fillStyle=ok?'#2e9d3e':'#e53935';oc.fill();oc.strokeStyle='#fff';oc.lineWidth=2.5;oc.stroke();
      halo(ok?'✓':'✗',p[0],p[1],'800 12px '+F,'#fff');}
  }};}
function steepDots(){const thr=S.slopeThr||28,W=S.W;oc.fillStyle='rgba(230,81,0,.55)';const st=S.synthetic?2:1;
  for(let j=1;j<S.H-1;j+=st)for(let i=1;i<W-1;i+=st){const gx=(zAt(i+1,j)-zAt(i-1,j))/(2*S.dx),gy=(zAt(i,j+1)-zAt(i,j-1))/(2*S.dy);const s=Math.atan(Math.hypot(gx,gy))*180/Math.PI;
    if(s>=thr&&!(S.cliff&&S.cliff[j*W+i])){const p=project(P3(i,j,zAt(i,j),0.003));if(p)oc.fillRect(p[0]-1.5,p[1]-1.5,3,3);}}}
function hachure(p){const L=S.pitLevel;const pts=[];for(let a=0;a<12;a++){const ang=a/12*Math.PI*2;let r=0;for(;r<30;r+=0.25){const h=hAt(p[0]+Math.cos(ang)*r,p[1]+Math.sin(ang)*r);if(h==null||h>=L)break;}
    const i=p[0]+Math.cos(ang)*r,j=p[1]+Math.sin(ang)*r;const a1=project(P3(i,j,L,0.003)),a2=project(P3(i-Math.cos(ang)*2.2,j-Math.sin(ang)*2.2,L,0.003));if(a1&&a2){oc.beginPath();oc.moveTo(a1[0],a1[1]);oc.lineTo(a2[0],a2[1]);oc.strokeStyle='#7a2e05';oc.lineWidth=2;oc.stroke();}}}
PAGES.ms=makeJudgePage(['peak','ridge','valley','saddle','steep'],()=>`
  <h2>茅山：在等高线图上找地形部位</h2>
  <p>茅山主峰<b>大茅峰</b>公布海拔 372.5 米（数据中约 ${S.peaks[0][2].toFixed(0)} 米，30 米格网会把尖顶削低一些）。等高距 ${S.int} 米，粗线每 ${S.idx} 米一条。</p>
  <p style="color:#666;font-size:13.5px">先在平面图上“猜”，再让山立起来验证。陡崖、洼地真实山体里看不到，请到第 ③ 页。</p>`);
PAGES.md=makeJudgePage(['peak','ridge','valley','saddle','cliff','pit','steep'],()=>`
  <h2>典型地形模型：七种地形部位</h2>
  <p>这是按教材标准画法<b>设计的示意地形</b>（不是真实山体），把真实山区里不容易同时出现的<b>陡崖、洼地</b>也放了进来。等高距 ${S.int} 米。</p>
  <p style="color:#666;font-size:13.5px">注意区分：山峰和洼地都是闭合曲线——看数值，看示坡线。</p>`);

/* ================= 切换页面 ================= */
let PAGE=null;
function setTab(t){if(PAGE&&PAGE.leave)PAGE.leave();camTo=null;TAB=t;S=SITES[t];if(t==='ms')S.mainName='大茅峰';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  PAGE=PAGES[t];EX=S.ex;buildMesh();OVL.length=0;OVL.push(()=>PAGE.overlay());clickFn=null;loopFn=null;anims=[];
  panel.innerHTML=PAGE.html();PAGE.enter();if(PAGE.bind)PAGE.bind();
  if(t==='qm')document.querySelectorAll('.step').forEach(el=>el.onclick=()=>PAGE.go(+el.dataset.s));
  document.getElementById('hint').textContent=t==='qm'?'拖动旋转 · 右键/双指平移 · 滚轮缩放':'点击图上位置作答 · 平面图下拖动=平移 · 滚轮缩放';
  resize();kick();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
try{initGL();resize();setTab('qm');}
catch(e){errBox.style.display='flex';errBox.innerHTML=e==='no-webgl'?'当前浏览器没有开启 WebGL。<br>请用 Chrome / Edge 打开；360、QQ 浏览器请切换到“极速模式”。':'初始化失败：'+e;}
window.__T={SITES,setTab,setViewMode,pick,project,P3,classify,get S(){return S},get PAGE(){return PAGE},cam};
</script>
