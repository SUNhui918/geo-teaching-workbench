<script>
/* ---------- 数学与噪声 ---------- */
const PI=Math.PI;
function G(v,c,w){const t=(v-c)/w;return Math.exp(-t*t);}
function sq(v){return v*v;}
function cl(v,a,b){return v<a?a:(v>b?b:v);}
function sm(a,b,v){const t=cl((v-a)/(b-a),0,1);return t*t*(3-2*t);}
function lerp(a,b,t){return a+(b-a)*t;}
function fr(v){return v-Math.floor(v);}
function rng(seed){let s=seed>>>0;return function(){s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash2(i,j){let h=Math.imul(i|0,0x27d4eb2d)^Math.imul((j|0)+0x5bd1e995,0x165667b1);h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
/* 预计算分形噪声贴片，nz(u,v) 返回 0~1 */
const NT=256;const NOISE=new Float32Array(NT*NT);
function pnoise(x,y,p){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const i0=((i%p)+p)%p,j0=((j%p)+p)%p,i1=(i0+1)%p,j1=(j0+1)%p;
 return lerp(lerp(hash2(i0,j0),hash2(i1,j0),u),lerp(hash2(i0,j1),hash2(i1,j1),u),v);}
(function(){for(let j=0;j<NT;j++)for(let i=0;i<NT;i++){let s=0,a=1,f=1/16,n=0;for(let o=0;o<5;o++){s+=a*pnoise(i*f,j*f,Math.round(NT*f));n+=a;a*=0.5;f*=2;}NOISE[j*NT+i]=s/n;}
 let mn=1,mx=0;for(const v of NOISE){if(v<mn)mn=v;if(v>mx)mx=v;}for(let k=0;k<NOISE.length;k++)NOISE[k]=(NOISE[k]-mn)/(mx-mn);})();
function nz(u,v){const fu=Math.floor(u),fv=Math.floor(v);const tx=u-fu,ty=v-fv;const i=((fu%NT)+NT)%NT,j=((fv%NT)+NT)%NT,i1=(i+1)%NT,j1=(j+1)%NT;
 const a=NOISE[j*NT+i],b=NOISE[j*NT+i1],c=NOISE[j1*NT+i],d=NOISE[j1*NT+i1];return a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty;}
function rough(x,z,a){return a*(nz(x*9+40,z*9+17)-0.5)+0.5*a*(nz(x*31,z*31+90)-0.5);}
function spk(x,y){return hash2(Math.floor(x),Math.floor(y));}
function wob(x,y){return 0.5+0.5*Math.sin(x*1.7+y*0.6)*Math.sin(y*1.3-x*0.9);}
function hx(s){return parseInt(s.slice(1),16);}
function mix(c1,c2,t){t=cl(t,0,1);const r=lerp(c1>>16&255,c2>>16&255,t),g=lerp(c1>>8&255,c2>>8&255,t),b=lerp(c1&255,c2&255,t);return (r<<16)|(g<<8)|(b|0);}
function scl(c,f){const r=cl((c>>16&255)*f,0,255),g=cl((c>>8&255)*f,0,255),b=cl((c&255)*f,0,255);return (r<<16)|(g<<8)|(b|0);}
function shade(c,f){return scl(c,f);}

/* ---------- 岩性与地表：颜色 + 纹理类型 ---------- */
const PAT={};function L(s,p){const c=hx(s);PAT[c]=p;return c;}
const P={
 SS:L('#c2a273','sand'),SH:L('#74706a','shale'),LS:L('#b9b5a8','lime'),RS:L('#9e5f45','sand'),SI:L('#8f7d63','shale'),DO:L('#cfc6ae','lime'),
 GR:L('#d4ad9b','granite'),GRD:L('#a99a8e','granite'),BA:L('#403e3c','basalt'),GB:L('#4c5750','granite'),MAG:L('#e4572e','magma'),
 MAN:L('#c47a43','mantle'),AST:L('#d68f4c','mantle'),LITH:L('#8e6b4c','mantle'),CC:L('#9a7d5f','granite'),
 OCN:L('#3a4247','basalt'),OCR:L('#6a737a','basalt'),ICE:L('#dcebf4','ice'),GRV:L('#a8916a','gravel'),TILL:L('#87827a','till'),
 SOIL:L('#76593f','soil'),LOE:L('#cfae7f','loess'),SAND:L('#d6bc86','sand'),MUD:L('#7b8070','shale'),MAR:L('#ebe9e2','marble'),
 QZ:L('#ece2cc','sand'),SL:L('#4a4f57','shale'),BED:L('#87888a','granite'),CIN:L('#4a2e27','basalt'),CIN2:L('#2c2522','basalt'),
 CAVE:L('#3e362e','soil'),LAKE:L('#c9a77a','shale'),FAULT:L('#5a2a1c','plain'),ROOT:L('#5b3a22','soil'),CRACK:L('#2b2723','plain'),
 VOL:L('#4b4542','basalt'),VOL2:L('#38322f','basalt'),SILT:L('#b9a989','shale')
};
const STRATA=[P.SS,P.SH,P.LS,P.RS,P.SI,P.DO];
const C={mag:P.MAG,water:hx('#2f78a8')};
function pebble(a,y,s,base,angular){
 const ci=Math.floor(a/s),cj=Math.floor(y/s);let best=null;
 for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const i=ci+di,j=cj+dj;const h=hash2(i*7+3,j*13+5);
  const px=(i+0.25+0.5*hash2(i,j+91))*s,py=(j+0.25+0.5*hash2(i+57,j))*s;const r=s*(0.32+0.3*h);
  let d;if(angular){const an=h*6.28,ca=Math.cos(an),sa=Math.sin(an);const u=(a-px)*ca+(y-py)*sa,v=-(a-px)*sa+(y-py)*ca;d=Math.max(Math.abs(u)*1.15,Math.abs(v)*0.9+Math.abs(u)*0.25);}else{d=Math.hypot(a-px,(y-py)*1.25);}
  if(d<r&&(!best||d/r<best.q))best={q:d/r,h};}
 if(!best)return -1;
 const pal=[hx('#8f8b84'),hx('#a69b8a'),hx('#6c6862'),hx('#b8a98c'),hx('#7e7064'),hx('#9c9c96')];
 const c=pal[Math.floor(best.h*6)%6];
 return angular?scl(c,0.82+0.25*hash2(Math.floor(a/s*3),Math.floor(y/s*3))):scl(c,1.08-0.38*best.q*best.q);
}
function patCol(c,a,y){
 const p=PAT[c];let f=1;
 switch(p){
  case 'sand':{f=0.9+0.16*nz(a*70,y*70);if(spk(a*260,y*260)>0.93)f*=0.74;f*=0.97+0.05*Math.sin(y*160+3*nz(a*6,y*6));break;}
  case 'shale':{f=(0.9+0.1*Math.sin(y*320+5*nz(a*5,y*5)))*(0.94+0.1*nz(a*50,y*50));break;}
  case 'lime':{const bh=0.08,r=(y+0.012*nz(a*4,7))/bh,f1=fr(r),fj=fr((a+Math.floor(r)*0.11)/0.23);f=0.92+0.1*nz(a*40,y*40);if(f1<0.06||fj<0.022)f*=0.66;break;}
  case 'granite':{const h=spk(a*170,y*170);if(h>0.9)return scl(mix(c,0x1e1e1e,0.75),0.95+0.1*nz(a*9,y*9));if(h>0.77)return mix(c,0xf4f1ec,0.55);f=0.94+0.1*nz(a*30,y*30);break;}
  case 'basalt':{f=0.82+0.28*nz(a*28,y*28);if(spk(a*200,y*200)>0.95)f*=0.55;if(fr(a/0.11)<0.035)f*=0.78;break;}
  case 'magma':{return mix(hx('#ffbf3a'),hx('#b8220d'),cl(nz(a*14,y*14)*1.4-0.2,0,1));}
  case 'mantle':{f=0.8+0.32*nz(a*6,y*6);break;}
  case 'ice':{return scl(mix(c,hx('#9cc6df'),cl(nz(a*4,y*22)*1.3-0.35,0,1)),0.97+0.05*nz(a*30,y*30));}
  case 'gravel':{const pc=pebble(a,y,0.045,c,false);if(pc>=0)return pc;f=0.9+0.15*nz(a*60,y*60);return scl(P.SAND,f);}
  case 'till':{const big=hash2(Math.floor(a/0.13),Math.floor(y/0.13))>0.55?pebble(a,y,0.13,c,true):-1;if(big>=0)return big;const pc=pebble(a,y,0.032,c,true);if(pc>=0)return pc;f=0.88+0.18*nz(a*50,y*50);return scl(hx('#8b8478'),f);}
  case 'loess':{f=0.93+0.1*nz(a*30,y*30);if(fr(a/0.13+0.2*nz(a*3,y*3))<0.02)f*=0.8;break;}
  case 'soil':{f=0.78+0.34*nz(a*25,y*25);break;}
  case 'marble':{f=0.95+0.06*nz(a*20,y*20);if(Math.abs(Math.sin((a+y*0.7)*26+5*nz(a*3,y*3)))<0.06)return mix(c,hx('#8d9092'),0.6);break;}
  case 'plain':{f=0.95+0.08*nz(a*40,y*40);break;}
  default:{f=0.93+0.12*nz(a*35,y*35);}
 }
 return scl(c,f);
}
/* 地表材质（顶面贴图）：返回颜色 */
const TOPC={grass1:hx('#55702e'),grass2:hx('#83a04a'),rock1:hx('#7a756c'),rock2:hx('#a19a8e'),sand1:hx('#d3b77f'),sand2:hx('#ead6a5')};
function rockC(x,z){let c=mix(TOPC.rock1,TOPC.rock2,nz(x*20,z*20));if(nz(x*90+5,z*90)>0.82)c=scl(c,0.72);return c;}
function topCol(k,x,z,y,sl){
 if(typeof k==='number')return patTop(k,x,z);
 const n1=nz(x*11+3,z*11+7),n2=nz(x*48+37,z*48+11);
 switch(k){
  case 'grass':{let c=mix(TOPC.grass1,TOPC.grass2,n1*0.9+0.1*n2);c=scl(c,0.82+0.3*n2);if(spk(x*300,z*300)>0.97)c=scl(c,1.25);
   if(sl>0.75)c=mix(c,rockC(x,z),cl((sl-0.75)*1.6,0,1));return c;}
  case 'forest':{return scl(mix(hx('#3f5a25'),hx('#5b7a32'),n1),0.8+0.3*n2);}
  case 'marsh':{return scl(mix(hx('#6f7f3a'),hx('#8a9658'),n1),0.85+0.25*n2);}
  case 'rock':return rockC(x,z);
  case 'cliff':return scl(rockC(x,z),0.9);
  case 'sand':{let c=mix(TOPC.sand1,TOPC.sand2,n1);c=scl(c,0.93+0.1*n2+0.05*Math.sin(x*70+z*12+n1*8));return c;}
  case 'desert':{let c=mix(hx('#c9a56d'),hx('#e3c58f'),n1);return scl(c,0.92+0.12*n2+0.05*Math.sin(x*60+z*8+n1*6));}
  case 'snow':{return scl(mix(hx('#f3f6f8'),hx('#d6e3ec'),n2*0.8),0.98+0.04*n1);}
  case 'ice':{let c=mix(hx('#e2f0f7'),hx('#a9cfe3'),cl(n1*1.2-0.2,0,1));if(Math.abs(Math.sin(z*30+n1*6))<0.04)c=scl(c,0.8);return c;}
  case 'soil':return scl(mix(hx('#6e5238'),hx('#8b6b4a'),n1),0.85+0.25*n2);
  case 'mud':return scl(mix(hx('#5f6250'),hx('#7c7d66'),n1),0.9+0.2*n2);
  case 'silt':return scl(mix(hx('#b7a684'),hx('#cdbf9c'),n1),0.92+0.12*n2);
  case 'gravel':{const pc=pebble(x,z,0.05,0,false);return pc>=0?pc:scl(TOPC.sand1,0.85+0.2*n2);}
  case 'scree':{const pc=pebble(x,z,0.06,0,true);return pc>=0?pc:scl(hx('#7d776d'),0.85+0.2*n2);}
  case 'till':{const pc=hash2(Math.floor(x/0.14),Math.floor(z/0.14))>0.6?pebble(x,z,0.14,0,true):pebble(x,z,0.04,0,true);return pc>=0?pc:scl(hx('#8b8478'),0.85+0.2*n2);}
  case 'water':{let c=mix(hx('#24597e'),hx('#3f88b5'),n1);if(spk(x*200,z*200)>0.985)c=hx('#cfe6f2');return c;}
  case 'lake':{return mix(hx('#24636f'),hx('#3c8590'),n1);}
  case 'lava':{return mix(hx('#ffb12e'),hx('#a31d0b'),cl(n1*1.5-0.2,0,1));}

  return t=>b.userData.update(t);}

M({id:'rift',cat:'内',sub:'板块运动',name:'大陆裂谷',dur:12,cam:[2.4,2.3,5.2],
 pr:'大陆内部受张力作用，岩层沿正断层发生断裂，中间岩块相对下沉形成地堑（裂谷），两侧相对抬升。地下软流层上涌，常伴随火山活动；裂谷继续张裂，可积水成湖，最终可能被海水侵入，演化为新的海洋。',

 kd:'对应考点：东非大裂谷、红海——板块生长边界的初期；地堑（谷地）与地垒（山地）。',
 lg:[[P.SS,'砂岩'],[P.SH,'页岩'],[P.LS,'石灰岩'],[P.GRD,'基底岩石'],[P.AST,'软流层'],[P.MAG,'岩浆']],

 build(S){

    const o=off(x,y,t);const yy=y-o;if(yy< -0.45)return P.GRD;

   top:(x,z,y,t)=>volc(x,z,t)>0.06?'cinder':'grass'});
  S.add(b);

  const zf=1.25;S.add(Arrow([-1.4,0.0,zf],[-2.25,0.0,zf],0x2f6f9f),Arrow([1.4,0.0,zf],[2.25,0.0,zf],0x2f6f9f));
  Label('张裂',[-1.85,0.25,zf],{size:.12,color:'#2f6f9f'});Label('张裂',[1.85,0.25,zf],{size:.12,color:'#2f6f9f'});
  const lb1=Label('地堑（裂谷）',[0,0.6,1.3],{size:.13});const lb2=Label('正断层',[0.85,-0.35,1.32],{size:.11,color:'#7a2a1a'});
  const lb3=Label('湖泊',[-0.15,0.2,0.2],{size:.12,color:'#2f6f9f'});const lb4=Label('火山',[0.25,0.95,-0.3],{size:.12,color:'#b5452f'});
  return t=>{b.userData.update(t);const d=dval(t);const lv=sm(0.72,0.95,t);
   lake.setLevel(top0-d-0.02,top0-d+0.15*lv);lb3.visible=lv>0.3;lb4.visible=t>0.75;lb1.visible=t>0.35;lb2.visible=t>0.25;};}
});
M({id:'subduct',cat:'内',sub:'板块运动',name:'俯冲作用（消亡边界）',dur:12,cam:[1.6,2.0,5.6],
 pr:'在消亡边界，密度较大的大洋板块沿汇聚边界俯冲到大陆板块之下，形成深海沟；俯冲板块在地下深处脱水，使上方地幔部分熔融，岩浆上升，在大陆一侧形成火山弧（岛弧或海岸山脉）。太平洋东西两岸是典型实例。',
 ob:['大洋板块“插入”大陆板块下方','俯冲处形成海沟','火山弧与海沟平行分布'],
 kd:'对应考点：板块消亡边界——海沟、岛弧、海岸山脉（如安第斯山脉、日本岛弧、马里亚纳海沟）。',
 lg:[[P.OCN,'大洋板块'],[P.CC,'大陆板块'],[P.MAN,'地幔'],[P.MAG,'岩浆']],
 st:[[0,'大洋板块向大陆板块移动'],[.25,'大洋板块密度大，俯冲到大陆板块之下'],[.5,'俯冲处形成深海沟'],[.7,'俯冲板块深处产生岩浆，上升形成火山弧']],
 build(S){
  const x0=-0.4;
  const slab=x=>x<x0?-0.25:-0.25-(x-x0)*0.55-0.18*sq(x-x0);
  const vh=t=>0.42*sm(0.68,1,t);
  const hf=(x,z,t)=>{let h=-0.25-0.3*G(x,x0,0.22);const c=-0.25+0.55*sm(x0,x0+0.8,x)+(x>x0+0.3?rough(x,z,0.08):0);h=Math.max(h,c);
   return h+vh(t)*G(x,1.25,0.2)*G(z,0,0.9);};
  const b=Block({W:5,L:2.4,D:1.8,ymax:0.85,h:hf,trees:60,
   col:(x,y,z,t)=>{const s=slab(x);const r=Math.max(0,sm(0.6,1,t));
    if(Math.abs(x-1.25)<0.05&&y>slab(1.25)&&y<slab(1.25)+(hf(1.25,0,t)-slab(1.25))*r)return P.MAG;
    if(sq((x-1.25)/0.3)+sq((y-slab(1.25)-0.12)/0.1)<1&&t>0.55)return P.MAG;
    if(y<=s&&y>s-0.3){const along=(x<x0?x:x0+(x-x0)*1.3)-t*1.4;return (Math.floor(along/0.3)%2+2)%2?P.OCN:P.OCR;}
    if(x>x0-0.2&&y>s&&y>-0.95)return y>-0.25?STRATA[((Math.floor((y+1)/0.12))%3+3)%3]:P.CC;
    return P.MAN;},
   top:(x,z,y,t)=>x<x0+0.1?P.OCN:(vh(t)*G(x,1.25,0.2)*G(z,0,0.9)>0.12?'cinder':(y>0.3?'rock':'grass'))});
  S.add(b);S.add(Water(-2.49,x0+0.42,-1.19,1.19,-0.56,0.06));
  const zf=1.24;S.add(Arrow([-2.2,-0.4,zf],[-1.1,-0.4,zf],0x2f6f9f),Arrow([2.3,-0.6,zf],[1.6,-0.6,zf],0x8a5a2b));
  Label('大洋板块',[-1.7,-0.1,1.3],{size:.13});Label('大陆板块',[1.9,-0.25,1.3],{size:.13});
  Label('海沟',[x0,-0.35,1.35],{size:.12});Label('俯冲带',[0.55,-1.05,1.35],{size:.11,color:'#7a2a1a'});
  const lv=Label('火山弧',[1.25,1.0,0],{size:.12,color:'#b5452f'});Label('海洋',[-1.8,0.25,0],{size:.12,color:'#2f6f9f'});
  return t=>{b.userData.update(t);lv.visible=t>0.75;};}
});

M({id:'thrust',cat:'内',sub:'地壳运动',name:'水平挤压：地层缩短抬升',dur:12,cam:[1.4,1.8,5.6],
 pr:'地层受到水平挤压，整体在水平方向缩短；岩层沿一系列逆断层错动，上盘沿断层面向上逆冲，岩块叠置使地面在垂直方向升高。之后地面遭受外力剥蚀，形成新的地形地貌。',
 ob:['两侧箭头相向：受挤压','红褐色线为逆断层，上盘（断层面上方岩块）相对上升','后期顶部被剥蚀削低'],
 kd:'对应考点：水平运动与垂直运动的联系——挤压使地壳缩短、增厚、抬升（如喜马拉雅山的形成）。',
 lg:[[P.SS,'砂岩'],[P.SH,'页岩'],[P.LS,'石灰岩'],[P.FAULT,'逆断层']],
 st:[[0,'水平岩层'],[.12,'受水平挤压，岩层沿逆断层错动'],[.4,'上盘不断逆冲，岩块叠置，地面升高'],[.72,'隆起部分遭受剥蚀，形成新的地貌']],
 build(S){
  const xs=[-1.2,0.0,1.2];const u=t=>0.22*sm(0.1,0.7,t);
  const k=(x,y)=>{let n=0;for(const xi of xs)if(x<xi+1.0*(y-0.1))n++;return n;};
  const E=t=>0.85-0.35*sm(0.72,1,t);
  const hf=(x,z,t)=>{const n=k(x,0.1+0.6*u(t));return Math.min(0.1+n*u(t),E(t)+0.03*wob(x*3,z*3))+rough(x,z,0.02);};
  const b=Block({W:4.6,L:2.2,D:1.0,ymax:1.0,h:hf,trees:50,
   col:(x,y,z,t)=>{const n=k(x,y);if(t>0.1)for(const xi of xs){if(Math.abs(x-(xi+1.0*(y-0.1)))<0.016)return P.FAULT;}
    const y0=y-n*u(t);return STRATA[((Math.floor((y0+1)/0.14))%6+6)%6];},top:()=>'grass'});
  S.add(b);
  S.add(Arrow([-3.1,-0.3,0],[-2.45,-0.3,0],0x8a5a2b),Arrow([3.1,-0.3,0],[2.45,-0.3,0],0x8a5a2b));
  Label('挤压',[-2.8,0,0],{size:.12});Label('挤压',[2.8,0,0],{size:.12});
  const l1=Label('逆断层',[0.35,-0.45,1.2],{size:.12,color:'#7a2a1a'});const l2=Label('上盘上升',[-0.7,0.95,1.15],{size:.12});
  return t=>{b.userData.update(t);l1.visible=t>0.12;l2.visible=t>0.35&&t<0.75;};}
});
M({id:'isostasy',cat:'内',sub:'地壳运动',name:'冰川地壳均衡',dur:14,cam:[1.2,1.8,6.0],
 pr:'冰盖生长时，不断增加的重量把地壳压入下方的地幔，地幔物质从坳陷区向两侧缓慢流动，使坳陷区附近的地壳抬升；冰盖消融后过程相反，原坳陷区逐渐回升，周边隆起区逐渐下沉。整个过程非常缓慢，可延续上万年。',
 ob:['冰盖越厚，地壳下沉越多','冰盖消融后，地壳回升“慢半拍”','地幔物质的流动方向随之反转'],
 kd:'对应考点：地壳的垂直运动；斯堪的纳维亚半岛、加拿大哈得孙湾地区至今仍在缓慢抬升。',
 lg:[[P.ICE,'冰盖'],[P.GRD,'地壳'],[P.MAN,'地幔']],
 st:[[0,'冰期开始，冰盖逐渐生长'],[.2,'冰盖加重，地壳被压入地幔，地幔物质向两侧流动'],[.5,'冰盖开始消融'],[.7,'冰盖消失后，坳陷区缓慢回升，周边隆起区下沉'],[.95,'地壳恢复均衡']],
 build(S){
  const I=t=>sm(0,0.42,t)*(1-sm(0.5,0.7,t));
  const Dp=t=>sm(0.08,0.5,t)*(1-sm(0.62,0.98,t));
  const ice=(x,t)=>0.8*I(t)*Math.sqrt(Math.max(0,1-sq(x/1.6)));
  const w=(x,t)=>-0.35*Dp(t)*G(x,0,1.5)+0.09*Dp(t)*G(Math.abs(x),2.2,0.45);
  const hf=(x,z,t)=>w(x,t)+ice(x,t)+rough(x,z,0.03);
  const b=Block({W:5,L:2,D:1.6,ymax:1.0,h:hf,trees:50,
   col:(x,y,z,t)=>{const ct=w(x,t);if(y>ct+0.02)return P.ICE;if(y>ct-0.55)return y>ct-0.18?P.GRD:P.GR;return P.MAN;},
   top:(x,z,y,t)=>ice(x,t)>0.02?'ice':'grass'});
  S.add(b);
  const zf=1.03;
  const outA=[Arrow([-0.4,-1.2,zf],[-1.6,-1.2,zf],0xffffff,0.03),Arrow([0.4,-1.2,zf],[1.6,-1.2,zf],0xffffff,0.03)];
  const inA=[Arrow([-1.6,-1.2,zf],[-0.4,-1.2,zf],0xffffff,0.03),Arrow([1.6,-1.2,zf],[0.4,-1.2,zf],0xffffff,0.03)];
  outA.concat(inA).forEach(a=>S.add(a));
  const lI=Label('冰盖',[0,1.0,0],{size:.13,color:'#2f6f9f'});Label('地壳',[-2.1,-0.25,1.1],{size:.12});Label('地幔',[-2.1,-1.25,1.1],{size:.12,color:'#a0521d'});
  const lD=Label('坳陷',[0,-0.75,1.1],{size:.12});const lU=Label('隆起',[2.2,0.3,1.1],{size:.12});const lF=Label('地幔物质流动',[0,-1.45,1.1],{size:.11,color:'#7a3b10'});
  return t=>{b.userData.update(t);const grow=t<0.55;outA.forEach(a=>a.visible=grow&&t>0.1);inA.forEach(a=>a.visible=!grow&&t<0.95);
   lI.visible=I(t)>0.2;lD.visible=Dp(t)>0.3;lU.visible=Dp(t)>0.3;lF.visible=t>0.1&&t<0.95;};}
});

M({id:'magma',cat:'内',sub:'岩浆活动',name:'岩浆侵入与喷出',dur:14,cam:[2.6,2.0,5.0],
 pr:'地下深处的岩浆在岩浆房中聚集，沿岩层裂隙上升：切穿岩层的板状侵入体叫岩脉，顺着层面侵入的叫岩床，使上覆岩层拱起的穹窿状侵入体叫岩盖；岩浆在地下冷凝形成侵入岩（如花岗岩），喷出地表冷凝形成喷出岩（如玄武岩），并形成火山。',
 ob:['岩脉“切穿”岩层，岩床“顺着”岩层','岩盖使上覆岩层向上拱起','喷出地表才形成火山和喷出岩'],
 kd:'对应考点：岩浆岩（侵入岩/喷出岩）的形成；侵入岩比被它切穿的岩层“新”。',
 lg:[[P.MAG,'岩浆'],[P.SS,'砂岩'],[P.SH,'页岩'],[P.LS,'石灰岩'],[P.VOL,'火山岩（喷出岩）']],
 st:[[0,'地下深处的岩浆房'],[.12,'岩浆沿裂隙上升，切穿岩层形成岩脉'],[.3,'岩浆顺层面侵入形成岩床'],[.48,'岩浆聚集使上覆岩层拱起，形成岩盖'],[.66,'岩浆喷出地表，形成火山']],
 build(S){
  const lac=t=>0.28*sm(0.48,0.62,t);
  const dome=(x,z,t)=>lac(t)*Math.max(0,1-(sq(x-0.3)+sq(z-1.3))/0.25);
  const vol=t=>0.6*sm(0.68,0.95,t);
  const cone=(x,z,t)=>{const r=Math.hypot(x-1.2,z-1.3);const H=vol(t);return H>0?Math.max(0,H*(1-r/(H*1.8+0.01))):0;};
  const hf=(x,z,t)=>dome(x,z,t)*0.6+cone(x,z,t)+rough(x,z,0.02);
  const b=Block({W:4.4,L:2.6,D:1.5,ymax:0.8,h:hf,trees:60,treeOk:(x,z)=>Math.hypot(x-1.2,z-1.3)>1.0,
   col:(x,y,z,t)=>{
    if(sq(x/1.1)+sq((y+1.25)/0.22)<1)return P.MAG;
    const p1=sm(0.12,0.3,t);if(Math.abs(x+0.9)<0.05&&y>-1.1&&y<-1.1+0.65*p1)return P.MAG;
    const p2=sm(0.3,0.45,t);if(y>-0.47&&y<-0.4&&x<-0.85&&x>-0.85-1.2*p2)return P.MAG;
    const p3=sm(0.42,0.5,t);if(Math.abs(x-0.3)<0.05&&Math.abs(z-1.3)<0.3&&y>-1.1&&y<-1.1+0.75*p3)return P.MAG;
    const d=dome(x,z,t);if(d>0&&y>-0.36&&y<-0.36+d)return P.MAG;
    const p4=sm(0.62,0.72,t);if(Math.abs(x-1.2)<0.05&&Math.abs(z-1.3)<0.3&&y>-1.1&&y<-1.1+(1.1+vol(t))*p4)return P.MAG;
    if(y>0.02&&cone(x,z,t)>0)return (Math.floor(y/0.08)%2)?P.VOL:P.VOL2;
    const yy=y-(y>-0.36?d*0.6:0);return STRATA[((Math.floor((yy+1.5)/0.15))%6+6)%6];},
   top:(x,z,y,t)=>{const c=cone(x,z,t);if(c>0.03)return Math.hypot(x-1.2,z-1.3)<0.12?'lava':'cinder';return 'grass';}});
  S.add(b);

function faultModel(kind){
 return function(S){
  const dip=0.577,xt=0.25,top0=0.3;
  const xf=y=>xt-(y-top0)*dip;          // 断层面：向 +x 倾斜，+x 一侧为上盘
  const dd=t=>0.34*sm(0.1,0.8,t);
  const sgn=kind==='normal'?-1:1;        // 正断层上盘下降，逆断层上盘上升
  const disp=t=>({dx:-sgn*0.5*dd(t),dy:sgn*0.866*dd(t)});
  const hw=(x,y)=>x>xf(y);
  const hf=(x,z,t)=>{const {dy}=disp(t);let h=top0+rough(x,z,0.025);
   if(x>xf(top0))h+=dy;
   if(kind==='reverse'){const ero=sm(0.75,1,t)*0.12*G(x,xt+0.15,0.35);h-=ero;}
   return h;};
  const b=Block({W:4.4,L:2.4,D:1.1,ymax:0.7,h:hf,trees:60,treeOk:(x)=>Math.abs(x-xt)>0.35,
   col:(x,y,z,t)=>{if(Math.abs(x-xf(y))<0.015)return P.FAULT;const {dx,dy}=disp(t);let X=x,Y=y;if(hw(x,y)){X=x-dx;Y=y-dy;}
    return STRATA[((Math.floor((Y+1.4)/0.14))%6+6)%6];},top:()=>'grass'});

 build(S){

 build(S){

  const pd=(x,z,t)=>{if(t!==pT){pT=t;for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++)PH[j*GX+i]=pd0(-1.8+3.6*i/(GX-1),-1.2+2.4*j/(GZ-1),t);}
   const i=cl(Math.round((x+1.8)/3.6*(GX-1)),0,GX-1),j=cl(Math.round((z+1.2)/2.4*(GZ-1)),0,GZ-1);return PH[j*GX+i];};

});

M({id:'vvalley',cat:'外',sub:'侵蚀作用',kind:'流水',name:'V形谷（下切与溯源侵蚀）',dur:14,cam:[3.0,2.6,4.4],

 ob:['河谷从前方（下游）向后方（源头）伸长：溯源侵蚀','河床不断变低：下切侵蚀','正面剖面上，河谷横断面呈“V”形'],

 build(S){

M({id:'oxbow',cat:'外',sub:'侵蚀作用',kind:'流水',name:'曲流与牛轭湖（裁弯取直）',dur:14,cam:[0.2,4.6,3.0],
 pr:'在平原上，河流凹岸侵蚀、凸岸堆积，河道越来越弯曲，形成曲流。弯曲加剧后，相邻河湾之间的“曲流颈”越来越窄；洪水时河水冲开曲流颈，河道“裁弯取直”，被废弃的弯曲河道两端淤塞，就形成了形如牛轭的湖泊——牛轭湖。',

 kd:'对应考点：河流侵蚀与堆积地貌——凹岸侵蚀、凸岸堆积；曲流与牛轭湖（长江荆江河段）。',
 lg:[[hx('#3f88b5'),'河流'],[hx('#2f7d8c'),'牛轭湖'],[hx('#e3cc95'),'边滩（凸岸堆积）']],
 st:[[0,'平原上的河流略有弯曲'],[.15,'凹岸侵蚀、凸岸堆积，河道越来越弯'],[.55,'曲流颈越来越窄'],[.65,'洪水冲开曲流颈，裁弯取直'],[.8,'废弃河道两端淤塞，形成牛轭湖']],
 build(S){
  const W=4.4,Lz=3;const wch=0.085;
  function path(om){const N=260,lam=1;const pts=[];let x=0,z=0;for(let i=0;i<=N;i++){const s=i/N*2*lam;const th=om*Math.sin(2*PI*s/lam);pts.push([x,z]);x+=Math.cos(th)*2*lam/N;z+=Math.sin(th)*2*lam/N;}
   const ex=pts[N][0],ez=pts[N][1];const ang=Math.atan2(ez,ex);const len=Math.hypot(ex,ez);const sc=3.7/len;
   return pts.map(([a,b])=>{const ca=Math.cos(-ang),sa=Math.sin(-ang);return [(a*ca-b*sa)*sc-1.85,(a*sa+b*ca)*sc];});}
  const frames=[];let cut=null;
  for(let f=0;f<=80;f++){const tt=f/80;const om=lerp(0.5,2.4,sm(0,0.62,tt));
   if(!cut){const Pt=path(om);let best=9,bi=0,bj=0;for(let i=20;i<Pt.length;i+=2)for(let j=i+40;j<Pt.length;j+=2){const d=Math.hypot(Pt[i][0]-Pt[j][0],Pt[i][1]-Pt[j][1]);if(d<best){best=d;bi=i;bj=j;}}
    if(best<wch*2.6){cut={f,P:Pt,i:bi,j:bj};}frames.push({P:Pt});}else frames.push(null);}
  const bg=document.createElement('canvas');let bgDone=false;
  const b=Block({W,L:Lz,D:0.3,ymax:0.1,h:()=>0,col:(x,y)=>y>-0.05?P.SOIL:P.SILT,static:true,trees:0,
   topDraw:(ctx,cw,ch,t)=>{const sx=cw/W,sz=ch/Lz;const tx=x=>(x+W/2)*sx,tz=z=>(z+Lz/2)*sz;
    if(!bgDone){bg.width=cw;bg.height=ch;const bc=bg.getContext('2d');const im=bc.createImageData(cw,ch);for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){const c=topCol('grass',-W/2+i/cw*W,-Lz/2+j/ch*Lz,0,0);const k=(j*cw+i)*4;im.data[k]=c>>16&255;im.data[k+1]=c>>8&255;im.data[k+2]=c&255;im.data[k+3]=255;}bc.putImageData(im,0,0);bgDone=true;}
    ctx.drawImage(bg,0,0);
    const fi=Math.round(t*80);let lake=null,curP;
    if(cut&&fi>=cut.f){const Pt=cut.P;const k=sm(cut.f/80,cut.f/80+0.15,t);curP=Pt.slice(0,cut.i+1).concat(Pt.slice(cut.j));lake=Pt.slice(cut.i+Math.round(6+10*k),cut.j-Math.round(6+10*k)+1);}
    else{curP=frames[Math.min(fi,frames.length-1)].P;}
    const stroke=(pts,w,col)=>{ctx.strokeStyle=col;ctx.lineWidth=w*sx;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(tx(p[0]),tz(p[1])):ctx.moveTo(tx(p[0]),tz(p[1])));ctx.stroke();};
    if(lake&&lake.length>2){stroke(lake,wch*2.8,'#7c8a52');stroke(lake,wch*1.8,'#2f7d8c');}
    stroke(curP,wch*3.4,'#d9c08a');stroke(curP,wch*2.6,'#e3cc95');stroke(curP,wch*2,'#3a7fae');stroke(curP,wch*1.2,'#2f6f9c');}});
  S.add(b);
  const lo=Label('牛轭湖',[0,0.4,0],{size:.14,color:'#2f7d8c'});Label('河流',[-1.9,0.3,-0.6],{size:.13,color:'#2f6f9f'});
  const lc=Label('裁弯取直',[0,0.4,0],{size:.12,color:'#b5452f'});
  if(cut){const Pt=cut.P;const mid=Pt.slice(cut.i,cut.j);let cx=0,cz=0;mid.forEach(p=>{cx+=p[0];cz+=p[1];});cx/=mid.length;cz/=mid.length;lo.position.set(cx,0.35,cz);
   lc.position.set((Pt[cut.i][0]+Pt[cut.j][0])/2,0.3,(Pt[cut.i][1]+Pt[cut.j][1])/2);}
  let last=-1;
  return t=>{if(Math.abs(t-last)>0.008||t===0||t===1){last=t;b.userData.update(t,true);}const on=cut&&t>=cut.f/80;lo.visible=on&&t>cut.f/80+0.08;lc.visible=on&&t<cut.f/80+0.12;};}
});
M({id:'mushroom',cat:'外',sub:'侵蚀作用',kind:'风力',name:'风蚀蘑菇（风蚀柱）',dur:14,cam:[2.8,1.4,4.2],
 pr:'风力侵蚀包括吹蚀和磨蚀：风携带的沙粒像砂纸一样打磨岩石。沙粒主要在近地面一两米内跳跃，所以岩石下部受到的磨蚀最强；加上下部岩层相对软弱，长期侵蚀后形成上大下小、形似蘑菇的风蚀蘑菇，进一步发展成风蚀柱。',

M({id:'uvalley',cat:'外',sub:'侵蚀作用',kind:'冰川',name:'U形谷（冰川谷）',dur:16,cam:[2.6,2.4,5.0],
 pr:'冰期时，冰川占据原来的河谷（V形谷）。冰川厚度大、重量大，对谷底和谷壁同时进行强烈的拔蚀和磨蚀，把谷底刨深、把谷壁削陡，使河谷由“V”形改造成谷底宽平、谷壁陡峭的“U”形。冰川消融后，U形谷显露出来，两侧山峰被刨蚀成尖锐的角峰。',
 ob:['冰川来之前：V形河谷','冰川充满河谷，谷底、谷壁同时被侵蚀','冰川消退后：谷底宽平、谷壁陡直的U形谷'],
 kd:'对应考点：冰川侵蚀地貌（U形谷、冰斗、角峰）；由谷地形态判断其主要外力作用。',
 lg:[[P.GRD,'基岩'],[P.ICE,'冰川']],
 st:[[0,'高山上的V形河谷'],[.15,'冰期到来，冰川充填河谷'],[.4,'冰川拔蚀、磨蚀谷底和谷壁'],[.75,'气候变暖，冰川消融退缩'],[.9,'显露出谷底宽平、谷壁陡峭的U形谷']],
 build(S){

  const hf=(x,z,t)=>mtn(x,z)-lerp(V(x),U(x),e(t));
  const iceS=t=>sm(0.1,0.28,t)*(1-sm(0.72,0.88,t));
  const iceTop=(x,z,t)=>{const s=iceS(t);if(s<=0)return -9;return hf(0,z,t)+0.55*s+0.05*Math.cos(x*2);};
  const b=Block({W:4.4,L:2.6,D:0.5,ymax:1.4,h:(x,z,t)=>Math.max(hf(x,z,t),Math.abs(x)<1.25?iceTop(x,z,t):-9),trees:60,treeOk:(x,z,y,t)=>y<0.85&&(iceTop(x,z,t)<hf(x,z,t)),
   col:(x,y,z,t)=>y>hf(x,z,t)?P.ICE:(Math.floor((y+1)/0.2)%2?P.GRD:P.GR),
   top:(x,z,y,t)=>{if(iceTop(x,z,t)>=hf(x,z,t)&&Math.abs(x)<1.25)return 'ice';if(y>1.05)return 'snow';if(y>0.8)return 'rock';return 'grass';}});
  S.add(b);
  const l=[Label('V形谷（河流侵蚀）',[0,0.55,1.4],{size:.12}),Label('冰川',[0,1.0,0],{size:.13,color:'#2f6f9f'}),Label('U形谷',[0,0.35,1.4],{size:.13,color:'#7a2a1a'}),Label('角峰',[-1.6,1.45,0],{size:.11})];
  return t=>{b.userData.update(t);l[0].visible=t<0.2;l[1].visible=iceS(t)>0.5;l[2].visible=t>0.85;l[3].visible=t>0.85;};}
});
/* ---------- 外力 · 搬运作用 ---------- */
function transportModel(water){
 return function(S){
  const W=5,Lz=2;
  const bed=water?(x,z)=>-0.4+0.32*sq(z/1.0):(x,z)=>0.02*Math.sin(x*9+z*2);
  const b=Block({W,L:Lz,D:0.4,ymax:0.3,h:(x,z)=>bed(x,z)+rough(x,z,0.01),static:true,col:()=>water?P.GRV:P.SAND,top:()=>water?'gravel':'desert'});S.add(b);
  const top=water?0.05:2;
  if(water)S.add(Water(-2.49,2.49,-0.99,0.99,-0.4,top,0x4a7f8c,.45));
  const R=rng(water?5:9);const big=[],mid=[],fine=[];
  for(let i=0;i<7;i++)big.push({x:R()*5,z:-0.5+R()*1,r:0.06+R()*0.02});
  for(let i=0;i<16;i++)mid.push({x:R()*5,z:-0.6+R()*1.2,o:R(),r:0.03});
  for(let i=0;i<70;i++)fine.push({x:R()*5,z:-0.8+R()*1.6,y:water?-0.15+R()*0.17:0.4+R()*1.2,o:R()*6,r:0.012});
  const gB=Grains(big.length,0x7a6a5a),gM=Grains(mid.length,0xc08a4a),gF=Grains(fine.length,water?0x8a7550:0xc9b089);S.add(gB,gM,gF);
  const wrap=x=>((x%5)+5)%5-2.5;
  const lab=water?['悬移','跃移','推移（滚动、滑动）']:['悬移','跃移','蠕移（滚动、滑动）'];
  const ly=water?[-0.05,-0.22,-0.32]:[1.2,0.45,0.15];
  Label(lab[0],[-2.85,ly[0],0.8],{size:.11});Label(lab[1],[-2.85,ly[1],0.8],{size:.11});Label(lab[2],[-2.95,ly[2],0.8],{size:.11});
  S.add(Arrow([-1.2,water?0.25:1.9,0],[0.4,water?0.25:1.9,0],0x2f6f9f));Label(water?'水流方向':'风向',[-0.4,water?0.45:2.1,0],{size:.12,color:'#2f6f9f'});
  return (t,time)=>{
   big.forEach((p,i)=>{const x=wrap(p.x+0.12*time*(water?1:0.8));gB.put(i,x,bed(x,p.z)+p.r,p.z,p.r,0.85,0,time*2/p.r*0.1);});
   mid.forEach((p,i)=>{const ph=time+p.o;const f=ph%1;const x=wrap(p.x+0.55*ph);const hh=water?0.16:0.4;const y=bed(x,p.z)+p.r+hh*Math.sin(PI*Math.pow(f,0.75));gM.put(i,x,y,p.z,p.r);});
   fine.forEach((p,i)=>{const x=wrap(p.x+(water?0.9:1.4)*time);let y=p.y+(water?0.04:0.12)*Math.sin(time*1.7+p.o);if(water)y=Math.max(y,bed(x,p.z)+0.03);gF.put(i,x,y,p.z,p.r);});
   gB.done();gM.done();gF.done();};
 };
}
M({id:'windtr',cat:'外',sub:'搬运作用',kind:'风力',name:'风力搬运',loop:true,cam:[0.4,1.6,5.2],
 pr:'风力搬运有三种方式：粒径较大的沙粒在风的牵引下沿地面滑动或滚动（蠕移）；粒径较小的沙粒以跳跃方式前进（跃移），是风力搬运最主要的形式；细而轻的颗粒被风吹扬，悬浮在气流中移动（悬移），搬运距离最远。',

 kd:'对应考点：风力搬运与沉积的分选性——颗粒大的先沉积，细小的被搬得远（黄土高原的黄土来自西北）。',

 kd:'对应考点：流速与搬运能力；流速减慢时按颗粒大小依次沉积（冲积扇、三角洲的分选性）。',

M({id:'fan',cat:'外',sub:'堆积作用',kind:'流水',name:'冲积扇',dur:14,cam:[1.2,2.8,5.0],
 pr:'山区河流流出山口后，地势突然变得平缓、河道变宽，流速骤减，携带的大量泥沙在山前堆积，形成以山口为顶点、向外展开的扇形堆积体——冲积扇。颗粒有分选：扇顶以砾石等粗颗粒为主，向扇缘颗粒逐渐变细。',
 ob:['以山口为顶点，向平原呈扇形展开','扇顶粗（砾石）、扇缘细（沙、粉沙）','左侧剖面：沉积物由山口向外由粗变细'],
 kd:'对应考点：冲积扇的形成条件与分选性；冲积扇是山前重要的农业区和聚落分布区（如河西走廊绿洲）。',
 lg:[[P.GRV,'砾石'],[P.SAND,'沙'],[P.SILT,'粉沙'],[P.GRD,'基岩']],
 st:[[0,'山区河流流出山口'],[.15,'地势变缓、流速骤减，泥沙堆积'],[.45,'河道不断摆动，堆积体向外扩展成扇形'],[.8,'扇顶粗、扇缘细，形成冲积扇']],
 build(S){
  const ax=-2.2,az=-0.55;const Rr=t=>0.35+2.2*sm(0.05,0.95,t);const Hf=t=>0.45*sm(0.05,0.95,t);
  const mtn=(x,z)=>z<az?0.25+1.1*sm(az,az-0.6,z)*(0.8+0.4*nz(x*2.5,z*2.5))-0.6*G(x,ax+0.15,0.22)*sm(az-0.9,az,z):0;
  const fan=(x,z,t)=>{if(z<az-0.05)return 0;const r=Math.hypot(x-ax,(z-az)*1.0);return Math.max(0,Hf(t)*(1-r/Rr(t)));};
  const plain=(x,z)=>0.02+rough(x,z,0.02);
  const hf=(x,z,t)=>Math.max(plain(x,z)+fan(x,z,t),mtn(x,z));
  const grade=r=>r<0.9?P.GRV:(r<1.7?P.SAND:P.SILT);
  const ch=(x,z,t)=>{if(fan(x,z,t)<0.01)return false;const a=Math.atan2(z-az,x-ax);const r=Math.hypot(x-ax,z-az);const k=Math.floor(t*6);for(let i=0;i<3;i++){const c=0.25+0.45*fr(0.37*(k+i*2.3));if(Math.abs(a-c)*r<0.03+0.01*r)return true;}return false;};
  const b=Block({W:4.4,L:2.6,D:0.5,ymax:1.4,h:hf,trees:60,treeOk:(x,z,y,t)=>fan(x,z,t)<0.02||Math.hypot(x-ax,z-az)>1.8,
   col:(x,y,z,t)=>{const m=mtn(x,z);if(m>plain(x,z)+fan(x,z,t)&&y>0)return P.GRD;if(y<0)return P.GRD;const r=Math.hypot(x-ax,z-az);
    if(y>plain(x,z)-0.01)return grade(r+0.25*(y/(Hf(t)+0.01)));return P.SILT;},
   top:(x,z,y,t)=>{if(mtn(x,z)>plain(x,z)+fan(x,z,t))return y>1.0?'rock':'grass';if(ch(x,z,t))return 'water';const f=fan(x,z,t);if(f>0.01){const r=Math.hypot(x-ax,z-az);return r<0.9?'gravel':(r<1.7?'sand':'silt');}return 'grass';}});
  S.add(b);
  const l=[Label('山口（扇顶）',[ax+0.3,0.7,az],{size:.11}),Label('扇顶：砾石（粗）',[ax+0.7,0.55,0.2],{size:.11}),Label('扇缘：沙、粉沙（细）',[0.3,0.25,0.9],{size:.11}),Label('剖面：由粗变细',[-2.3,0.1,0.6],{size:.11,color:'#7a2a1a'})];
  return t=>{b.userData.update(t);l[1].visible=t>0.4;l[2].visible=t>0.6;l[3].visible=t>0.6;};}
});
M({id:'delta',cat:'外',sub:'堆积作用',kind:'流水',name:'河口三角洲',dur:14,cam:[0.8,3.0,4.6],
 pr:'河流入海（湖）时，河口处水面展宽、流速减慢，又受到海水顶托，携带的泥沙在河口大量堆积，形成平面形态近似三角形的冲积平原——三角洲。河流在三角洲上分成许多汊道，三角洲不断向海洋方向推进，海岸线外移。',
 ob:['河流把泥沙源源不断地带到河口','三角洲向海洋方向延伸，海岸线外移','三角洲上河道分汊，地势低平'],
 kd:'对应考点：三角洲的形成条件（泥沙多、海水作用弱、河口坡度缓）；长江三角洲、珠江三角洲、尼罗河三角洲。',
 lg:[[P.SAND,'三角洲沙'],[P.MUD,'淤泥'],[P.SILT,'粉沙']],
 st:[[0,'河流携带大量泥沙流入海洋'],[.15,'河口流速降低，泥沙开始堆积'],[.45,'泥沙不断堆积，三角洲向海推进，河道分汊'],[.8,'形成低平的三角洲平原']],
 build(S){
  const D=t=>1.6*sm(0.05,0.95,t);
  const shore=(x,t)=>0.0+D(t)*Math.exp(-sq(x/1.15))*(1+0.18*Math.sin(x*4.5+1));
  const hf=(x,z,t)=>{const s=shore(x,t)-0.3;if(z<s)return 0.06-0.04*sm(-1.3,s,z)+rough(x,z,0.012)+0.05*sm(-0.3,-1.3,z);const d=z-s;return Math.max(0.06-d*0.55,-0.45)+rough(x,z,0.01);};
  const chan=(x,z,t)=>{const s=shore(x,t)-0.3;if(z>s+0.02)return false;if(z<-0.3)return Math.abs(x-0.1*Math.sin(z*2))<0.07;const f=(z+0.3)/Math.max(0.1,s+0.3);
   for(const k of [-0.9,-0.35,0.25,0.8]){const cx=0.1*Math.sin(-0.6)+k*f*D(t)*0.55+0.05*Math.sin(z*6+k*3);if(Math.abs(x-cx)<0.04)return true;}return false;};
  const b=Block({W:4.4,L:2.8,D:0.6,ymax:0.3,h:hf,trees:50,treeOk:(x,z)=>z<-0.9,
   col:(x,y,z,t)=>{if(y<-0.45)return P.SH;const s=shore(x,t)-0.3;const k=Math.floor((y+0.5)/0.05);return z<s-0.2?(k%2?P.SAND:P.SILT):(k%2?P.MUD:P.SILT);},
   top:(x,z,y,t)=>{if(chan(x,z,t))return 'water';if(y>0.04)return z<-0.9?'grass':'marsh';if(y>-0.02)return 'sand';return 'mud';}});
  S.add(b);S.add(Water(-2.19,2.19,-1.39,1.39,-0.46,0.035,0x2c6f8f,.6));
  const l=[Label('河流',[0.15,0.35,-1.2],{size:.12,color:'#2f6f9f'}),Label('三角洲（向海推进）',[0,0.35,0.6],{size:.12}),Label('海洋',[1.6,0.25,1.1],{size:.12,color:'#2f6f9f'})];
  return t=>{b.userData.update(t);l[1].visible=t>0.4;l[1].position.z=shore(0,t)-0.6;};}
});
M({id:'dune',cat:'外',sub:'堆积作用',kind:'风力',name:'新月形沙丘',dur:14,cam:[3.4,2.6,3.8],
 pr:'风力减弱或遇到障碍时，沙粒堆积形成沙丘。在风向稳定、沙源不太丰富的地区，形成平面呈新月形的沙丘：迎风坡缓而凸，背风坡陡而凹，两个尖角（沙丘翼）指向下风向。沙粒不断从迎风坡吹向背风坡，沙丘整体向下风向移动。',
 ob:['迎风坡缓、背风坡陡','两个尖角指向下风向','沙丘整体顺风移动；剖面上可见倾向下风向的斜层理'],
 kd:'对应考点：由沙丘形态判断风向（缓坡为迎风坡，尖角指向下风向）；风沙防治。',
 lg:[[P.SAND,'风成沙']],

 build(S){

   const uc=-0.15*s+0.5*s*q*q;const H=0.34*s*(1-q*q);const uw=uc-0.95*s*Math.sqrt(1-q*q)-0.05;if(u<uw)return 0;

  PAT[scl(P.SAND,0.86)|0]='sand';
  const b=Block({W:4.4,L:2.6,D:0.35,ymax:0.5,h:hf,

  S.add(b);
  const N=60;const gr=Grains(N,0xcfa96a);S.add(gr);const R=rng(12);const pp=[];for(let i=0;i<N;i++)pp.push({o:R(),d:dunes[i%2],v:(R()-0.5)*0.9});
  S.add(Arrow([-2.6,1.0,0],[-1.8,1.0,0],0x2f6f9f));Label('风向',[-2.2,1.18,0],{size:.12,color:'#2f6f9f'});

  return (t,time)=>{b.userData.update(t);
   for(let i=0;i<N;i++){const p=pp[i];const d=p.d;const f=(time*0.5+p.o)%1;const cx=d.x+0.9*t/d.s*0.6;const x=cx-0.9*d.s+1.1*d.s*f;const z=d.z+p.v*d.s*0.5;gr.put(i,x,hf(x,z,t)+0.02+0.05*Math.sin(f*PI*6)**2,z,0.012);}gr.done();

M({id:'moraine',cat:'外',sub:'堆积作用',kind:'冰川',name:'冰碛物与终碛垄',dur:16,cam:[3.0,2.6,4.6],
 pr:'冰川在运动速率降低或消融时，携带的各种碎屑物就会沉积下来，形成冰碛物。冰碛物的特点是：大小混杂（巨大的漂砾和细小的泥沙混在一起），没有磨圆（岩块有棱有角），无分选、无层理。冰川末端在某一时期保持稳定时，碎屑在末端堆积成弧形的终碛垄；冰川退缩过程中每个稳定期都会形成一道终碛垄。',
 ob:['看碛垄上的石块：大的大、小的小，混杂在一起','石块都有棱有角，没有被磨圆','冰川退缩时留下一道道弧形的终碛垄'],
 kd:'对应考点：冰川堆积物“大小混杂、无磨圆、无分选、无层理”，与流水沉积物（分选好、磨圆好、有层理）区别。',
 lg:[[P.ICE,'冰川'],[P.TILL,'冰碛物（大小混杂、有棱角）'],[P.BED,'基岩']],
 st:[[0,'冰川末端保持稳定，碎屑堆积成终碛垄'],[.25,'气候变暖，冰川末端退缩'],[.4,'新的稳定期，形成第二道终碛垄'],[.6,'继续退缩……'],[.72,'第三道终碛垄'],[.9,'冰川大幅退缩，留下多道终碛垄']],
 build(S){
  const X=t=>t<.25?1.7:t<.4?lerp(1.7,0.6,sm(.25,.4,t)):t<.6?0.6:t<.72?lerp(0.6,-0.5,sm(.6,.72,t)):t<.9?-0.5:lerp(-0.5,-1.6,sm(.9,1,t));
  const mor=[{x:1.7,a:0,b:.25},{x:0.6,a:.4,b:.6},{x:-0.5,a:.72,b:.9}];
  const xt=(xx,z)=>xx-0.35*sq(z/1.3);
  const gnd=(x,z)=>0.05-0.06*x+rough(x,z,0.04);
  const mh=(x,z,t)=>mor.reduce((s,m)=>s+0.24*sm(m.a,m.b,t)*G(x,xt(m.x,z)+0.1,0.13)*(0.8+0.4*wob(x*5,z*5)),0);
  const ice=(x,z,t)=>{const e=xt(X(t),z);if(x>e)return 0;return 0.75*Math.sqrt(Math.min(1,(e-x)/1.6));};
  const hf=(x,z,t)=>gnd(x,z)+mh(x,z,t)+ice(x,z,t);
  const b=Block({W:5,L:2.6,D:0.5,ymax:1.0,nx:120,h:hf,trees:60,treeOk:(x,z,y,t)=>ice(x,z,t)<=0&&mh(x,z,t)<0.03&&x>X(t)+0.4,
   col:(x,y,z,t)=>{const g=gnd(x,z);if(y<g-0.15)return P.BED;if(y<g)return P.SOIL;const m=g+mh(x,z,t);if(y<m)return P.TILL;return P.ICE;},
   top:(x,z,y,t)=>{if(ice(x,z,t)>0.01)return 'ice';if(mh(x,z,t)>0.03)return 'till';return 'grass';}});
  S.add(b);
  const NB=130;const bo=Grains(NB,0x8a857c,true);S.add(bo);const R=rng(21);const bb=[];
  for(let i=0;i<NB;i++){const m=mor[i%3];const z=-1.25+R()*2.5;const sz=R()<0.15?0.06+R()*0.07:0.012+R()*0.03;bb.push({m,z,dx:(R()-0.5)*0.22,s:sz,rx:R()*6,ry:R()*6,c:[0x8a857c,0x6f6a63,0xa29a8c,0x7d7468][i%4]});bo.col(i,bb[i].c);}
  const N=40;const gr=Grains(N,0x6f6c66,true);S.add(gr);const pp=[];for(let i=0;i<N;i++)pp.push({o:R(),z:-1+R()*2,h:R(),s:0.015+R()*0.025});
  const ml=mor.map(m=>Label('终碛垄',[m.x+0.1,0.5,1.35],{size:.11}));
  const lk=Label('冰碛物：大小混杂、没有磨圆',[0.6,0.85,0.4],{size:.12,color:'#7a2a1a'});
  Label('冰川',[-1.6,1.1,0],{size:.13,color:'#2f6f9f'});S.add(Arrow([-2.2,1.0,-0.6],[-1.2,0.9,-0.6],0x2f6f9f,0.025));
  const lr=Label('末端退缩',[0,1.0,0],{size:.11,color:'#b5452f'});
  return (t,time)=>{b.userData.update(t);const xe=X(t);
   bb.forEach((p,i)=>{const k=sm(p.m.a,p.m.b,t);const x=xt(p.m.x,p.z)+0.1+p.dx;if(k>0.3&&ice(x,p.z,t)<=0)bo.put(i,x,hf(x,p.z,t)+p.s*0.35,p.z,p.s,0.75,p.rx,p.ry);else bo.put(i,0,-9,0,0.001);});bo.done();
   for(let i=0;i<N;i++){const p=pp[i];const f=(time*0.15+p.o)%1;const e=xt(xe,p.z);const x=lerp(-2.4,e,f);
    if(x<e-0.02&&e>-2.4)gr.put(i,x,gnd(x,p.z)+ice(x,p.z,t)*p.h*0.8+0.02,p.z,p.s,1,i,i);else gr.put(i,0,-9,0,0.001);}gr.done();
   mor.forEach((m,i)=>ml[i].visible=t>m.a+0.08);lk.visible=t>0.45;lr.visible=(t>.25&&t<.4)||(t>.6&&t<.72)||t>.9;lr.position.set(xe+0.2,1.0,0);};}
});
M({id:'tillcmp',cat:'外',sub:'堆积作用',kind:'冰川',name:'冰碛物与流水沉积物对比',dur:10,cam:[0,1.5,3.6],

 ob:['左：冰碛物——大小混杂、棱角分明、杂乱堆积','右：流水沉积物——磨圆、按大小分层（下粗上细）','这是判断沉积物成因最常考的依据'],

 build(S){

  Label('流水沉积物\n磨圆好 · 分选好\n有层理（下粗上细）',[0.9,1.35,0],{size:.11,color:'#2f5f8f'});

   Bs.forEach((p,i)=>{const t0=0.3+p.li*0.13;const f=sm(t0,t0+0.12,t);gb.put(i,p.x,f>0?lerp(1.2,p.y,f):-9,p.z,p.s,0.85);});gb.done();};}

M({id:'barrier',cat:'外',sub:'堆积作用',kind:'海浪',name:'障壁岛的迁移',dur:14,cam:[1.2,1.8,5.4],
 pr:'障壁岛是与海岸大致平行、由沙堆积成的狭长岛屿，岛后是潟湖。海平面上升时，波浪和风暴把靠海一侧的沙不断越过岛顶推向潟湖一侧（越流沉积），于是障壁岛整体向陆地方向迁移——这就是海平面上升时障壁岛并没有被淹没消失的原因。',
 ob:['海平面在缓慢上升','沙粒从海侧越过岛顶落到潟湖一侧','障壁岛整体向陆地移动，潟湖随之后退'],
 kd:'拓展理解：海岸堆积地貌（沙坝、潟湖）；全球变暖海平面上升对海岸的影响。',
 lg:[[P.SAND,'障壁岛沙体'],[P.MUD,'潟湖泥'],[P.GRD,'下伏岩层']],
 st:[[0,'障壁岛与岛后潟湖'],[.15,'海平面上升，波浪把沙推过岛顶'],[.45,'越流沉积在潟湖一侧堆积'],[.7,'障壁岛整体向陆地迁移而没有被淹没']],
 build(S){
  const bse=x=>-0.6+0.2*(x+2.5);
  const SL=t=>-0.05+0.32*t;const xb=t=>-1.2+1.4*t;
  const isl=(x,t)=>{const d=(x-xb(t))/0.5;if(Math.abs(d)>=1)return -9;return SL(t)+0.16*(1-d*d)-(d<0?0.08*d*d:0);};
  const hf=(x,z,t)=>{let h=bse(x)+rough(x,z,0.01);if(x>xb(t))h+=0.05;return Math.max(h,isl(x,t)+rough(x,z,0.012));};
  const b=Block({W:5,L:2,D:0.8,ymax:0.6,h:hf,trees:30,treeOk:(x,z,y,t)=>y>SL(t)+0.08&&x>1.0,
   col:(x,y,z,t)=>{const bs=bse(x);if(y<bs)return P.GRD;if(y<isl(x,t))return P.SAND;if(x>xb(t)&&y<bs+0.05)return P.MUD;return P.SAND;},
   top:(x,z,y,t)=>isl(x,t)>bse(x)?'sand':(y>SL(t)+0.02?'grass':'mud')});
  S.add(b);
  const w=Water(-2.49,2.49,-0.99,0.99,-0.6,0,0x2c6f8f,.55);S.add(w);
  const N=24;const gr=Grains(N,0xd9b55a);S.add(gr);const R=rng(4);const pp=[];for(let i=0;i<N;i++)pp.push({o:R(),z:-0.9+R()*1.8});
  const li=Label('障壁岛',[0,0.6,0],{size:.13});const lg=Label('潟湖',[0,0.4,0],{size:.12,color:'#2f6f9f'});Label('海洋',[-2.0,0.45,0],{size:.12,color:'#2f6f9f'});Label('陆地',[2.1,0.6,0],{size:.12});
  const ar=Arrow([0,0,0],[0.6,0,0],0xb5452f,0.03);S.add(ar);const la=Label('向陆迁移',[0,0,0],{size:.11,color:'#b5452f'});
  S.add(Arrow([-2.3,-0.2,1.05],[-2.3,0.2,1.05],0x2f6f9f,0.025));Label('海平面上升',[-2.0,0.32,1.1],{size:.1,color:'#2f6f9f'});
  return (t,time)=>{b.userData.update(t);w.setLevel(-0.6,SL(t));const x=xb(t);
   li.position.set(x,SL(t)+0.45,0);const shore=(SL(t)+0.6)/0.2-2.5;lg.position.set((x+shore)/2+0.2,SL(t)+0.15,0);
   ar.position.set(x+0.2,SL(t)+0.62,0.6);la.position.set(x+0.45,SL(t)+0.8,0.6);
   for(let i=0;i<N;i++){const p=pp[i];const f=(time*0.5+p.o)%1;const xx=x-0.5+0.95*f;gr.put(i,xx,Math.max(isl(xx,t),bse(xx)+0.05,SL(t)-0.05)+0.03,p.z,0.02);}gr.done();};}
});

/* ---------- 外力 · 固结成岩 ---------- */
function seqModel(trans){
 return function(S){
  const N=44,dh=0.012;const bse=x=>-0.45+0.2*(x+2.2);
  const SLk=k=>trans?lerp(-0.3,0.35,k/N):lerp(0.35,-0.3,k/N);const xs=k=>-2.2+(SLk(k)+0.45)/0.2;
  const fac=(x,k)=>{const d=xs(k)-x;return d<0.55?P.SAND:d<1.3?P.MUD:P.LS;};
  const NX=220;const cum=[];for(let i=0;i<=NX;i++){const x=-2.2+4.4*i/NX;const a=[0];for(let k=0;k<N;k++)a.push(a[k]+(x<xs(k)?dh:0));cum.push(a);}
  const ii=x=>cl(Math.round((x+2.2)/4.4*NX),0,NX);
  const kn=t=>Math.floor(cl(t,0,1)*N);
  const hf=(x,z,t)=>bse(x)+cum[ii(x)][kn(t)]+rough(x,z,0.006);
  const b=Block({W:4.4,L:2.2,D:0.6,ymax:0.6,h:hf,trees:30,treeOk:(x,z,y,t)=>y>SLk(kn(t))+0.05,
   col:(x,y,z,t)=>{const bs=bse(x);if(y<bs)return P.GRD;
    const a=cum[ii(x)];const K=kn(t);const r=y-bs;for(let k=0;k<K;k++)if(a[k+1]>r&&a[k+1]>a[k])return fac(x,k);return fac(x,Math.max(0,K-1));},
   top:(x,z,y,t)=>{const K=kn(t);if(y>SLk(K)+0.005)return 'grass';const f=fac(x,K);return f===P.SAND?'sand':(f===P.MUD?'mud':P.LS);}});
  S.add(b);
  const w=Water(-2.19,2.19,-1.09,1.09,-0.6,0,0x2c6f8f,.45);S.add(w);
  S.add(Arrow([1.9,trans?-0.1:0.3,1.2],[1.9,trans?0.3:-0.1,1.2],0x2f6f9f,0.03));Label(trans?'海平面上升':'海平面下降',[1.6,0.48,1.2],{size:.11,color:'#2f6f9f'});
  const lv=Label(trans?'自下而上：砂岩→泥岩→石灰岩':'自下而上：石灰岩→泥岩→砂岩',[-1.0,0.75,1.2],{size:.11,color:'#b5452f'});
  const cx=-0.9;const col=Line([[cx,-0.3,1.12],[cx,0.42,1.12]],0xb5452f,true);S.add(col);
  return t=>{b.userData.update(t);w.setLevel(-0.6,SLk(kn(t)));lv.visible=col.visible=t>0.9;};
 };
}

 lg:[[P.SAND,'砂 → 砂岩'],[P.MUD,'泥 → 泥岩'],[P.LS,'灰泥 → 石灰岩'],[P.GRD,'基底']],

M({id:'lithify',cat:'外',sub:'固结成岩',name:'压实与胶结（固结成岩）',dur:14,cam:[1.6,1.4,3.2],
 pr:'松散沉积物层层堆积，下部沉积物受上覆沉积物的重压，颗粒靠紧、孔隙变小，孔隙水被挤出（压实作用）；孔隙水中溶解的物质（如碳酸钙、二氧化硅）在颗粒之间沉淀，把颗粒粘结在一起（胶结作用）。压实和胶结使松散沉积物变成坚硬的沉积岩。',
 ob:['沉积物一层层堆积，下层老、上层新（层理）','压实：颗粒间距变小，整体变薄，孔隙水被挤出','胶结：颗粒间的空隙被胶结物填充'],
 kd:'对应考点：沉积岩的形成过程（风化、侵蚀、搬运、堆积、固结成岩）；层理构造与化石。',
 lg:[[P.SAND,'砂粒'],[P.MUD,'泥质颗粒'],[hx('#d9c39a'),'胶结物']],
 st:[[0,'松散沉积物一层层堆积'],[.5,'压实作用：颗粒靠紧，孔隙水被挤出'],[.8,'胶结作用：胶结物把颗粒粘结在一起'],[.97,'形成坚硬的沉积岩']],
 build(S){
  const n=7,layers=5,sp=0.15,r=0.065;const cols=[P.SAND,P.MUD,P.SAND,hx('#c9a26b'),P.MUD];
  const R=rng(8);const Pp=[];for(let l=0;l<layers;l++)for(let i=0;i<n;i++)for(let j=0;j<n;j++)Pp.push({l,x:-0.45+i*sp+(R()-0.5)*0.03,z:-0.45+j*sp+(R()-0.5)*0.03,y:r+l*sp*0.95+(R()-0.5)*0.02,d:R()*0.1});
  const gr=Grains(Pp.length);Pp.forEach((p,i)=>gr.col(i,scl(cols[p.l],0.85+0.3*R())));S.add(gr);
  const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.1,1.2,1.1)),new THREE.LineBasicMaterial({color:0x445566}));box.position.y=0.6;S.add(box);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,1.1),stdMat({color:lin(0xdfe9ef),transparent:true,opacity:.1,depthWrite:false}));glass.position.y=0.6;S.add(glass);
  const fl=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.04,1.4),stdMat({color:lin(0x8b7d6b)}));fl.position.y=-0.02;fl.receiveShadow=true;S.add(fl);
  const water=new THREE.Mesh(new THREE.BoxGeometry(1.08,1,1.08),stdMat({color:lin(C.water),transparent:true,opacity:.28,roughness:.1,depthWrite:false}));water.renderOrder=3;S.add(water);
  const cem=new THREE.Mesh(new THREE.BoxGeometry(1.08,1,1.08),stdMat({color:lin(0xd9c39a),transparent:true,opacity:0,depthWrite:false}));cem.renderOrder=4;S.add(cem);
  const drops=Grains(14,0x3f8fc4);S.add(drops);
  const ld=Label('压实作用',[1.0,0.9,0.4],{size:.11});const lc=Label('胶结作用',[1.0,0.7,0.4],{size:.11});const lw=Label('孔隙水被挤出',[0,1.45,0],{size:.11,color:'#2f6f9f'});
  return (t,time)=>{const c=1-0.3*sm(0.5,0.8,t);let topY=0;
   Pp.forEach((p,i)=>{const t0=p.l*0.09+p.d,t1=t0+0.08;const f=sm(t0,t1,t);if(f<=0){gr.put(i,0,-9,0,0.001);return;}
    const yy=p.y*c;const y=lerp(1.9,yy,f);gr.put(i,p.x,y,p.z,r*(1-0.06*sm(0.5,0.8,t)),1-0.15*sm(0.5,0.8,t));if(f>=1)topY=Math.max(topY,yy+r);});gr.done();
   const wh=Math.max(0.01,topY);water.scale.y=wh;water.position.y=wh/2;water.material.opacity=0.28*(1-0.6*sm(0.5,0.85,t));
   cem.scale.y=wh;cem.position.y=wh/2;cem.material.opacity=0.55*sm(0.8,0.97,t);
   for(let i=0;i<14;i++){const f=(time*0.6+i/14)%1;if(t>0.5&&t<0.82)drops.put(i,-0.4+(i%5)*0.2,topY+f*0.4,-0.3+((i*3)%5)*0.15,0.025);else drops.put(i,0,-9,0,0.001);}drops.done();
   ld.visible=t>0.5;lc.visible=t>0.8;lw.visible=t>0.5&&t<0.82;};}
});

</script>
<script>
/* ======================= 页面逻辑 ======================= */
const SUBS={内:['板块运动','地壳运动','岩浆活动','变质作用'],构:['褶皱','断层'],外:['风化作用','侵蚀作用','搬运作用','堆积作用','固结成岩']};
const CATN={内:'内力作用',构:'地质构造',外:'外力作用'},CATC={内:'var(--in)',构:'var(--st)',外:'var(--ex)'};
const KORD=['流水','风力','海浪','冰川'];
let cat='内';
function swatch(c){const cv=document.createElement('canvas');cv.width=32;cv.height=28;const x=cv.getContext('2d');const im=x.createImageData(32,28);
 for(let j=0;j<28;j++)for(let i=0;i<32;i++){const k=patCol(c,i*0.006+0.3,0.2-j*0.006);const q=(j*32+i)*4;im.data[q]=k>>16&255;im.data[q+1]=k>>8&255;im.data[q+2]=k&255;im.data[q+3]=255;}
 x.putImageData(im,0,0);return cv.toDataURL();}
function renderNav(){
 const box=document.getElementById('grps');box.innerHTML='';
 SUBS[cat].forEach(sub=>{let ms=MODELS.filter(m=>m.cat===cat&&m.sub===sub);if(!ms.length)return;
  ms=ms.slice().sort((a,b)=>(a.kind?KORD.indexOf(a.kind):-1)-(b.kind?KORD.indexOf(b.kind):-1));
  const g=document.createElement('div');g.className='grp';g.innerHTML=`<h3 style="color:${CATC[cat]}">${sub}</h3><div class="list"></div>`;
  ms.forEach(m=>{const b=document.createElement('button');b.className='mbtn'+(current&&current.m===m?' on':'');b.innerHTML=(m.kind?`<small>${m.kind}</small>`:'')+m.name;b.onclick=()=>select(m);g.querySelector('.list').appendChild(b);});
  box.appendChild(g);});
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderNav();if(!scene)return;const first=MODELS.find(m=>m.cat===cat);if(first&&(!current||current.m.cat!==cat))select(first);});

function disposeTree(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){const ms=Array.isArray(c.material)?c.material:[c.material];ms.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});}
function select(m){
 if(world){scene.remove(world);disposeTree(world);}
 world=new THREE.Group();labelsG=new THREE.Group();world.add(labelsG);scene.add(world);
 if(ENV.sun){ENV.sun.intensity=1.1;ENV.hemi.intensity=0.55;}
 const S={add:(...a)=>a.forEach(o=>world.add(o))};
 const up=m.build(S);current={m,up};
 labelsG.visible=state.labels;
 document.getElementById('crumb').textContent=CATN[m.cat]+' · '+m.sub+(m.kind?' · '+m.kind:'');
 document.getElementById('ttl').textContent=m.name;
 document.getElementById('pr').innerHTML='<p>'+m.pr+'</p>';
 document.getElementById('ob').innerHTML=m.ob.map(s=>'<li>'+s+'</li>').join('');
 document.getElementById('kd').textContent=m.kd;
 document.getElementById('lg').innerHTML=(m.lg||[]).map(([c,s])=>`<span><i style="background-image:url(${swatch(c)})"></i>${s}</span>`).join('');
 const loop=!!m.loop;document.getElementById('prog').style.visibility=loop?'hidden':'visible';document.getElementById('pct').style.visibility=loop?'hidden':'visible';
 document.getElementById('replay').style.display=loop?'none':'';
 resetView();state.t=0;state.playing=true;setPlayBtn();FORCE=true;applyT();FORCE=false;renderNav();
 try{history.replaceState(null,'','#'+m.id);}catch(e){}
}
function resetView(){const m=current.m;controls.set(m.cam||[3,2.4,4.6],[0,m.tgt||0,0]);}
function applyT(){const m=current.m;current.up(state.t,state.time);
 document.getElementById('stg').textContent=stageText(m.st,state.t);
 if(!m.loop){document.getElementById('prog').value=Math.round(state.t*1000);document.getElementById('pct').textContent=Math.round(state.t*100)+'%';}}
function setPlayBtn(){document.getElementById('play').textContent=state.playing?'❚❚ 暂停':'▶ 播放';}
function skyTex(){const cv=document.createElement('canvas');cv.width=4;cv.height=256;const x=cv.getContext('2d');const g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,'#8fb7d6');g.addColorStop(0.55,'#cfe0ea');g.addColorStop(1,'#eef0ea');x.fillStyle=g;x.fillRect(0,0,4,256);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;}

async function init(){
 const ok=await loadThree();
 document.getElementById('loading').style.display='none';
 if(!ok){document.getElementById('err').style.display='flex';return;}
 const cv=document.getElementById('cv');
 renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();scene.background=skyTex();
 camera=new THREE.PerspectiveCamera(38,1,0.05,100);
 controls=Orbit(camera,cv);
 const hemi=new THREE.HemisphereLight(0xeaf3ff,0x7a6a55,0.55);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xfff3e0,1.1);sun.position.set(4,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
 const sc=sun.shadow.camera;sc.left=-4.5;sc.right=4.5;sc.top=4.5;sc.bottom=-4.5;sc.near=0.5;sc.far=25;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;scene.add(sun);
 const fill=new THREE.DirectionalLight(0xcfe0ff,0.28);fill.position.set(-5,3,-2);scene.add(fill);
 ENV={sun,hemi};
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.22}));ground.rotation.x=-PI/2;ground.position.y=-1.9;ground.receiveShadow=true;scene.add(ground);
 function resize(){const st=document.getElementById('stage');const w=st.clientWidth,h=st.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
 window.addEventListener('resize',resize);resize();
 document.getElementById('play').onclick=()=>{if(!current.m.loop&&state.t>=1)state.t=0;state.playing=!state.playing;setPlayBtn();};
 document.getElementById('replay').onclick=()=>{state.t=0;state.playing=true;setPlayBtn();FORCE=true;applyT();FORCE=false;};
 document.getElementById('prog').oninput=e=>{state.t=e.target.value/1000;state.playing=false;setPlayBtn();FORCE=true;applyT();FORCE=false;};
 document.getElementById('view').onclick=resetView;
 document.getElementById('lab').onclick=e=>{state.labels=!state.labels;labelsG.visible=state.labels;e.target.textContent='标签：'+(state.labels?'开':'关');};
 const hash=location.hash.slice(1);const start=MODELS.find(m=>m.id===hash)||MODELS[0];cat=start.cat;select(start);
 let last=performance.now(),acc=0;
 function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state.playing){state.time+=dt;const m=current.m;
   if(m.loop){applyT();}
   else{acc+=dt;state.t=Math.min(1,state.t+dt/(m.dur||12));if(acc>1/30||state.t>=1){acc=0;applyT();}if(state.t>=1){state.playing=false;setPlayBtn();}}}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);}
 requestAnimationFrame(loop);
}
document.getElementById('fs').onclick=()=>{const d=document.getElementById('stage');try{if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}else{document.exitFullscreen();}}catch(e){}};
document.addEventListener('fullscreenchange',()=>setTimeout(()=>window.dispatchEvent(new Event('resize')),50));
renderNav();init();
</script>
<script src="lib/workbench-bar.js"></script>
</body>
