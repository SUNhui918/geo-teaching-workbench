<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>在线卫星地图 · 高中地理教学</title>
<link rel="stylesheet" href="./leaflet/leaflet.css" />
<style>
  :root{
    --panel-bg:#0f1b2d; --panel-bg2:#13243a; --panel-line:#22344f;
    --txt:#e8eef6; --txt-dim:#9fb2c8; --accent:#2f9e6e; --accent2:#3a8fd6;
    --warn:#e0a23a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;color:var(--txt);}
  .app{display:flex;height:100vh;width:100vw;overflow:hidden;background:#0a1320;}
  /* 左侧面板 */
  .panel{width:320px;min-width:320px;background:linear-gradient(180deg,var(--panel-bg),var(--panel-bg2));
    border-right:1px solid var(--panel-line);display:flex;flex-direction:column;height:100%;}
  .panel-header{padding:16px 18px 10px;border-bottom:1px solid var(--panel-line);}
  .panel-header h1{margin:0;font-size:18px;letter-spacing:1px;}
  .panel-header .sub{margin-top:4px;font-size:12px;color:var(--txt-dim);}
  .panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
  .section{margin-bottom:6px;}
  .section-label{font-size:13px;font-weight:600;color:var(--txt);margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
  .section-label .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .map-btn{flex:1;min-width:78px;padding:9px 6px;border:1px solid var(--panel-line);background:#16273e;color:var(--txt);
    border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;}
  .map-btn:hover{border-color:var(--accent2);}
  .map-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .chk{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  .chk:hover{background:#16273e;}
  .chk input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;}
  .chk .swatch{width:16px;height:4px;border-radius:2px;flex-shrink:0;}
  .chk .cnt{font-size:11px;color:var(--txt-dim);margin-left:auto;flex-shrink:0;}
  .hint-line{font-size:11px;color:var(--txt-dim);margin-top:6px;line-height:1.5;}
  /* 分组 */
  .grp{border:1px solid var(--panel-line);border-radius:9px;margin-bottom:8px;overflow:hidden;}
  .grp-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#16273e;font-size:13px;cursor:pointer;user-select:none;}
  .grp-head:hover{background:#1b3050;}
  .grp-head .caret{font-size:10px;color:var(--txt-dim);transition:.2s;flex-shrink:0;}
  .grp.open .grp-head .caret{transform:rotate(90deg);}
  .grp-head .cnt{font-size:11px;color:var(--txt-dim);margin-left:auto;flex-shrink:0;}
  .grp-body{display:none;padding:2px 0 4px;}
  .grp.open .grp-body{display:block;}
  .grp-actions{display:flex;gap:6px;padding:4px 8px 8px;}
  .grp-actions button{flex:1;padding:5px 4px;border:1px solid var(--panel-line);background:#16273e;color:var(--txt);
    border-radius:7px;cursor:pointer;font-size:11px;}
  .grp-actions button:hover{border-color:var(--accent2);}
  /* 分界线列表 */
  .boundary-list{display:flex;flex-direction:column;gap:1px;}
  .sub-actions{display:flex;gap:8px;margin-top:8px;}
  .sub-btn{flex:1;padding:6px 4px;border:1px solid var(--panel-line);background:#16273e;color:var(--txt);border-radius:7px;cursor:pointer;font-size:12px;}
  .sub-btn:hover{border-color:var(--accent2);}
  .divider{height:1px;background:var(--panel-line);margin:14px 0;}
  /* 搜索 */
  .search-box{display:flex;gap:8px;}
  .search-box input{flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--panel-line);background:#0c1828;color:var(--txt);font-size:13px;outline:none;}
  .search-box input:focus{border-color:var(--accent2);}
  .search-box button{padding:0 14px;border:none;border-radius:8px;background:var(--accent2);color:#fff;cursor:pointer;font-size:13px;}
  .search-status{font-size:12px;color:var(--warn);margin-top:8px;min-height:16px;}
  .result-list{list-style:none;margin:8px 0 0;padding:0;max-height:200px;overflow-y:auto;border-top:1px solid var(--panel-line);}
  .result-list li{padding:8px 10px;font-size:13px;border-bottom:1px solid var(--panel-line);cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
  .result-list li:hover{background:#16273e;}
  .result-list li .cat{font-size:11px;color:var(--txt-dim);flex-shrink:0;}
  .tool-row{display:flex;gap:8px;}
  .tool-btn{padding:9px 6px;flex:1;border:1px solid var(--panel-line);background:#16273e;color:var(--txt);border-radius:8px;cursor:pointer;font-size:13px;}
  .tool-btn:hover{border-color:var(--accent2);}
  .copyright{padding:12px 16px;border-top:1px solid var(--panel-line);font-size:11px;color:var(--txt-dim);line-height:1.6;}
  .copyright b{color:var(--txt);}
  .panel-toggle{display:none;position:absolute;top:10px;left:10px;z-index:1200;background:var(--panel-bg);color:var(--txt);
    border:1px solid var(--panel-line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;}
  /* tk 输入 */
  .tk-row{display:flex;gap:8px;}
  .tk-row input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--panel-line);background:#0c1828;color:var(--txt);font-size:12px;outline:none;}
  .tk-row input:focus{border-color:var(--accent2);}
  .tk-row button{padding:0 12px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;flex-shrink:0;}
  .tk-ok{font-size:11px;color:var(--accent);margin-top:6px;}
  /* 地图区 */
  .stage{flex:1;position:relative;height:100%;}
  #map{position:absolute;inset:0;}
  /* 地图右上角坐标条 */
  .coords-bar{position:absolute;right:12px;bottom:12px;z-index:1000;background:rgba(15,27,45,.82);
    color:#dbe7f5;font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--panel-line);
    font-variant-numeric:tabular-nums;backdrop-filter:blur(4px);}
  .coords-bar span{color:var(--accent);margin-right:10px;}
  /* 搜索结果浮层(地图内) */
  .map-search-float{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1100;
    background:rgba(15,27,45,.92);border:1px solid var(--panel-line);border-radius:10px;padding:6px;min-width:280px;max-width:90vw;}
  .map-search-float .search-box input{background:#0c1828;}
  /* 要素信息卡 */
  .feature-card{background:#0f1b2d;color:var(--txt);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;font-size:13px;max-width:240px;}
  .feature-card .fc-title{font-weight:700;font-size:14px;margin-bottom:4px;}
  .feature-card .fc-note{color:var(--txt-dim);line-height:1.5;}
  /* 地图上的地名标签 */
  .geo-label{
    font-size:12px;line-height:1.2;white-space:nowrap;font-weight:700;
    color:#fff;text-shadow:0 0 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.8),0 1px 2px rgba(0,0,0,.9);
    pointer-events:auto;cursor:default;
  }
  .geo-label .ldot{display:inline-block;width:7px;height:7px;border-radius:50%;
    border:1.5px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.8);margin-right:3px;vertical-align:middle;}
  .geoname-wrap{display:flex;align-items:center;gap:5px;}
  .geoname{font-size:11px;color:#2f9e6e;background:rgba(255,255,255,.92);border-radius:3px;padding:1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;font-weight:600;}
  .zonename{font-size:11px;color:#fff;background:rgba(20,40,70,.9);border-radius:3px;padding:1px 5px;box-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;font-weight:600;}
  /* 响应式 */
  @media (max-width:720px){
    .panel{position:absolute;z-index:1300;height:100%;transform:translateX(-100%);transition:.25s;box-shadow:0 0 30px rgba(0,0,0,.5);}
    .panel.open{transform:translateX(0);}
    .panel-toggle{display:block;}
  }
  .leaflet-container{background:#0a1320;}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="panel-toggle" id="panelToggle">☰ 工具</button>
  <aside class="panel" id="panel">
    <div class="panel-header">
      <h1>🛰️ 在线卫星地图</h1>
      <div class="sub">高中地理教学 · 中文标注 · 分界线与地形区</div>
    </div>
    <div class="panel-body">
      <div class="section">
        <div class="section-label"><span class="dot"></span>底图类型</div>
        <div class="btn-row" id="baseBtns">
          <button class="map-btn active" data-base="sat">卫星影像</button>
          <button class="map-btn" data-base="ter">地形</button>
          <button class="map-btn" data-base="vec">矢量</button>
        </div>
        <div class="hint-line" id="baseHint"></div>
      </div>

      <div class="section">
        <div class="section-label"><span class="dot"></span>图层显示</div>
        <label class="chk"><input type="checkbox" id="chkCia" /> <span>中文地名注记</span></label>
        <div id="terrainGroups"></div>
        <div class="hint-line">勾选后在图上标出相应地形区的示意位置并显示名称。</div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-label"><span class="dot" style="background:#ff5e5e"></span>重要地理分界线（示意）</div>
        <div class="boundary-list" id="boundaryList"></div>
        <div class="sub-actions">
          <button class="sub-btn" id="bdAll">全选</button>
          <button class="sub-btn" id="bdNone">全不选</button>
        </div>
        <div class="hint-line">勾选后图上显示界线，并标注沿线重要山脉、河流、城市等名称。各线为教学示意位置（依据教材经典分界，非精确行政边界）。</div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-label"><span class="dot"></span>视图</div>
        <div class="tool-row">
          <button class="tool-btn" id="resetBtn">⟲ 重置视角</button>
          <button class="tool-btn" id="fullBtn">⛶ 全屏</button>
        </div>
      </div>
    </div>
    <div class="copyright">
      <b>横山桥高中孙慧制作</b><br/>
      底图来源：天地图（国家基础地理信息中心）/ Esri ArcGIS Online / OpenStreetMap。<br/>
      坐标、分界线与要素位置为示意，仅供教学定位参考。
    </div>
  </aside>

  <main class="stage">
    <div id="map"></div>
    <div class="coords-bar" id="coordsBar"><span>经度 --</span><span>纬度 --</span>缩放 --</div>
  </main>
</div>

<script src="./leaflet/leaflet.js"></script>
<script>
/* ============================================================
   天地图密钥（内置，打开即为中文地图）
   ------------------------------------------------------------
   默认已内置一个可用密钥。如被限流或想换成自己的，
   到 https://www.tianditu.gov.cn/ 免费注册，在「应用管理」
   创建应用获取 tk，粘贴到左侧输入框点「启用」即可。
   用户自行设置的 tk 会保存在 localStorage，优先级高于内置值。
   ============================================================ */
var BUILTIN_TK = '260ddb812ca767f36cf9f077726fd84f';
var TIANDITU_TK = BUILTIN_TK;
try {
  var saved = localStorage.getItem('tdt_tk');
  if (saved && saved.length > 0) TIANDITU_TK = saved;
} catch(e) {}

/* ---------- 底图定义 ---------- */
var esriImg = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics'});
var esriLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, attribution:'Esri'});
var esriTerrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:13, attribution:'Tiles &copy; Esri'});
var osmVec = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap contributors', subdomains:'abc'});

function tdt(layer){
  return L.tileLayer(
    'https://t{s}.tianditu.gov.cn/'+layer+'_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+layer+
    '&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk='+TIANDITU_TK,
    {subdomains:['0','1','2','3','4','5','6','7'], maxZoom:18, attribution:'&copy; 天地图'});
}

var useTDT = (TIANDITU_TK && TIANDITU_TK.length>0);
var bases = {};        // 底图（不含注记）
var tdtLabels = null;  // 天地图中文注记层（按底图类型）
function buildBases(){
  if(useTDT){
    bases = {
      sat: L.layerGroup([tdt('img')]),
      ter: L.layerGroup([tdt('ter')]),
      vec: L.layerGroup([tdt('vec')])
    };
    tdtLabels = { sat: tdt('cia'), ter: tdt('cta'), vec: tdt('cva') };
  }else{
    bases = { sat: esriImg, ter: esriTerrain, vec: osmVec };
    tdtLabels = null;
  }
}
buildBases();

/* ---------- 地图初始化 ---------- */
var map = L.map('map', {center:[34,104], zoom:4, zoomControl:true, attributionControl:true, worldCopyJump:true});
var currentBase = 'sat';
bases.sat.addTo(map);
var chkCia = document.getElementById('chkCia');
if(useTDT){ tdtLabels.sat.addTo(map); chkCia.checked = true; }
else { esriLabels.addTo(map); chkCia.checked = true; }

/* ---------- 底图切换 ---------- */
var baseBtns = document.getElementById('baseBtns');
baseBtns.addEventListener('click', function(e){
  var btn = e.target.closest('.map-btn'); if(!btn) return;
  var key = btn.getAttribute('data-base');
  if(key===currentBase) return;
  if(useTDT && tdtLabels[currentBase] && map.hasLayer(tdtLabels[currentBase])) map.removeLayer(tdtLabels[currentBase]);
  map.removeLayer(bases[currentBase]);
  bases[key].addTo(map);
  currentBase = key;
  Array.prototype.forEach.call(baseBtns.children, function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if(useTDT){
    if(chkCia.checked) tdtLabels[key].addTo(map);
  }else{
    if(key==='vec'){ if(map.hasLayer(esriLabels)) map.removeLayer(esriLabels); }
    else { if(chkCia.checked) esriLabels.addTo(map); }
  }
});

/* 底图提示 */
document.getElementById('baseHint').textContent = useTDT
  ? '天地图中文底图（卫星 / 地形 / 矢量均含中文注记）。'
  : '当前使用 Esri 卫星影像 / OSM 矢量；填入天地图 tk 可获中文标注底图。';

/* ---------- 中文注记开关 ---------- */
chkCia.addEventListener('change', function(){
  if(useTDT){
    if(this.checked) tdtLabels[currentBase].addTo(map); else map.removeLayer(tdtLabels[currentBase]);
  }else{
    if(currentBase==='vec') return;
    if(this.checked) esriLabels.addTo(map); else map.removeLayer(esriLabels);
  }
});

/* ---------- 地名标签工具函数 ---------- */
function makeLabel(lat, lng, text, color, cls){
  var html = '<div class="geoname-wrap"><span class="'+(cls||'geoname')+'" style="'+(cls==='zonename'?'':'color:'+color+';')+'">'+text+'</span></div>';
  return L.marker([lat, lng], {
    icon: L.divIcon({className:'', html:html, iconSize:[0,0], iconAnchor:[0,0]}),
    interactive:false, keyboard:false
  });
}
function makeDotLabel(lat, lng, text, color){
  var html = '<div class="geo-label" style="color:'+color+'"><span class="ldot" style="background:'+color+'"></span>'+text+'</div>';
  return L.marker([lat, lng], {
    icon: L.divIcon({className:'', html:html, iconSize:[0,0], iconAnchor:[0,0]}),
    interactive:false, keyboard:false
  });
}

/* ---------- 重要地理分界线（示意）+ 沿线地名 ---------- */
/* 坐标写法为 [经度, 纬度]，绘制时转为 Leaflet 的 [纬度, 经度] */
var BOUNDARIES = {
  steps: {
    name:'地势三级阶梯界线', color:'#ff5e5e', dash:'6,4',
    lines:[
      [[86,36],[90,37],[94,38],[98,37],[100,34],[101,31],[100,28],[102,27]],   // 一、二级
      [[122,50],[119,45],[117,42],[115,38],[113,35],[111,31],[110,28]]         // 二、三级
    ],
    labels:[
      [80,36.2,'帕米尔高原'],[84,36.0,'昆仑山脉'],[89,38.5,'阿尔金山脉'],
      [97,38.5,'祁连山脉'],[99,33.0,'横断山脉'],[100,27.5,'横断山区'],
      [122,50.5,'大兴安岭'],[115.5,38.5,'太行山脉'],[111,31.0,'巫山'],
      [110.5,27.0,'雪峰山']
    ]
  },
  monsoon: {
    name:'季风区与非季风区分界', color:'#ffd166', dash:null,
    lines:[
      [[124,50],[120,45],[114,42],[110,41],[106,39],[103,37],[100,35],[95,34],[90,32],[85,30]]
    ],
    labels:[
      [123,49.5,'大兴安岭'],[112,41.5,'阴山山脉'],[106,39.0,'贺兰山'],
      [100,34.5,'巴颜喀拉山脉'],[94,33.0,'唐古拉山脉'],[88,31.5,'冈底斯山脉'],
      [86,29.5,'喜马拉雅山脉']
    ]
  },
  qh: {
    name:'秦岭—淮河线（南北分界）', color:'#4dd0e1', dash:null,
    lines:[
      [[104,33.5],[107,33.8],[110,33.5],[113,33.0],[116,33.3],[119,33.2],[121,33.3]]
    ],
    labels:[
      [104,34.2,'西秦岭'],[108,34.0,'秦岭'],[112,33.5,'桐柏山'],
      [115,33.6,'大别山'],[118,33.6,'洪泽湖'],[120.5,33.4,'淮河入海口']
    ]
  },
  drywet: {
    name:'干湿地区界线（800/400/200mm）', color:'#b388ff', dash:'2,5',
    lines:[
      [[104,33.5],[107,33.8],[110,33.5],[113,33.0],[116,33.3],[119,33.2]],                       // 800mm
      [[122,50],[118,44],[115,41],[110,38],[104,36],[98,35],[92,31],[88,29],[84,28]],           // 400mm
      [[110,41],[106,38],[100,37],[95,34],[88,32],[84,30]]                                      // 200mm
    ],
    labels:[
      [104,34.3,'800mm等降水量线'],[120,47.5,'400mm等降水量线'],
      [102,36.5,'400mm（兰州一带）'],[98,35.5,'400mm（青海湖）'],
      [90,31.5,'200mm等降水量线'],[86,29.0,'藏北干旱区']
    ]
  },
  tembelt: {
    name:'温度带界线', color:'#ff9e80', dash:'4,4',
    lines:[
      [[104,33.5],[107,33.8],[110,33.5],[113,33.0],[116,33.3],[119,33.2]],   // 暖温/亚热带（秦淮）
      [[120,42],[116,41],[112,41],[108,40],[104,38],[100,37]],               // 中温/暖温带（长城）
      [[110,21.5],[108,22.5],[105,23.5],[102,24.5]]                          // 亚热/热带
    ],
    labels:[
      [104,34.5,'亚热带/暖温带（秦淮）'],[118,41.8,'暖温带/中温带（长城）'],
      [106,24.0,'亚热带/热带（南岭以南）'],[108,22.8,'雷州半岛'],
      [101,25.0,'滇南谷地']
    ]
  },
  regions: {
    name:'四大地理区域界线', color:'#80cbc4', dash:'1,6',
    lines:[
      [[104,33.5],[107,33.8],[110,33.5],[113,33.0],[116,33.3],[119,33.2]],                     // 北方/南方
      [[122,50],[118,44],[115,41],[110,38],[104,36],[98,35],[92,31],[88,29],[84,28]],          // 北方/西北
      [[86,36],[90,37],[94,38],[98,37],[100,34],[101,31],[100,28],[102,27]]                    // 青藏地区
    ],
    labels:[
      [106,34.8,'北方地区 / 南方地区'],[124,50.5,'北方地区'],
      [98,42.0,'西北地区'],[90,34.0,'青藏地区'],
      [113,29.0,'南方地区'],[86,36.8,'昆仑山—祁连山（青藏区北界）']
    ]
  }
};
var boundaryLayers = {};
var boundaryListEl = document.getElementById('boundaryList');
Object.keys(BOUNDARIES).forEach(function(k){
  var cfg = BOUNDARIES[k];
  var grp = L.layerGroup();
  cfg.lines.forEach(function(line){
    var latlngs = line.map(function(p){ return [p[1], p[0]]; });
    L.polyline(latlngs, {color:cfg.color, weight:2.5, opacity:.95, dashArray:cfg.dash||null}).addTo(grp);
  });
  // 沿线地名标注（圆圈 + 文字）  labels 格式: [经度, 纬度, 名称]
  (cfg.labels||[]).forEach(function(lb){
    makeDotLabel(lb[1], lb[0], lb[2], cfg.color).addTo(grp);
    L.circleMarker([lb[1], lb[0]], {
      radius:4, color:cfg.color, weight:1.5, fillColor:cfg.color, fillOpacity:.9, interactive:false
    }).addTo(grp);
  });
  boundaryLayers[k] = grp;
  var lbl = document.createElement('label');
  lbl.className = 'chk';
  lbl.innerHTML = '<input type="checkbox" data-bd="'+k+'"><span class="swatch" style="background:'+cfg.color+'"></span><span>'+cfg.name+'</span>';
  boundaryListEl.appendChild(lbl);
});
boundaryListEl.addEventListener('change', function(e){
  var cb = e.target; if(!cb.dataset || !cb.dataset.bd) return;
  var k = cb.dataset.bd;
  if(cb.checked) boundaryLayers[k].addTo(map); else map.removeLayer(boundaryLayers[k]);
});
document.getElementById('bdAll').addEventListener('click', function(){
  boundaryListEl.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.checked = true; boundaryLayers[cb.dataset.bd].addTo(map);
  });
});
document.getElementById('bdNone').addEventListener('click', function(){
  boundaryListEl.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.checked = false; map.removeLayer(boundaryLayers[cb.dataset.bd]);
  });
});

var zoneLayers = {};
var zoneGroupsEl = document.getElementById('terrainGroups');
Object.keys(TERRAIN_ZONES).forEach(function(k){
  var cfg = TERRAIN_ZONES[k];
  var grp = L.layerGroup();
  cfg.items.forEach(function(d){
    var nm = d[0], lon = d[1], lat = d[2], note = d[3];
    // 示意圆点
    var m = L.circleMarker([lat, lon], {radius:5, color:'#fff', weight:1.5, fillColor:cfg.color, fillOpacity:.85});
    m.bindPopup('<div class="feature-card"><div class="fc-title">'+nm+'</div><div class="fc-note">'+note+'</div></div>');
    grp.addLayer(m);
    // 名称标注（常显）
    makeLabel(lat, lon, nm, cfg.color, 'zonename').addTo(grp);
  });
  zoneLayers[k] = grp;

  // 面板分组
  var box = document.createElement('div');
  box.className = 'grp';
  box.innerHTML =
    '<div class="grp-head"><span class="caret">▶</span><span class="swatch" style="width:14px;height:4px;border-radius:2px;background:'+cfg.color+'"></span><span>'+cfg.name+'</span><span class="cnt">'+cfg.items.length+' 个</span></div>' +
    '<div class="grp-body">' +
      '<label class="chk"><input type="checkbox" data-zone="'+k+'"><span>全部显示（含名称）</span></label>' +
    '</div>' +
    '<div class="grp-actions"><button data-zone-all="'+k+'">全选</button><button data-zone-none="'+k+'">清除</button></div>';
  zoneGroupsEl.appendChild(box);
});
// 分组展开/收起
zoneGroupsEl.addEventListener('click', function(e){
  var head = e.target.closest('.grp-head');
  if(head){ head.parentElement.classList.toggle('open'); return; }
  var bAll = e.target.closest('button[data-zone-all]');
  if(bAll){
    var k1 = bAll.getAttribute('data-zone-all');
    var cb1 = zoneGroupsEl.querySelector('input[data-zone="'+k1+'"]');
    cb1.checked = true; zoneLayers[k1].addTo(map);
    return;
  }
  var bNone = e.target.closest('button[data-zone-none]');
  if(bNone){
    var k2 = bNone.getAttribute('data-zone-none');
    var cb2 = zoneGroupsEl.querySelector('input[data-zone="'+k2+'"]');
    cb2.checked = false; map.removeLayer(zoneLayers[k2]);
    return;
  }
});
zoneGroupsEl.addEventListener('change', function(e){
  var cb = e.target; if(!cb.dataset || !cb.dataset.zone) return;
  var k = cb.dataset.zone;
  if(cb.checked) zoneLayers[k].addTo(map); else map.removeLayer(zoneLayers[k]);
});

/* ---------- 坐标实时显示 ---------- */
var coordsBar=document.getElementById('coordsBar');
function fmtLng(v){ return Math.abs(v).toFixed(3) + (v<0 ? '\u00b0W' : '\u00b0E'); }
function fmtLat(v){ return Math.abs(v).toFixed(3) + (v<0 ? '\u00b0S' : '\u00b0N'); }
map.on('mousemove', function(e){
  coordsBar.innerHTML='<span>经度 '+fmtLng(e.latlng.lng)+'</span><span>纬度 '+fmtLat(e.latlng.lat)+'</span>缩放 '+map.getZoom();
});
map.on('zoomend', function(){
  coordsBar.innerHTML='<span>经度 --</span><span>纬度 --</span>缩放 '+map.getZoom();
});

/* ---------- 重置视角 / 全屏 ---------- */
document.getElementById('resetBtn').addEventListener('click', function(){
  map.flyTo([34,104],4,{duration:1});
});
document.getElementById('fullBtn').addEventListener('click', function(){
  var el=document.getElementById('app');
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen).call(el); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen).call(document); }
});

/* ---------- 移动端面板开关 ---------- */
document.getElementById('panelToggle').addEventListener('click', function(){
  document.getElementById('panel').classList.toggle('open');
});
