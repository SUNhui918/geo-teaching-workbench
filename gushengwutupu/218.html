  <p><font size="4" color="#ff000"><b>218 始祖鸟</b></font></p>
  <table width="95%" border="0">
    <tr>
      <td>
        <div align="center"><img src="218.jpg" width="340" height="346"></div>
      </td>
    </tr>
    <tr>
      <td><font size="2">生活在一亿三千七百万年前，是早期的一种鸟类。它的大小如乌鸦。有羽毛，前肢虽然已成为翅膀，但还有分开的指爪。嘴里长有牙齿，与爬行动物接近。因此，始祖鸟被认为是爬行动物进化到鸟类的过渡动物。</font></td>
    </tr>
