      <td><font size="2">生活在一亿三千万年前，是一种能飞行的恐龙。体长约60厘米，上下颌上有尖齿，喜食鱼类。翼骨间有翼膜，像鸟类的翅膀。尾巴很长，末端有一个舵状的皮膜，所以又叫它“舵尾喙嘴龙”。</font></td>
