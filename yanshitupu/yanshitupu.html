<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 本资源由横山桥高级中学孙慧原创，仅供教学使用，未经许可不得商用 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岩石图谱 - 在线浏览</title>
<style>
:root {
  --bg: #0f1923;
  --bg-card: #1a2734;
  --bg-card-hover: #21303f;
  --border: rgba(78, 205, 196, 0.15);
  --text: #e8eef3;
  --text-muted: #8a9ba8;
  --accent: #4ecdc4;
  --accent2: #ff6b6b;
  --accent4: #54a0ff;
  --c-sed: #4ecdc4;      /* 沉积岩 */
  --c-ign: #ff8a5c;      /* 岩浆岩 */
  --c-met: #9d8cff;      /* 变质岩 */
  --radius: 14px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* 顶部 */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 24px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  border-bottom: 2px solid var(--accent);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand .icon {
  font-size: 30px;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(78, 205, 196, 0.12);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.brand h1 {
  font-size: 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent4));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
}
.brand p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.search-box { position: relative; flex: 0 1 340px; min-width: 200px; }
.search-box input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(26, 39, 52, 0.9);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box .s-icon {
  position: absolute; left: 13px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
}
/* 主体 */
main {
  flex: 1;
  display: flex;
  min-height: 0;
}
/* 左侧目录 */
aside {
  width: 320px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.toc-head {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.toc-head .row1 {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-muted); margin-bottom: 8px;
}
.toc-head .count { color: var(--accent); font-weight: 600; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters .chip {
  padding: 4px 11px; font-size: 12px; border-radius: 20px;
  border: 1px solid var(--border); color: var(--text-muted);
  cursor: pointer; background: transparent; transition: all 0.2s;
  user-select: none;
}
.filters .chip:hover { color: var(--text); border-color: var(--accent); }
.filters .chip.on { background: var(--accent); color: #0f1923; border-color: var(--accent); font-weight: 600; }
#tocList {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  min-height: 0;
}
#tocList::-webkit-scrollbar { width: 6px; }
#tocList::-webkit-scrollbar-thumb { background: rgba(78,205,196,0.25); border-radius: 3px; }
.group-title {
  font-size: 12px; color: var(--text-muted);
  padding: 10px 12px 4px;
  display: flex; align-items: center; gap: 8px;
  position: sticky; top: 0; background: var(--bg-card); z-index: 1;
}
.group-title .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.group-title .gcount { font-family: Consolas, monospace; font-size: 11px; }
.toc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
}
.toc-item:hover { background: var(--bg-card-hover); }
.toc-item.active {
  background: rgba(78, 205, 196, 0.15);
  border-left: 3px solid var(--accent);
}
.toc-item .no {
  font-size: 11px;
  color: var(--accent);
  font-family: Consolas, monospace;
  min-width: 30px;
}
.toc-item .nm {
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-item .pg {
  margin-left: auto; font-size: 11px; color: var(--text-muted);
  font-family: Consolas, monospace;
}
.toc-empty {
  padding: 30px 16px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
/* 右侧内容 */
section {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.toolbar button {
  padding: 8px 18px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(78, 205, 196, 0.08);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
}
.toolbar button:hover:not(:disabled) {
  background: var(--accent);
  color: #0f1923;
  border-color: var(--accent);
}
.toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
#currentLabel {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 10px;
}
#currentLabel .cc {
  font-size: 11px; padding: 2px 9px; border-radius: 20px; color: #0f1923; font-weight: 700;
}
#contentFrame {
  flex: 1;
  border: none;
  background: #f4f6f8;
  width: 100%;
  min-height: 0;
}
/* 移动端适配 */
@media (max-width: 768px) {
  header { flex-direction: column; align-items: stretch; }
  main { flex-direction: column; }
  aside { width: 100%; height: 38%; border-right: none; border-bottom: 1px solid var(--border); }
  section { flex: 1; }
}
</style>
<style id='wb-copyright-style'>
#wb-copyright-watermark{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27150%27%3E%3Ctext%20x%3D%270%27%20y%3D%2785%27%20font-family%3D%27sans-serif%27%20font-size%3D%2715%27%20fill%3D%27%23888888%27%20transform%3D%27rotate%28-28%20150%2075%29%27%3E%E6%A8%AA%E5%B1%B1%E6%A1%A5%E9%AB%98%E4%B8%AD%E5%AD%99%E6%85%A7%E5%88%B6%E4%BD%9C%20%C2%B7%20%E4%BB%85%E4%BE%9B%E6%95%99%E5%AD%A6%20%C2%B7%20%E6%9C%AA%E7%BB%8F%E8%AE%B8%E5%8F%AF%E4%B8%8D%E5%BE%97%E5%95%86%E7%94%A8%3C%2Ftext%3E%3C%2Fsvg%3E");background-repeat:repeat;}
#wb-copyright-note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9998;pointer-events:none;font-size:12px;font-family:sans-serif;color:#555;opacity:.78;line-height:1.4;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.07);border-radius:999px;padding:3px 14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}
</style>

<body>
<header>
  <div class="brand">
    <span class="icon">🪨</span>
    <div>
      <h1>岩石图谱</h1>
      <p>三大岩类手标本图文资料 · 常州市武进区横山桥高级中学地理教研组 · 仅供课堂教学使用</p>
    </div>
  </div>
  <div class="search-box">
    <span class="s-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索岩石名称，如：板岩 / 石灰岩">
  </div>
</header>

<main>
  <aside>
    <div class="toc-head">
      <div class="row1">
        <span>📋 目录</span>
        <span class="count" id="countLabel">24 种</span>
      </div>
      <div class="filters" id="filters">
        <span class="chip on" data-cat="">全部</span>
        <span class="chip" data-cat="沉积岩">沉积岩</span>
        <span class="chip" data-cat="岩浆岩">岩浆岩</span>
        <span class="chip" data-cat="变质岩">变质岩</span>
      </div>
    </div>
    <div id="tocList"></div>
  </aside>
  <section>
    <div class="toolbar">
      <button id="prevBtn" title="上一块岩石 (←)">◀ 上一个</button>
      <span id="currentLabel">001 板岩 <span class="cc" id="curCat">沉积岩</span></span>
      <button id="nextBtn" title="下一块岩石 (→)">下一个 ▶</button>
    </div>
    <iframe id="contentFrame" src="001.html" title="岩石内容"></iframe>
  </section>
</main>

<script>
(function () {
  'use strict';
  var toc = [];
  var currentIdx = 0;
  var curFilter = '';
  var listEl = document.getElementById('tocList');
  var frameEl = document.getElementById('contentFrame');
  var searchEl = document.getElementById('searchInput');
  var countEl = document.getElementById('countLabel');
  var labelEl = document.getElementById('currentLabel');
  var curCatEl = document.getElementById('curCat');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var CAT_COLOR = { '沉积岩': '#4ecdc4', '岩浆岩': '#ff8a5c', '变质岩': '#9d8cff' };

  // 加载目录
  fetch('toc.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      toc = data;
      renderList('');
      var last = parseInt(localStorage.getItem('ys_toc_last'), 10);
      if (!isNaN(last) && last >= 0 && last < toc.length) {
        selectItem(last, false);
      } else {
        selectItem(0, false);
      }
    })
    .catch(function () {
      listEl.innerHTML = '<div class="toc-empty">目录加载失败，请检查网络后刷新</div>';
    });

  // 渲染目录（分组 + 过滤）
  function renderList(keyword) {
    keyword = (keyword || '').trim().toLowerCase();
    var matched = 0;
    var html = '';
    var groups = [];  // 保持分类顺序
    toc.forEach(function (item) {
      if (curFilter && item.cat !== curFilter) return;
      if (keyword && item.name.toLowerCase().indexOf(keyword) === -1) return;
      matched++;
      var g = groups.filter(function (x) { return x.cat === item.cat; })[0];
      if (!g) { g = { cat: item.cat, items: [] }; groups.push(g); }
      g.items.push(item);
    });
    groups.forEach(function (g) {
      html += '<div class="group-title"><span class="dot" style="background:' +
              (CAT_COLOR[g.cat] || '#8a9ba8') + '"></span>' + g.cat +
              ' <span class="gcount">' + g.items.length + ' 种</span></div>';
      g.items.forEach(function (item) {
        var i = toc.indexOf(item);
        var isActive = (i === currentIdx && !keyword && !curFilter);
        html += '<div class="toc-item' + (isActive ? ' active' : '') + '" data-idx="' + i + '">' +
                '<span class="no">' + ('00' + item.n).slice(-3) + '</span>' +
                '<span class="nm">' + item.name + '</span>' +
                '<span class="pg">' + item.pages + '页</span></div>';
      });
    });
    if (!matched) {
      html = '<div class="toc-empty">未找到「' + (keyword || '') + '」，换个关键词试试</div>';
    }
    listEl.innerHTML = html;
    countEl.textContent = matched + ' 种';

    Array.prototype.forEach.call(listEl.querySelectorAll('.toc-item'), function (el) {
      el.addEventListener('click', function () {
        selectItem(parseInt(el.getAttribute('data-idx'), 10), true);
      });
    });
    var activeEl = listEl.querySelector('.toc-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  // 选中
  function selectItem(idx, fromClick) {
    if (idx < 0 || idx >= toc.length) return;
    currentIdx = idx;
    var item = toc[idx];
    frameEl.src = ('00' + item.n).slice(-3) + '.html';
    labelEl.childNodes[0].nodeValue = ('00' + item.n).slice(-3) + ' ' + item.name + ' ';
    curCatEl.textContent = item.cat;
    curCatEl.style.background = CAT_COLOR[item.cat] || '#8a9ba8';
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === toc.length - 1;
    try { localStorage.setItem('ys_toc_last', String(idx)); } catch (e) {}
    Array.prototype.forEach.call(listEl.querySelectorAll('.toc-item'), function (el) {
      el.classList.toggle('active', parseInt(el.getAttribute('data-idx'), 10) === idx);
    });
    var activeEl = listEl.querySelector('.toc-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  // 搜索
  var searchTimer = null;
  searchEl.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { renderList(searchEl.value); }, 150);
  });

  // 分类筛选
  Array.prototype.forEach.call(document.querySelectorAll('#filters .chip'), function (chip) {
    chip.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#filters .chip'), function (c) {
        c.classList.remove('on');
      });
      chip.classList.add('on');
      curFilter = chip.getAttribute('data-cat');
      renderList(searchEl.value);
    });
  });

  // 上下页
  prevBtn.addEventListener('click', function () { selectItem(currentIdx - 1, true); });
  nextBtn.addEventListener('click', function () { selectItem(currentIdx + 1, true); });

  // 键盘
  document.addEventListener('keydown', function (e) {
    if (document.activeElement === searchEl) return;
    if (e.key === 'ArrowLeft') selectItem(currentIdx - 1, true);
    if (e.key === 'ArrowRight') selectItem(currentIdx + 1, true);
  });
})();
</script>
