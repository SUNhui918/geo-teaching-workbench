<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash 课件在线播放器</title>
<script src="ruffle/ruffle.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    flex-shrink: 0;
  }
  .topbar .title {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: rgba(255,255,255,0.25); }
  #stage {
    flex: 1;
    position: relative;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage ruffle-player, #stage embed, #stage object, #stage > div { width: 100%; height: 100%; display: block; }
  .loading-tip {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #8899aa; font-size: 15px; letter-spacing: 2px;
  }
  .error-tip {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #cc3344; font-size: 14px; gap: 14px; padding: 30px; text-align: center;
  }
</style>
</head>
<body>
<div class="topbar">
  <span class="title" id="pageTitle">🎬 Flash 课件</span>
  <a class="btn" href="index.html">← 返回工作台</a>
  <button class="btn" onclick="toggleFull()">⛶ 全屏</button>
</div>
<div id="stage">
  <div class="loading-tip" id="tip">正在加载课件，请稍候…</div>
</div>
<script>
const params = new URLSearchParams(location.search);
const swf = params.get('swf') || '';
const names = {
  'swf/sunrise_0.swf': '太阳周日视运动演示动画',
  'swf/gongzhuan_0.swf': '公转的意义',
  'swf/diqiuyundong_0.swf': '地球的运动 Flash 课件',
  'swf/yuexiang_0.swf': '月相变化演示',
};
if (names[swf]) document.getElementById('pageTitle').textContent = '🎬 ' + names[swf];

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}

window.addEventListener('DOMContentLoaded', () => {
  if (!swf) {
    document.getElementById('tip').innerHTML =
      '<div class="error-tip">缺少课件参数：请从工作台进入</div>';
    return;
  }
  const ruffle = window.RufflePlayer && window.RufflePlayer.newest();
  if (!ruffle) {
    document.getElementById('tip').innerHTML =
      '<div class="error-tip">播放器组件加载失败，请刷新重试</div>';
    return;
  }
  const player = ruffle.createPlayer();
  const stage = document.getElementById('stage');
  stage.appendChild(player);
  player.addEventListener('loadedmetadata', () => {
    document.getElementById('tip').style.display = 'none';
  });
  player.addEventListener('error', (e) => {
    document.getElementById('tip').innerHTML =
      '<div class="error-tip">😥 该课件暂不支持在线播放（Flash 动画兼容问题），建议下载原 exe 使用</div>';
  });
  player.load({ url: swf, autoplay: 'on' });
});
</script>
<!-- 动态时间水印 -->
<div id="time-wm" style="position:fixed;right:10px;bottom:8px;z-index:99999;pointer-events:none;user-select:none;text-align:right;font:11px/1.7 -apple-system,'Microsoft YaHei',sans-serif;color:rgba(255,255,255,.88);background:rgba(0,0,0,.42);padding:3px 10px;border-radius:12px;letter-spacing:.5px;white-space:nowrap;">
  <span id="wm-now">--</span><br>横山桥高中地理教研组 · 构建于 2026-08-21
</div>
<script>
(function(){var e=document.getElementById("wm-now");function p(n){return (n<10?"0":"")+n}function t(){var d=new Date();e.textContent="当前时间 "+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}t();setInterval(t,30000)})();
</script>
</body>
</html>
