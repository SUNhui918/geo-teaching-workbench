    <style>
        :root {
            --bg: #0f1923;
            --bg-card: #1a2734;
            --bg-card-hover: #21303f;
            --border: rgba(78, 205, 196, 0.15);
            --border-hover: rgba(78, 205, 196, 0.4);
            --text: #e8eef3;
            --text-muted: #8a9ba8;
            --accent: #4ecdc4;
            --accent-glow: rgba(78, 205, 196, 0.2);
            --accent2: #ff6b6b;
            --accent3: #feca57;
            --accent4: #54a0ff;
            --accent5: #5f27cd;
            --accent6: #48dbfb;
            --radius: 14px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --search-bg: rgba(15, 25, 35, 0.85);
            --icon-bg: rgba(78, 205, 196, 0.1);
            --tag-bg: rgba(78, 205, 196, 0.12);
        }

        html[data-theme="light"] {
            --bg: #f2f5f8;
            --bg-card: #ffffff;
            --bg-card-hover: #f7fafc;
            --border: rgba(15, 60, 55, 0.14);
            --border-hover: rgba(15, 143, 128, 0.5);
            --text: #1f2d3a;
            --text-muted: #5f7285;
            --accent: #0f8f80;
            --accent-glow: rgba(15, 143, 128, 0.18);
            --shadow: 0 6px 20px rgba(31, 45, 58, 0.1);
            --search-bg: rgba(255, 255, 255, 0.92);
            --icon-bg: rgba(15, 143, 128, 0.1);
            --tag-bg: rgba(15, 143, 128, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(78, 205, 196, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(84, 160, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(95, 39, 205, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== Nav Bar（两行布局：第1行 logo + 学校名 + 右侧按钮；第2行 nav-tabs）===== */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 10px 20px 0;
            gap: 8px;
        }
        .nav-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .nav-row-1 { min-height: 38px; }
        .nav-row-2 {
            overflow-x: auto;
            scrollbar-width: none;
            margin: 0 -20px;
            padding: 0 20px 8px;
        }
        .nav-row-2::-webkit-scrollbar { display: none; }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            flex-shrink: 0;
            text-decoration: none;
        }
        .nav-logo .nav-globe { font-size: 1.4rem; line-height: 1; }

        .nav-school {
            font-size: 0.86rem;
            color: var(--text-muted);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-school b {
            color: var(--text);
            font-weight: 600;
            margin-right: 4px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .nav-tab {
            padding: 6px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            user-select: none;
        }
        .nav-tab:hover { color: var(--text); background: var(--bg-card); }
        .nav-tab.active {
            color: #0f1923;
            background: var(--accent);
            font-weight: 600;
        }
        html[data-theme="light"] .nav-tab.active { color: #ffffff; }
        .nav-tab .nav-count {
            margin-left: 4px;
            opacity: 0.7;
            font-size: 0.8em;
        }

        .nav-search-wrap { position: relative; flex-shrink: 0; }
        .nav-search-input {
            width: 180px;
            padding: 6px 10px 6px 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        .nav-search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
            width: 240px;
        }
        .nav-search-icon {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .nav-icon-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .nav-icon-btn:hover { color: var(--text); border-color: var(--border-hover); }

        @media (max-width: 768px) {
            .nav-bar { padding: 8px 12px 0; }
            .nav-row-2 { margin: 0 -12px; padding: 0 12px 6px; }
            .nav-logo { font-size: 1rem; }
            .nav-school { font-size: 0.78rem; }
            .nav-search-input { width: 110px; }
            .nav-search-input:focus { width: 150px; }
            .nav-tab { padding: 5px 9px; font-size: 0.8rem; }
        }

        /* ===== Section ===== */
        .section { margin-bottom: 30px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .section-icon { font-size: 1.2rem; }
        .section-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .section-count { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        /* ===== Card（简洁样式：badge + 标题 + 一行描述 + 大数字水印）===== */
        .card {
            display: block;
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            min-height: 110px;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            overflow: hidden;
            cursor: pointer;
        }
        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .card-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--tag-bg);
            color: var(--card-accent, var(--accent));
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
        }
        .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 大数字水印（右侧底部） */
        .card-watermark {
            position: absolute;
            right: -4px;
            bottom: -22px;
            font-size: 5.6rem;
            font-weight: 800;
            line-height: 1;
            color: var(--card-accent, var(--accent));
            opacity: 0.07;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            pointer-events: none;
            user-select: none;
            letter-spacing: -2px;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            display: none;
        }
        .no-results.show { display: block; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card-hover);
            border: 1px solid var(--border-hover);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 版权水印 */
        .copyright-wm {
            position: fixed;
            right: 10px;
            bottom: 6px;
            z-index: 9999;
            font-size: 11px;
            color: rgba(232, 238, 243, 0.16);
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        footer {
            text-align: center;
            padding: 30px 0 24px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .card-watermark { font-size: 4.5rem; bottom: -16px; }
        }

        /* Smooth scroll */
        html { scroll-behavior: smooth; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb {
            background: rgba(78, 205, 196, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(78, 205, 196, 0.4); }

    </style>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('wb-theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('wb-theme', next); } catch (e) {}
            var b = document.getElementById('themeToggle');
            if (b) b.textContent = next === 'dark' ? '☀ 浅色' : '🌙 深色';
        }
    </script>

        let globalCardIdx = 0;

        // Render nav tabs
        function renderCategories() {
            const container = document.getElementById('navTabs');
            let total = 0;
            categories.forEach(c => total += c.sites.length);

            let html = `<div class="nav-tab active" onclick="selectCategory('all')" data-cat="all">全部 <span class="nav-count">${total}</span></div>`;
            categories.forEach(c => {
                html += `<div class="nav-tab" onclick="selectCategory('${c.id}')" data-cat="${c.id}">${c.name} <span class="nav-count">${c.sites.length}</span></div>`;
            });
            container.innerHTML = html;
        }

        // Render content（简洁卡片：badge + 标题 + 描述 + 大数字水印）
        function renderContent(filterText = '', catFilter = 'all') {
            const container = document.getElementById('content');
            const noResults = document.getElementById('noResults');
            let html = '';
            let hasResults = false;
            globalCardIdx = 0;

            categories.forEach(cat => {
                if (catFilter !== 'all' && catFilter !== cat.id) return;

                const filteredSites = cat.sites.filter(s => {
                    if (!filterText) return true;
                    return s.title.toLowerCase().includes(filterText.toLowerCase()) ||
                           s.desc.toLowerCase().includes(filterText.toLowerCase());
                });

                if (filteredSites.length === 0) return;
                hasResults = true;

                html += `<div class="section" data-category="${cat.id}">`;
                html += `<div class="section-header">`;
                html += `<span class="section-icon">${cat.icon}</span>`;
                html += `<span class="section-title">${cat.name}</span>`;
                html += `<span class="section-count">${filteredSites.length} 项</span>`;
                html += `</div>`;
                html += `<div class="grid">`;

                filteredSites.forEach(site => {
                    globalCardIdx++;
                    const isCloudEnv = location.protocol !== 'file:';
                    const isCloudCard = isCloudEnv && site.cloud;

                    // 决定链接 href（云端有 cloud → 用 cloud 链接；本地 → 直接打开本地路径；纯外链 → 原 URL）
                    let href = '#', target = '', clickHandler = '', cursorStyle = 'cursor: pointer;';
                    if (isCloudCard) {
                        href = site.cloud; target = 'target="_blank"';
                    } else if (site.local) {
                        const fp = 'file:///' + site.path.replace(/\\/g, '/');
                        href = encodeURI(fp); target = 'target="_blank"';
                    } else {
                        href = site.url; target = 'target="_blank"';
                    }

                    // Badge：交互演示 / 在线演示 / 地图 / 工具 等
                    let badge = '';
                    if (isCloudCard) {
                        badge = site.cloud.indexOf('player.html') === 0 ? 'Flash 课件' : '在线演示';
                    } else if (site.local) {
                        badge = site.kind === 'html' ? '本地工具' : '本地应用';
                    } else {
                        badge = '在线资源';
                    }

                    html += `<a href="${href}" ${target} class="card" style="--card-accent: ${cat.color}; ${cursorStyle}">`;
                    html += `<div class="card-badge">${badge}</div>`;
                    html += `<div class="card-title">${site.title}</div>`;
                    html += `<div class="card-desc">${site.desc}</div>`;
                    html += `<div class="card-watermark">${String(globalCardIdx).padStart(2, '0')}</div>`;
                    html += `</a>`;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
            noResults.classList.toggle('show', !hasResults);
        }

        // Select category
        function selectCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === catId);
            });
            const searchText = document.getElementById('navSearch').value.trim();
            renderContent(searchText, catId);
        }

        // Search
        function handleSearch() {
            const searchText = document.getElementById('navSearch').value.trim();
            renderContent(searchText, activeCategory);
        }

        // Init
        renderCategories();
        renderContent();
