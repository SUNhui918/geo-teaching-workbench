<head>
<!-- 本教学工作台由横山桥高级中学孙慧原创，仅供教学使用，未经许可不得商用 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理智能化教学工作台</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --bg-card: #ffffff;
            --bg-card-hover: #fdfeff;
            --border: rgba(120, 140, 160, 0.1);
            --border-hover: rgba(43, 184, 163, 0.35);
            --text: #2d3a4a;
            --text-muted: #6b7d8e;
            --accent: #2bb8a3;
            --accent-2: #7fc9f0;
            --accent-3: #c792ea;
            --accent-glow: rgba(43, 184, 163, 0.22);
            --shadow-card: 0 2px 10px rgba(45, 58, 74, 0.04);
            --shadow-hover: 0 10px 30px rgba(43, 184, 163, 0.22), 0 2px 8px rgba(127, 201, 240, 0.16);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* 大圆角 */
            --radius-card: 18px;
            --radius-pill: 999px;
            --radius-btn: 14px;
            /* 莫兰迪马卡龙徽章（粉/薄荷/紫/黄/蓝） */
            --pill-pink-bg:#ffe5ec;   --pill-pink-fg:#b8395a;
            --pill-mint-bg:#d8f3e3;   --pill-mint-fg:#1d7a5b;
            --pill-purple-bg:#ece4f7; --pill-purple-fg:#6b4ba2;
            --pill-yellow-bg:#fff4d6; --pill-yellow-fg:#a67c00;
            --pill-blue-bg:#dde9f7;   --pill-blue-fg:#2c6fae;
            --pill-rose-bg:#ffe0d4;   --pill-rose-fg:#c25e3b;
        }

        html[data-theme="dark"] {
            --bg: #0f1923;
            --bg-card: #1a2734;
            --bg-card-hover: #21303f;
            --border: rgba(78, 205, 196, 0.15);
            --border-hover: rgba(43, 184, 163, 0.45);
            --text: #e8eef3;
            --text-muted: #8a9ba8;
            --accent: #4ecdc4;
            --accent-glow: rgba(78, 205, 196, 0.25);
            --shadow-card: 0 2px 10px rgba(0,0,0,0.3);
            --shadow-hover: 0 10px 30px rgba(78, 205, 196, 0.25), 0 2px 8px rgba(0,0,0,0.3);
            --pill-pink-bg:#3a2030;   --pill-pink-fg:#ffb3c6;
            --pill-mint-bg:#1a3027;   --pill-mint-fg:#9be3c0;
            --pill-purple-bg:#2a2440; --pill-purple-fg:#c8b8e8;
            --pill-yellow-bg:#3a3020; --pill-yellow-fg:#ffd98a;
            --pill-blue-bg:#1f2a3a;   --pill-blue-fg:#9fc0e8;
            --pill-rose-bg:#3a2820;   --pill-rose-fg:#ffba90;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            background-image:
              url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='160' viewBox='0 0 220 160'><g fill='none' stroke='%232bb8a3' stroke-width='1' opacity='0.6'><path d='M0 30 Q40 10 80 30 T160 30 T240 30'/><path d='M0 50 Q40 35 80 50 T160 50 T240 50'/><path d='M0 70 Q40 55 80 70 T160 70 T240 70'/><path d='M0 95 Q40 80 80 95 T160 95 T240 95'/><path d='M0 120 Q40 105 80 120 T160 120 T240 120'/><path d='M0 145 Q40 130 80 145 T160 145 T240 145'/><circle cx='40' cy='80' r='1.2' fill='%232bb8a3' opacity='0.8'/><circle cx='120' cy='30' r='1.2' fill='%237fc9f0' opacity='0.8'/><circle cx='180' cy='100' r='1.2' fill='%23c792ea' opacity='0.8'/></g></svg>"),
              radial-gradient(ellipse at 18% 0%, rgba(43,184,163,0.06) 0%, transparent 45%),
              radial-gradient(ellipse at 82% 100%, rgba(127,201,240,0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 50%, rgba(199,146,234,0.03) 0%, transparent 60%);
            background-size: 220px 160px, auto, auto, auto;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Banner 迷你 Header（96px 高，居中：地球IP+大标题+Slogan+3胶囊，左右小插画） */
        .hero-banner{
            position:relative;
            height:96px;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg, rgba(43,184,163,.07) 0%, rgba(127,201,240,.07) 50%, rgba(199,146,234,.06) 100%);
            border-bottom:1px solid var(--border);
        }
        html[data-theme="dark"] .hero-banner{
            background:linear-gradient(135deg, rgba(43,184,163,.12) 0%, rgba(127,201,240,.10) 50%, rgba(199,146,234,.08) 100%);
        }
        .hero-content{
            position:relative;z-index:1;
            display:flex;flex-direction:column;align-items:center;
            max-width:760px;width:100%;padding:0 24px;
        }
        .hero-title-row{display:flex;align-items:center;gap:10px;justify-content:center;}
        .hero-globe{width:44px;height:44px;flex-shrink:0;}
        .hero-title{
            font-size:1.55rem;font-weight:800;letter-spacing:1.5px;
            background:linear-gradient(135deg,#2bb8a3 0%,#7fc9f0 60%,#c792ea 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent;
            display:inline-flex;align-items:center;
        }
        .hero-slogan{
            font-size:.72rem;color:var(--text-muted);margin-top:1px;letter-spacing:2px;
        }
        .hero-stats{display:flex;gap:6px;justify-content:center;margin-top:6px;}
        .hero-stat-pill{
            font-size:.68rem;padding:2px 10px;border-radius:var(--radius-pill);
            background:rgba(255,255,255,.85);color:var(--text-muted);
            border:1px solid var(--border);backdrop-filter:blur(6px);
            display:inline-flex;align-items:center;gap:3px;font-weight:500;
        }
        html[data-theme="dark"] .hero-stat-pill{background:rgba(26,39,52,.85);}
        .hero-stat-pill b{color:var(--accent);font-weight:700;font-size:.85rem;}

        .hero-deco{
            position:absolute;top:50%;transform:translateY(-50%);
            pointer-events:none;opacity:.85;
        }
        .hero-deco.left{left:3%;animation:heroFloat 6s ease-in-out infinite;}
        .hero-deco.right{right:3%;animation:heroFloat 7.5s ease-in-out infinite reverse;}
        .hero-deco svg{width:80px;height:80px;}
        @keyframes heroFloat{
            0%,100%{transform:translateY(calc(-50% - 3px))}
            50%{transform:translateY(calc(-50% + 3px))}
        }
        @media (max-width:760px){
            .hero-deco{display:none;}
            .hero-banner{height:auto;padding:14px 0;}
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 18px 24px 0;
        }

        /* ===== Nav Bar（紧凑 2 行：第1行 学校名+搜索+主题；第2行 分类 tab）===== */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 6px 20px 0;
            gap: 4px;
        }
        .nav-row {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .nav-row-1 { min-height: 36px; }
        .nav-row-2 {
            overflow-x: auto;
            scrollbar-width: none;
            margin: 0 -20px;
            padding: 0 20px 8px;
        }
        .nav-row-2::-webkit-scrollbar { display: none; }

        .nav-school {
            font-size: 0.86rem;
            color: var(--text-muted);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-school b {
            color: var(--text);
            font-weight: 600;
            margin-right: 4px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 5px;
            flex: 1;
            flex-wrap: nowrap;
        }

        .nav-tab {
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            color: var(--text-muted);
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1px solid transparent;
        }
        .nav-tab:hover {
            color: var(--text);
            background: var(--bg-card);
            border-color: var(--border);
        }
        .nav-tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent) 0%, #25a991 100%);
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        html[data-theme="dark"] .nav-tab.active { color: #0f1923; }
        .nav-tab .tab-icon {
            font-size: 1em;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.1));
        }
        .nav-tab .nav-count {
            margin-left: 3px;
            opacity: 0.75;
            font-size: 0.78em;
            background: rgba(255,255,255,.25);
            padding: 1px 6px;
            border-radius: 999px;
        }
        .nav-tab.active .nav-count { background: rgba(255,255,255,.3); }

        .nav-search-wrap { position: relative; flex-shrink: 0; }
        .nav-search-input {
            width: 180px;
            padding: 7px 12px 7px 32px;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            background: var(--bg-card);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: var(--shadow-card);
        }
        .nav-search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            width: 240px;
            background: var(--bg-card-hover);
        }
        .nav-search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .nav-icon-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-btn);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .nav-icon-btn:hover { color: var(--text); border-color: var(--border-hover); background: var(--bg-card-hover); }

        @media (max-width: 768px) {
            .nav-bar { padding: 8px 12px 0; }
            .nav-row-2 { margin: 0 -12px; padding: 0 12px 6px; }
            .nav-logo { font-size: 1rem; }
            .nav-school { font-size: 0.78rem; }
            .nav-search-input { width: 110px; }
            .nav-search-input:focus { width: 150px; }
            .nav-tab { padding: 5px 9px; font-size: 0.8rem; }
        }

        /* ===== Section ===== */
        .section { margin-bottom: 28px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding: 4px 0 10px;
            border-bottom: 1px dashed var(--border);
        }
        .section-icon {
            font-size: 1.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px; height: 30px;
            border-radius: 10px;
            background: var(--bg-card);
            box-shadow: var(--shadow-card);
        }
        .section-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .section-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: auto;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            background: var(--bg-card);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        /* ===== Card（可爱风：badge+标题+描述+右上角微型主题图标+大数字水印+悬停弥散阴影）===== */
        .card {
            display: block;
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 16px 18px 18px;
            min-height: 116px;
            text-decoration: none;
            color: var(--text);
            transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s cubic-bezier(.4,0,.2,1), border-color .25s;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }
        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        /* 卡片右上角微型主题图标 */
        .card-mini-icon {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 26px;
            line-height: 1;
            opacity: 0.78;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.06));
            pointer-events: none;
        }
        .card:hover .card-mini-icon {
            transform: scale(1.18) rotate(-8deg);
            opacity: 1;
        }
        .card-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            background: var(--pill-blue-bg);
            color: var(--pill-blue-fg);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .card-badge[data-kind="pink"]   { background: var(--pill-pink-bg);   color: var(--pill-pink-fg); }
        .card-badge[data-kind="mint"]   { background: var(--pill-mint-bg);   color: var(--pill-mint-fg); }
        .card-badge[data-kind="purple"] { background: var(--pill-purple-bg); color: var(--pill-purple-fg); }
        .card-badge[data-kind="yellow"] { background: var(--pill-yellow-bg); color: var(--pill-yellow-fg); }
        .card-badge[data-kind="blue"]   { background: var(--pill-blue-bg);   color: var(--pill-blue-fg); }
        .card-badge[data-kind="rose"]   { background: var(--pill-rose-bg);   color: var(--pill-rose-fg); }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
            padding-right: 32px;   /* 给右上角图标留位 */
        }
        .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 大数字水印（右侧底部，淡化） */
        .card-watermark {
            position: absolute;
            right: -4px;
            bottom: -22px;
            font-size: 5.6rem;
            font-weight: 800;
            line-height: 1;
            color: var(--card-accent, var(--accent));
            opacity: 0.06;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            pointer-events: none;
            user-select: none;
            letter-spacing: -2px;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            display: none;
        }
        .no-results.show { display: block; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card-hover);
            border: 1px solid var(--border-hover);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 版权水印 */
        .copyright-wm {
            position: fixed;
            right: 10px;
            bottom: 6px;
            z-index: 9999;
            font-size: 11px;
            color: rgba(232, 238, 243, 0.16);
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        footer {
            text-align: center;
            padding: 30px 0 24px;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .card-watermark { font-size: 4.5rem; bottom: -16px; }
        }

        /* Smooth scroll */
        html { scroll-behavior: smooth; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb {
            background: rgba(78, 205, 196, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(78, 205, 196, 0.4); }

    </style>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('wb-theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('wb-theme', next); } catch (e) {}
            var b = document.getElementById('themeToggle');
            if (b) b.textContent = next === 'dark' ? '☀ 浅色' : '🌙 深色';
        }
    </script>
<style id='wb-copyright-style'>
#wb-copyright-note{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9998;pointer-events:none;font-size:12px;font-family:sans-serif;color:#555;opacity:.78;line-height:1.4;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.07);border-radius:999px;padding:3px 14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
    <!-- Hero Banner 迷你 Header（地球IP + 大标题 + Slogan + 3胶囊 + 左右手绘插画） -->
    <div class="hero-banner">
        <!-- 左侧小云朵 -->
        <div class="hero-deco left" aria-hidden="true">
            <svg viewBox="0 0 100 70" fill="none">
                <path d="M14 52 Q4 52 4 42 Q4 32 14 32 Q16 22 28 22 Q40 22 44 32 Q54 28 60 36 Q72 36 72 48 Q72 56 62 56 L18 56 Q14 56 14 52 Z" fill="#ffffff" opacity="0.9"/>
                <path d="M14 52 Q4 52 4 42 Q4 32 14 32 Q16 22 28 22 Q40 22 44 32 Q54 28 60 36 Q72 36 72 48 Q72 56 62 56 L18 56 Q14 56 14 52 Z" fill="none" stroke="#7fc9f0" stroke-width="1.2" opacity="0.7"/>
                <circle cx="50" cy="18" r="3" fill="#ffd166"/>
            </svg>
        </div>
        <!-- 右侧小罗盘 -->
        <div class="hero-deco right" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="38" fill="#fff8e8" stroke="#a0673a" stroke-width="2"/>
                <circle cx="50" cy="50" r="30" fill="#fffdf6" stroke="#d4b896" stroke-width="0.8"/>
                <circle cx="50" cy="50" r="3" fill="#a0673a"/>
                <path d="M50 22 L54 50 L50 78 L46 50 Z" fill="#d04848"/>
                <path d="M22 50 L50 46 L78 50 L50 54 Z" fill="#3d7ab0"/>
                <path d="M50 22 L52 50 L50 78 L48 50 Z" fill="#fff" opacity="0.4"/>
                <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#a0673a">N</text>
                <text x="50" y="92" text-anchor="middle" font-size="7" fill="#a0673a">S</text>
                <text x="10" y="54" text-anchor="middle" font-size="7" fill="#a0673a">W</text>
                <text x="90" y="54" text-anchor="middle" font-size="7" fill="#a0673a">E</text>
            </svg>
        </div>
        <div class="hero-content">
            <div class="hero-title-row">
                <!-- 戴探险帽的小地球 IP -->
                <svg class="hero-globe" viewBox="0 0 48 48" fill="none">
                    <!-- 探险帽帽檐 -->
                    <ellipse cx="24" cy="11" rx="14" ry="2.6" fill="#8B5A2B"/>
                    <!-- 探险帽帽身 -->
                    <path d="M11 11 L37 11 L33 4.5 Q24 0.5 15 4.5 Z" fill="#A0673A"/>
                    <path d="M11 11 L37 11 L33 4.5 Q24 0.5 15 4.5 Z" fill="none" stroke="#5d3a1f" stroke-width="0.5"/>
                    <!-- 帽星 -->
                    <circle cx="31" cy="6" r="2.2" fill="#FFD166"/>
                    <circle cx="31" cy="6" r="0.8" fill="#fff"/>
                    <!-- 帽带 -->

            // Hero Banner 统计徽章数字
            var hs = document.getElementById('heroCountSites'); if(hs) hs.textContent = total;
            var hc = document.getElementById('heroCountCats');  if(hc) hc.textContent = categories.length;
        }

        // Render content（可爱卡片：莫兰迪胶囊 + 标题 + 描述 + 右上角主题图标 + 大数字水印）
        function renderContent(filterText = '', catFilter = 'all') {
            const container = document.getElementById('content');
            const noResults = document.getElementById('noResults');
            let html = '';
            let hasResults = false;
            globalCardIdx = 0;

            categories.forEach(cat => {
                if (catFilter !== 'all' && catFilter !== cat.id) return;

                const filteredSites = cat.sites.filter(s => {
                    if (!filterText) return true;
                    return s.title.toLowerCase().includes(filterText.toLowerCase()) ||
                           s.desc.toLowerCase().includes(filterText.toLowerCase());
                });

                if (filteredSites.length === 0) return;
                hasResults = true;

                html += `<div class="section" data-category="${cat.id}">`;
                html += `<div class="section-header">`;
                html += `<span class="section-icon">${cat.icon}</span>`;
                html += `<span class="section-title">${cat.name}</span>`;
                html += `<span class="section-count">${filteredSites.length} 项</span>`;
                html += `</div>`;
                html += `<div class="grid">`;

                filteredSites.forEach(site => {
                    globalCardIdx++;
                    const isCloudEnv = location.protocol !== 'file:';
                    const isCloudCard = isCloudEnv && site.cloud;

                    // 决定链接 href（云端有 cloud → 用 cloud 链接；本地 → 直接打开本地路径；纯外链 → 原 URL）
                    let href = '#', target = '', cursorStyle = 'cursor: pointer;';
                    if (isCloudCard) {
                        href = site.cloud; target = 'target="_blank"';
                    } else if (site.local) {
                        const fp = 'file:///' + site.path.replace(/\\/g, '/');
                        href = encodeURI(fp); target = 'target="_blank"';
                    } else {
                        href = site.url; target = 'target="_blank"';
                    }

                    // Badge（莫兰迪马卡龙胶囊色按类型分配）
                    let badge = '', kind = 'blue';
                    if (isCloudCard) {
                        if (site.cloud.indexOf('player.html') === 0) { badge = 'Flash 课件'; kind = 'pink'; }
                        else { badge = '在线演示'; kind = 'mint'; }
                    } else if (site.local) {
                        if (site.kind === 'html') { badge = '本地工具'; kind = 'mint'; }
                        else { badge = '本地应用'; kind = 'yellow'; }
                    } else {
                        badge = '在线资源'; kind = 'blue';
                    }
                    // 数据库类（数据云/统计/监测站等）用紫色
                    if (/数据库|数据网|数据$|统计|监测|预报|台|指数|粮农|资源环境|空间数据|减灾|探月|海洋预报|天气网|水利/.test(site.title)) {
                        kind = 'purple';
                    }

                    html += `<a href="${href}" ${target} class="card" style="--card-accent: ${cat.color}; ${cursorStyle}">`;
                    html += `<div class="card-badge" data-kind="${kind}">${badge}</div>`;
                    html += `<div class="card-title">${site.title}</div>`;
                    html += `<div class="card-desc">${site.desc}</div>`;
                    html += `<div class="card-mini-icon">${site.icon || cat.icon}</div>`;
                    html += `<div class="card-watermark">${String(globalCardIdx).padStart(2, '0')}</div>`;
                    html += `</a>`;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
            noResults.classList.toggle('show', !hasResults);
        }

        // Select category
        function selectCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === catId);
            });
            const searchText = document.getElementById('navSearch').value.trim();
            renderContent(searchText, catId);
        }

        // Search
        function handleSearch() {
            const searchText = document.getElementById('navSearch').value.trim();
            renderContent(searchText, activeCategory);
        }

        // Init
        renderCategories();
        renderContent();
    </script>
