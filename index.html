            --bg-card: #1a2734;
            --bg-card-hover: #21303f;
            --border: rgba(78, 205, 196, 0.15);
            --border-hover: rgba(78, 205, 196, 0.4);
            --text: #e8eef3;
            --text-muted: #8a9ba8;
            --accent: #4ecdc4;
            --accent-glow: rgba(78, 205, 196, 0.2);
            --accent2: #ff6b6b;
            --accent3: #feca57;
            --accent4: #54a0ff;
            --accent5: #5f27cd;
            --accent6: #48dbfb;
            --radius: 14px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(78, 205, 196, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(84, 160, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(95, 39, 205, 0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .top-banner {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            text-align: center;
            padding: 14px 24px;
            border-bottom: 2px solid var(--accent);
        }

        .top-banner .school-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .top-banner .school-sub {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 3px;
        }

        header {
            padding: 48px 0 32px;
            text-align: center;
        }

        .header-icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Search */
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 25, 35, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .search-wrapper {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Category tabs */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 32px;
        }

        .cat-btn {
            padding: 8px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            user-select: none;
        }

        .cat-btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        .cat-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f1923;
            font-weight: 600;
        }

        .cat-btn .count {
            margin-left: 4px;
            opacity: 0.7;
            font-size: 0.8em;
        }

        /* Section */
        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .section-icon {
            font-size: 1.5rem;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }

        .section-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        /* Card */
        .card {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--card-accent, var(--accent));
            opacity: 0;
            transition: var(--transition);
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon {
            font-size: 1.8rem;
            line-height: 1;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(78, 205, 196, 0.1);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 4px;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 12px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-url {
            font-size: 0.7rem;
            color: var(--text-muted);
            word-break: break-all;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-link {
            font-size: 0.75rem;
            color: var(--card-accent, var(--accent));
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card:hover .card-link {
            text-decoration: underline;
        }

            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(78, 205, 196, 0.12);
            color: var(--accent);
            margin-right: 4px;
        }

        .local-card {
            border-style: dashed;
        }

        .local-tag {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
            margin-left: 6px;
            vertical-align: middle;
        }

        .cloud-card {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.06), rgba(9, 132, 227, 0.06));
            border-style: solid;
        }

        .cloud-tag {
            background: rgba(0, 184, 148, 0.15);
            color: #00b894;
            margin-left: 6px;
            vertical-align: middle;
        }

        .cloud-note {
            font-size: 0.75rem;
            color: #e17055;
            background: rgba(225, 112, 85, 0.08);
            border-radius: 6px;
            padding: 6px 10px;
            margin: 8px 0;
            line-height: 1.5;
        }

        .local-open {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(78, 205, 196, 0.1);
            transition: var(--transition);
        }

        .local-open:hover {
            background: rgba(78, 205, 196, 0.25);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            display: none;
        }

        .no-results.show {
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card-hover);
            border: 1px solid var(--border-hover);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 版权水印 */
        .copyright-wm {
            position: fixed;
            right: 10px;
            bottom: 6px;
            z-index: 9999;
            font-size: 11px;
            color: rgba(232, 238, 243, 0.16);
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .stats {
                gap: 20px;
            }
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(78, 205, 196, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(78, 205, 196, 0.4);
        }
    </style>
</head>

        let activeCategory = 'all';

        // Render categories
        function renderCategories() {
            const container = document.getElementById('categories');
            let total = 0;
            categories.forEach(c => total += c.sites.length);

            let html = `<div class="cat-btn active" onclick="selectCategory('all')" data-cat="all">全部 <span class="count">${total}</span></div>`;
            categories.forEach(c => {
                html += `<div class="cat-btn" onclick="selectCategory('${c.id}')" data-cat="${c.id}">${c.icon} ${c.name} <span class="count">${c.sites.length}</span></div>`;
            });
            container.innerHTML = html;
            document.getElementById('totalNum').textContent = total;
        }

        // Render content
        function renderContent(filterText = '', catFilter = 'all') {
            const container = document.getElementById('content');
            const noResults = document.getElementById('noResults');
            let html = '';
            let hasResults = false;

            categories.forEach(cat => {
                if (catFilter !== 'all' && catFilter !== cat.id) return;

                let filteredSites = cat.sites.filter(s => {
                    if (!filterText) return true;
                    return s.title.toLowerCase().includes(filterText.toLowerCase()) ||
                           s.desc.toLowerCase().includes(filterText.toLowerCase());
                });

                if (filteredSites.length === 0) return;
                hasResults = true;

                html += `<div class="section" data-category="${cat.id}">`;
                html += `<div class="section-header">`;
                html += `<span class="section-icon">${cat.icon}</span>`;
                html += `<span class="section-title">${cat.name}</span>`;
                html += `<span class="section-desc">${cat.desc}</span>`;
                html += `</div>`;
                html += `<div class="grid">`;

                filteredSites.forEach(site => {
                    const isCloudEnv = location.protocol !== 'file:';
                    if (isCloudEnv && site.cloud) {
                        // 云端环境：本地资源有在线版 → 渲染为可点击的在线卡片
                        const tagText = site.cloud.indexOf('player.html') === 0 ? '在线课件' : '在线演示';
                        html += `<a href="${site.cloud}" target="_blank" class="card cloud-card" style="--card-accent: ${cat.color}">`;
                        html += `<div class="card-header">`;
                        html += `<div class="card-icon" style="background: ${cat.color}1a">${site.icon}</div>`;
                        html += `<div class="card-title">${site.title}<span class="card-tag cloud-tag">${tagText}</span></div>`;
                        html += `</div>`;
                        html += `<div class="card-desc">${site.desc}</div>`;
                        html += `<div class="card-footer">`;
                        html += `<span class="card-url">🌐 云端在线播放，无需安装</span>`;
                        html += `<span class="card-link" style="color: ${cat.color}">开始播放 →</span>`;
                        html += `</div>`;
                        html += `</a>`;
                    } else if (site.local) {
                        // 本地资源卡片（本机环境，或云端但无在线版）
                        const isHtml = site.kind === 'html';
                        const tagText = isHtml ? '本地网页' : '本地应用';
                        const openText = isHtml ? '打开' : '打开应用';
                        html += `<div class="card local-card" style="--card-accent: ${cat.color}" data-path="${site.path}">`;
                        html += `<div class="card-header">`;
                        html += `<div class="card-icon" style="background: ${cat.color}1a">${site.icon}</div>`;
                        html += `<div class="card-title">${site.title}<span class="card-tag local-tag">${tagText}</span></div>`;
                        html += `</div>`;
                        html += `<div class="card-desc">${site.desc}</div>`;
                        if (isCloudEnv) {
                            html += `<div class="cloud-note">⚠️ 该课件体积较大，暂未上线云端，仅限本机运行</div>`;
                        }
                        html += `<div class="card-footer">`;
                        html += `<span class="card-url" title="点击复制路径" style="cursor: pointer;" onclick="copyPath(event, '${site.path.replace(/\\/g, '\\\\')}')">${site.path}</span>`;
                        html += `<span class="card-link local-open" style="color: ${cat.color}; cursor: pointer;" onclick="openLocalApp(event, '${site.path.replace(/\\/g, '\\\\')}')">${openText}</span>`;
                        html += `</div>`;
                        html += `</div>`;
                    } else {
                        const domain = site.url.replace(/^https?:\/\//, '').split('/')[0];
                        html += `<a href="${site.url}" target="_blank" class="card" style="--card-accent: ${cat.color}">`;
                        html += `<div class="card-header">`;
                        html += `<div class="card-icon" style="background: ${cat.color}1a">${site.icon}</div>`;
                        html += `<div class="card-title">${site.title}</div>`;
                        html += `</div>`;
                        html += `<div class="card-desc">${site.desc}</div>`;
                        html += `<div class="card-footer">`;
                        html += `<span class="card-url">${domain}</span>`;
                        html += `<span class="card-link" style="color: ${cat.color}">访问 →</span>`;
                        html += `</div>`;
                        html += `</a>`;
                    }
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
            noResults.classList.toggle('show', !hasResults);
        }

        // Select category
        function selectCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === catId);
            });
            const searchText = document.getElementById('searchInput').value.trim();
            renderContent(searchText, catId);
        }

        // Search
        function handleSearch() {
            const searchText = document.getElementById('searchInput').value.trim();
            renderContent(searchText, activeCategory);
        }

        // 打开本地应用程序
        function openLocalApp(event, path) {
            event.stopPropagation();
            // 尝试通过 file:// 协议打开本地文件（exe 或 html），encodeURI 处理中文与空格
            const fileUrl = 'file:///' + path.replace(/\\/g, '/');
            window.open(encodeURI(fileUrl), '_blank');
            if (path.toLowerCase().endsWith('.html')) {
                showToast('正在打开本地网页…<br>若未弹出，请点击上方路径复制后粘贴到浏览器地址栏');
            } else {
                showToast('正在尝试打开本地应用…<br>若浏览器拦截，请点击上方路径复制后，粘贴到资源管理器地址栏打开');
            }
        }

        // 复制路径到剪贴板
        function copyPath(event, path) {
            event.stopPropagation();
            const realPath = path.replace(/\\\\/g, '\\');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(realPath).then(() => {
                    showToast('✅ 路径已复制到剪贴板：<br>' + realPath);
                }).catch(() => {
                    fallbackCopy(realPath);
                });
            } else {
                fallbackCopy(realPath);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ 路径已复制到剪贴板：<br>' + text);
            } catch (e) {
                showToast('复制失败，请手动复制路径：<br>' + text);
            }
            document.body.removeChild(ta);
        }

        // Toast 提示
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Init
        renderCategories();
        renderContent();
    </script>
