<!DOCTYPE html>
<!-- 横山桥高级中学 孙慧制作 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI地理实验室：锋与天气</title>
<style>
  :root{--bg:#0a1226;--panel:#14213f;--line:#2a3b66;--txt:#eef2fa;--sub:#9fb0d0;--gold:#f5c85a;--cold:#5fa8ff;--warm:#ff9a4d;--stat:#b48cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;font-size:17px;line-height:1.55}
  header{padding:12px 22px 0;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  h1{margin:0;font-size:26px;letter-spacing:1px}
  h1 span{color:var(--gold)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:17px;font-weight:700;padding:9px 16px;border-radius:12px 12px 0 0;border:1px solid var(--line);border-bottom:none;background:#16244a;color:var(--sub);cursor:pointer}
  .tabs button.on{background:var(--panel);color:var(--txt);box-shadow:inset 0 3px 0 var(--gold)}
  .wrap{display:grid;grid-template-columns:205px minmax(0,1fr);gap:16px;padding:0 22px 22px;align-items:start}
  .wrap>div{margin-top:0}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;padding:0 10px 18px}header{padding:10px 10px 0}h1{font-size:21px}}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:0 16px 16px 16px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .btn{font:inherit;font-size:20px;font-weight:700;padding:13px 12px;border-radius:14px;border:2px solid var(--line);background:#1b2b52;color:var(--txt);cursor:pointer;text-align:left;transition:all .2s;width:100%}
  .btn small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.cold.on{background:#1f4d8f;border-color:var(--cold)}
  .btn.warm.on{background:#7a3b12;border-color:var(--warm)}
  .btn.meet{border-color:var(--gold)}
  .btn.meet.on{background:var(--gold);color:#2a1d00}
  .btn.meet.on small{color:#4a3a10}
  .btn.small{font-size:16px;padding:9px 12px}
  .sl{background:#0f1a33;border-radius:12px;padding:8px 10px}
  .sl label{display:flex;justify-content:space-between;font-size:15px;color:var(--sub)}
  .sl label b{color:var(--txt)}
  .sl input{width:100%;accent-color:var(--gold)}
  .sl label.chk{justify-content:flex-start;gap:8px;align-items:center;color:var(--txt);cursor:pointer}
  .sl label.chk input{width:auto;transform:scale(1.3)}
  .sl .hint{font-size:12.5px;color:var(--sub)}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
  .view{position:relative;border-radius:12px;overflow:hidden}
  .view canvas{display:block;width:100%;height:auto}
  #ov{position:absolute;inset:0;width:100%;height:100%}
  .tl{display:flex;gap:8px;align-items:center;margin-top:8px}
  .tl input{flex:1;accent-color:var(--gold)}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  @media (max-width:900px){.info{grid-template-columns:1fr}}
  .card{background:#0f1a33;border-radius:12px;padding:10px 14px}
  .card h3{margin:0 0 4px;font-size:17px;color:var(--gold)}
  .card p{margin:0;font-size:16px}
  .q button{font:inherit;font-size:15px;margin-top:8px;padding:6px 12px;border-radius:9px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
  .ans{display:none;margin-top:6px;color:#dfe6f5;font-size:15.5px}
  .st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
  .st div{background:#16244a;border-radius:8px;padding:4px 8px}
  .st .k{font-size:12px;color:var(--sub)}
  .st .v{font-size:18px;font-weight:700}
  #ch{width:100%;height:auto;display:block;margin-top:6px}
  .note{font-size:13px;color:var(--sub);margin-top:8px}
  #g3{display:block;width:100%;height:auto;background:linear-gradient(#a9dcf3,#dff3fb 55%,#cfe6d8)}
  #lbl{position:absolute;inset:0;cursor:grab;touch-action:none;overflow:hidden}
  .l3{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;font-size:17px;padding:3px 10px;border-radius:8px;background:rgba(6,12,28,.62);color:#fff;pointer-events:none}
  .l3.cold{color:#bfe3ff}.l3.warm{color:#ffd9b8}.l3.surf{background:rgba(255,255,255,.85);color:#123}.l3.line{background:rgba(255,255,255,.85);color:#123;transform:translate(-50%,10%)}
  .l3.ab{background:none;color:#fff;text-shadow:0 1px 3px #000;transform:translate(-50%,10%)}.l3.rain{color:#d6ecff;font-size:15px}.l3.note{color:#ffe7a8;font-size:16px}.l3.st{color:#f5c85a;font-size:14px}
  .l3.big{font-size:17px;padding:0;background:none;text-shadow:0 1px 2px rgba(0,0,0,.55)}.l3.ab.big{font-size:22px}
  .l3.cold.big{color:#e8f4ff}.l3.warm.big{color:#fff1e2}
  .l3.school{background:none;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);transform:translate(-50%,0)}
  .l3.tag{background:none;padding:0 0 0 12px;font-size:13px;font-weight:700;color:#ffe066;text-shadow:0 1px 2px rgba(0,0,0,.8);transform:translate(-5px,-50%)}
  .l3.tag::before{content:'';position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:50%;background:#ffd23a;box-shadow:0 0 0 2px rgba(0,0,0,.35);transform:translateY(-50%)}
  .l3.tag{font-size:17px}.l3.tS{color:#ffe14d}.l3.tS::before{background:#ffe14d;box-shadow:0 0 8px #ffe14d}.l3.tL{color:#ff5a48}.l3.tL::before{background:#ff2a1a;box-shadow:0 0 8px #ff2a1a}
  .badge{position:absolute;left:8px;top:6px;background:rgba(255,255,255,.88);border-radius:7px;padding:1px 8px;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .badge b{font-size:15px}.badge span{font-size:11px;color:#556;border-left:1px solid #99a;padding-left:8px;line-height:1.1;max-width:90px}
  .badge.cold b{color:#1f6fe0}.badge.warm b{color:#d83a2c}.badge.stat b{color:#8a6a1a}.badge.none b{color:#1b2b52}
  .hide{display:none!important}
  #nogl{display:none;padding:40px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>AI<span>地理实验室</span>：锋与天气</h1>
  <div class="tabs">
    <button data-mode="0" class="on">① 气团相遇</button>
    <button data-mode="1">② 冷锋</button>
    <button data-mode="2">③ 暖锋</button>
    <button data-mode="3">④ 准静止锋</button>
  </div>
</header>
<div class="wrap">
  <div class="side">
    <div id="labCtl">
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn cold" id="bCold">❄ 冷气团<small>温度低 · 密度大 · 干燥</small></button>
        <button class="btn warm" id="bWarm">☀ 暖气团<small>温度高 · 密度小 · 湿润</small></button>
        <button class="btn meet" id="bMeet" disabled>⇄ 相遇<small>先请出两个气团</small></button>
        <div class="sl"><label>冷气团大小 <b id="lcs">中</b></label><input id="cs" type="range" min="60" max="140" value="100"><div class="hint">越大越厚，锋面越高，锋线越往暖气团一侧推进</div></div>
        <div class="sl"><label>暖气团大小 <b id="lws">中</b></label><input id="ws" type="range" min="60" max="140" value="100"><div class="hint">越大水汽越多，云越厚</div></div>
        <button class="btn small" id="bReset">↺ 重做实验</button>
      </div>
    </div>
    <div id="frontCtl" class="hide">
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn meet" id="bPlay">▶ 播放<small>观察锋的形成与移动</small></button>
        <button class="btn small" id="bRe">↺ 重来</button>
        <button class="btn small" id="bView">⟲ 视角复位<small>拖动画面可旋转，滚轮缩放</small></button>
        <div class="sl"><label>播放速度 <b id="lsp">中</b></label><input id="sp" type="range" min="50" max="200" value="100"></div>
        <div class="sl"><label class="chk"><input type="checkbox" id="cbCurve" checked>显示站点曲线</label><div class="hint">可先关闭，让学生在学案上画，再打开对照</div></div>
        <input type="checkbox" id="cbLab" checked class="hide">
      </div>
    </div>
  </div>
  <div class="stage">
    <div class="view">
      <canvas id="gl" width="1200" height="640"></canvas>
      <canvas id="ov" width="1200" height="640"></canvas>
      <canvas id="g3" width="1200" height="640" class="hide"></canvas>
      <div id="lbl" class="hide"><div id="badge" class="badge"></div></div>
      <div id="nogl">当前浏览器不支持 WebGL，无法显示实验画面，请换用新版 Chrome 或 Edge。</div>
    </div>
    <div class="tl hide" id="tlBox"><span style="font-size:14px;color:var(--sub)">进度</span><input id="tl" type="range" min="0" max="1000" value="0"></div>
    <div class="info">
      <div class="card" id="leftCard"><h3 id="stepT">第 1 步</h3><p id="stepP">点击“冷气团”，请出第一位“选手”。</p>
        <div id="stBox" class="hide">
          <div class="st"><div><div class="k">气温</div><div class="v" id="vT"></div></div><div><div class="k">气压</div><div class="v" id="vP"></div></div><div><div class="k">风</div><div class="v" id="vW" style="font-size:15px"></div></div><div><div class="k">控制</div><div class="v" id="vA" style="font-size:15px"></div></div></div>
          <canvas id="ch" width="600" height="230"></canvas>
        </div>
      </div>
      <div class="card q"><h3>想一想</h3><p id="qP"></p><button id="qBtn">揭晓答案</button><div class="ans" id="qA"></div></div>
    </div>
    <div class="note">说明：示意模拟，高度方向放大了几十倍，真实锋面坡度通常只有约 1/50～1/300；左侧为北、右侧为南（以我国为例）；站点数值为示意，只看变化趋势。</div>
  </div>
</div>

uniform float uCS, uWS, uXF, uH, uL, uWTop;

  else if(meetT<0){T='两个气团都到齐了';P='它们的温度、湿度、密度差别很大。猜一猜：相遇后会混在一起，还是“各占地盘”？点击“相遇”验证。';}
  else if(after<=0){T='相遇中……';P='观察：冷气团往哪里钻？暖气团被挤到了哪里？可以拖动画面换个角度看。';}
  else if(after<2.6){T='锋面形成';P='冷暖气团性质差异大、不易混合，交界面叫锋面，它与地面的交线叫锋线。冷气团在下、暖气团在上，锋面向冷气团一侧倾斜。';}
  else if(after<5){T='暖空气沿锋面爬升';P='暖湿空气密度小，沿着倾斜的锋面上升；上升过程中气温降低，水汽冷却凝结成云。';}
  else {T='锋面天气';P='云中形成降水，雨区落在锋面下方的冷气团一侧，天空转阴。试试拖动滑块，改变两个气团的大小。';}
  setText(T,P); }
function setUniforms(o){ if(!gl) return; gl.viewport(0,0,W,H); gl.uniform2f(U.uRes,W,H); for(const k in o) gl.uniform1f(U[k],o[k]); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }

function frameLab(dt){
  if(hasCold) coldIn=Math.min(1,coldIn+dt/1.5);
  if(hasWarm) warmIn=Math.min(1,warmIn+dt/1.5);
  if(meetT>=0) meetT+=dt;
  const meet=meetT<0?0:ease(meetT/5), after=meetT<0?0:Math.max(0,meetT-5);
  const XF=(0.52+0.10*(CS-WS))*A, Hh=Math.max(0.22,Math.min(0.52,0.40*CS)), WT=Math.min(0.85,0.62*WS);
  const g=Math.max(0,Math.min(1,(after-1.6)/3.5));
  setUniforms({uTime:clock,uMode:0,uCold:ease(coldIn),uWarm:ease(warmIn),uMeet:meet,uCS:CS,uWS:WS,uXF:XF,uH:Hh,uL:0.20,uWTop:WT,
    uG:g,uCT0:0.12*WS,uCT1:0.40*WS,uTowL:0.30,uSpan:1.0,uStrat:0,uR0:0.04,uR1:0.62,uRain:Math.max(0,Math.min(1,(after-4.2)/1.5)),uHeavy:0.5,uCFlow:1+1.5*meet,uWFlow:-(1+meet),uWind:Math.max(0,Math.min(1,(after-5.5)/1.5)),uCirrus:0});
  ctx.clearRect(0,0,W,H);
  const wedge=x=> x<XF? Hh*(1-Math.exp(-(XF-x)/0.20)):0;
  if(meetT<0){
    if(hasCold&&coldIn>0.7) label('冷气团  约 -10℃  干冷  密度大',px(0.27*A),py(GY+0.30*CS+0.06),'#d6ecff',19);
    if(hasWarm&&warmIn>0.7) label('暖气团  约 20℃  暖湿  密度小',px(0.74*A),py(GY+Math.min(0.80,0.46*WS)+0.06),'#ffe1c4',19);
  } else {
    if(meetT<5){ arrow(px(0.12*A),py(GY+0.05),px(0.12*A)+90+120*meet,py(GY+0.05),'#d6ecff',4); arrow(px(0.92*A),py(GY+0.30),px(0.92*A)-90-140*meet,py(GY+0.30),'#ffe1c4',4); }
    label('冷气团（密度大，在下）',px(0.14*A),py(GY+0.06),'#d6ecff',18);
    label('暖气团（密度小，在上）',px(0.84*A),py(GY+Math.min(0.8,WT)-0.06),'#ffe1c4',18);
  }
  if(after>0){
    const xl=XF-0.42;
    if(after>0.6) label('锋面',px(xl)-20,py(GY+wedge(xl))-18,'#ffffff',21);
    if(after>1.0){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px(XF),py(GY),7,0,7); ctx.fill(); label('锋线（锋面与地面的交线）',px(XF)+30,py(GY)+44,'#ffffff',16,false); }
    if(after>1.8){ const y=py(GY+Hh+0.07); arrow(px(XF-0.05),y,px(XF-0.55),y,'#f5c85a',4); label('锋面向冷气团一侧倾斜',px(XF-0.30),y-12,'#f5c85a',19); }
    if(after>2.6){ label('暖湿空气沿锋面爬升 ↖',px(XF+0.22),py(GY+0.10),'#ffe1c4',17); arrow(px(XF+0.10),py(GY+0.03),px(XF-0.02),py(GY+0.13),'#ffd2a8',3); }
    if(after>4.0) label('上升冷却，凝结成云',px(XF-0.62),py(GY+Hh+0.10),'#ffffff',17);
    if(after>5.0) label('降水落在冷气团一侧',px(XF-0.33),py(GY)+44,'#d6ecff',17,false);
    if(after>6.5) label('锋面附近：风力加大、气温变化',px(0.20*A),py(GY+Hh*0.5),'#e6f1ff',16);
  }
  let T,P;
  if(!hasCold&&!hasWarm){T='第 1 步';P='点击“冷气团”，请出第一位“选手”。可以先用滑块调整两个气团的大小。';}
  else if(hasCold&&!hasWarm){T='冷气团登场';P='冷气团多形成于高纬内陆（如西伯利亚、蒙古）：温度低、湿度小、密度大，沉甸甸地贴着地面。再点击“暖气团”。';}
  else if(!hasCold&&hasWarm){T='暖气团登场';P='暖气团多形成于低纬海洋：温度高、湿度大、密度小，是一团轻而湿的空气。再点击“冷气团”。';}
  else if(meetT<0){T='两个气团都到齐了';P='它们的温度、湿度、密度差别很大。猜一猜：相遇后会混在一起，还是“各占地盘”？点击“相遇”验证。';}
  else if(after<=0){T='相遇中……';P='观察：冷气团往哪里钻？暖气团被挤到了哪里？';}
  else if(after<2.6){T='锋面形成';P='冷暖气团性质差异大、不易混合，交界面叫锋面，它与地面的交线叫锋线。冷气团在下、暖气团在上，锋面向冷气团一侧倾斜。';}
  else if(after<5){T='暖空气沿锋面爬升';P='暖湿空气密度小，沿着倾斜的锋面上升；上升过程中气温降低，水汽冷却凝结成云。';}
  else {T='锋面天气';P='云中形成降水，雨区落在锋面下方的冷气团一侧；锋面附近常伴有大风、降温等天气。试试拖动滑块，改变两个气团的大小。';}
  setText(T,P);
}

const chc=$('ch'), cx2=chc.getContext('2d');
function drawChart(){
  const c=cx2, x0=70,y0=20,w=500,h=170; c.clearRect(0,0,600,230);
  c.strokeStyle='#5a6c95'; c.lineWidth=2; c.strokeRect(x0,y0,w,h);
  c.fillStyle='#9fb0d0'; c.font='20px sans-serif'; c.textAlign='left'; c.fillText('时间 →',x0+w-70,y0+h+30);
  c.fillStyle='#ff7b6b'; c.fillText('— 气温',x0,y0+h+30); c.fillStyle='#7fb8ff'; c.fillText('- - 气压',x0+110,y0+h+30);
  if(!$('cbCurve').checked){ c.fillStyle='#9fb0d0'; c.textAlign='center'; c.font='22px sans-serif'; c.fillText('曲线已隐藏：请先在学案上画一画',x0+w/2,y0+h/2+8); return; }
  if(hist.length<2) return;
  const tr= mode===3?[20,32]:[-6,18], pr= mode===3?[1000,1010]:[1005,1036];
  const X=t=>x0+t*w, YT=v=>y0+h-(v-tr[0])/(tr[1]-tr[0])*h, YP=v=>y0+h-(v-pr[0])/(pr[1]-pr[0])*h;
  c.lineWidth=4; c.strokeStyle='#ff7b6b'; c.setLineDash([]); c.beginPath(); hist.forEach((p,i)=>i?c.lineTo(X(p[0]),YT(p[1])):c.moveTo(X(p[0]),YT(p[1]))); c.stroke();
  c.strokeStyle='#7fb8ff'; c.setLineDash([12,9]); c.beginPath(); hist.forEach((p,i)=>i?c.lineTo(X(p[0]),YP(p[2])):c.moveTo(X(p[0]),YP(p[2]))); c.stroke(); c.setLineDash([]);
}
let lastTxt='';
function setText(T,P){ if(T+P===lastTxt) return; $('stepT').textContent=T; $('stepP').textContent=P; lastTxt=T+P; }

let last=0;
function loop(ts){ const dt=last?Math.min(0.05,(ts-last)/1000):0; last=ts; clock+=dt; frame3D(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ---------- 交互 ----------
const bCold=$('bCold'), bWarm=$('bWarm'), bMeet=$('bMeet');
function syncLab(){ bCold.classList.toggle('on',hasCold); bWarm.classList.toggle('on',hasWarm); bMeet.disabled=!(hasCold&&hasWarm)||meetT>=0; bMeet.classList.toggle('on',meetT>=0);
  bMeet.querySelector('small').textContent=(hasCold&&hasWarm)?(meetT>=0?'正在观察锋面天气':'让两个气团碰面'):'先请出两个气团'; }
bCold.onclick=()=>{ if(!hasCold){hasCold=true;coldIn=0;syncLab();} };
bWarm.onclick=()=>{ if(!hasWarm){hasWarm=true;warmIn=0;syncLab();} };
bMeet.onclick=()=>{ meetT=0; syncLab(); };
$('bReset').onclick=()=>{ hasCold=hasWarm=false; coldIn=warmIn=0; meetT=-1; syncLab(); };
const sizeName=v=>v<80?'小':v<=120?'中':'大';
$('cs').oninput=e=>{ CS=e.target.value/100; $('lcs').textContent=sizeName(+e.target.value)+'（'+e.target.value+'%）'; };
$('ws').oninput=e=>{ WS=e.target.value/100; $('lws').textContent=sizeName(+e.target.value)+'（'+e.target.value+'%）'; };
const bPlay=$('bPlay');
function syncPlay(){ bPlay.firstChild.textContent = playing?'⏸ 暂停':'▶ 播放'; }
bPlay.onclick=()=>{ if(prog>=1){ prog=0; hist=[]; } playing=!playing; syncPlay(); };
$('bView').onclick=()=>{ if(S3){ S3.theta=0.22; S3.phi=0.40; S3.rad=23; } };
$('bRe').onclick=()=>{ prog=0; hist=[]; playing=false; $('tl').value=0; syncPlay(); };
$('sp').oninput=e=>{ speed=e.target.value/100; $('lsp').textContent= speed<0.8?'慢':speed<=1.3?'中':'快'; };
$('tl').oninput=e=>{ const target=e.target.value/1000; hist=[]; for(let i=0;i<=200;i++){ prog=target*i/200; const s=station(); hist.push([prog,s.T,s.P]); } prog=target; };
$('qBtn').onclick=()=>{ const a=$('qA'); a.style.display=a.style.display==='block'?'none':'block'; };
function setMode(m){ mode=m; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.mode===m));
  $('labCtl').classList.toggle('hide',m!==0); $('gl').classList.add('hide'); $('ov').classList.add('hide'); $('g3').classList.remove('hide'); $('lbl').classList.remove('hide'); $('frontCtl').classList.toggle('hide',m===0); $('tlBox').classList.toggle('hide',m===0); $('stBox').classList.toggle('hide',m===0);
  $('qP').textContent=Q[m].q; $('qA').innerHTML=Q[m].a; $('qA').style.display='none';
  prog=0; hist=[]; playing=false; $('tl').value=0; syncPlay(); lastTxt=''; }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));
syncLab(); setMode(0);
</script>
